<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>雪山雲海桌布</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a3550;
               user-select: none; -webkit-user-select: none; -webkit-user-drag: none; cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; pointer-events: none; }
  #hud { position: fixed; left: 10px; bottom: 8px; font: 12px/1.5 Consolas, monospace; color: rgba(255,255,255,.85);
         background: rgba(0,0,0,.4); padding: 4px 8px; border-radius: 4px; white-space: pre; display: none; }
  body.debug #hud { display: block; }
  #nogl { display: none; position: fixed; inset: 0; color: #dde; font: 14px sans-serif; padding: 24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="nogl">這個主題需要 WebGL2。</div>
<script>
/* =====================================================================================
 * 雪山雲海 (snowpeak) — a Taiwanese high-mountain viewpoint (玉山 / 合歡山 feel) as a live wallpaper
 * 2026-10-13 first version, 2026-10-13 second round (massifs, eroded ribs, billow sea, 3D tents, streak snow)
 *
 * Fully procedural, raw WebGL2, no libraries, no model / image files.
 *  - Terrain: the mountains are CREST POLYLINES (JS table MASSIFS → uniform arrays). Height = smooth max over the
 *    segments of (crest height − a concave flank profile of the distance to the crest), so every massif has a broad
 *    base that keeps going down under the cloud sea. Erosion is done in each crest's own coordinates (u along the
 *    crest, d down the flank): ridged noise stretched down the fall line gives arêtes and couloirs that run downhill
 *    and meander, faded out where two crests meet (valley floors). A derivative-damped fbm (iq) adds rock texture.
 *    The foreground is a separate analytic slope (箭竹 grass, slate outcrops, 玉山圓柏 mats) that rolls off into
 *    the void above the 雲海.
 *  - The camera never moves: the terrain DEPTH is ray-marched once (on resize, in strips); materials, analytic
 *    normals, sun shadow, AO and the spindrift source mask are baked into a G-buffer (3 × RGBA8 MRT) that is re-baked
 *    only when the key light has moved ~0.5°, spread over CONFIG.bakeStrips frames into a back buffer and swapped
 *    in when complete — the depth is NOT re-marched for that.
 *  - Per frame, one full-screen pass shades the G-buffer (rock / snow / grass / juniper / forest, alpenglow, aerial
 *    perspective + height fog), the analytic sky (sun, glow, twilight, Belt of Venus, moon, stars, Milky Way, a
 *    cloud deck that comes down and swallows the summits in a storm), the 雲海 as a heightfield of billow noise
 *    (surface-marched, lit per lump with self-shadowing toward a low sun, soft where it meets the slopes), the 雲瀑
 *    pouring over the saddle of the near range, crepuscular shafts, spindrift plumes off the crests, the camps
 *    (ray-traced dome tents) and the 等你 star. A second pass draws wind-angled streaking snow in depth layers.
 *  - Infrastructure (state machine, polling, Taipei sun, day/night, wpPause, bench, session slots) is shared with
 *    the other themes (meadow-real / ocean).
 * References (techniques, re-implemented; nothing copied): iq "terrain raymarching", "fbm with derivatives"
 * (eroded look), "fog" (analytic height fog), "soft shadows"; franpiaggio/shader-terrain-landscapes (MIT) for the
 * march + slope/height materials; Rune Skovbo Johansen's gully-erosion ideas (ribs that follow the fall line).
 * ===================================================================================== */

/* ------------------------------ config ------------------------------ */
const FPS = 30;
// render at the screen's physical resolution, capped at ~2.1 MP (1920×1080) so big / HiDPI screens stay in budget;
// ?res=<scale of the physical size> overrides (tests). 2026-10-13: was a fixed 0.5 — the half-res 1-sample silhouettes
// and cloud contours stair-stepped visibly after the 2× upscale.
const RES_OVERRIDE = +(new URLSearchParams(location.search).get('res') || 0);
const MAX_PIXELS = 1920 * 1080;
function resScale(w, h) { return RES_OVERRIDE || Math.min(1, Math.sqrt(MAX_PIXELS / (w * h))); }
const CONFIG = { fullTransition: 4.0, polling: true, clockHours: /[?&]day=1/.test(location.search) ? 10.5 : /[?&]night=1/.test(location.search) ? 22 : null, skip: '',
                 bakeStrips: 120, rebakeDeg: 0.5, rebakeSec: 900, windOffset: 0 };   // clockHours: test override (0–24), null = real time
const DEBOUNCE_MS = 300;
const POLL_MS = 1000;
const PITCH = -0.05;                         // radians: the horizon sits a little above the middle of the screen
const VFOV = 0.80;                           // vertical field of view (radians) ≈ 46°
const ZFAR = 45.0;                           // km — world units are kilometres, the camera is the origin
const EYE_Y = 0.0;

// parameter ranges (used to normalise transition distances)
const PARAMS = {
  seaLevel:      [-0.6, 0.0],                // top of the 雲海 in front of the near range (km relative to the eye)
  seaBack:       [-0.6, 0.0],                // the pool behind the near range (rises above the saddle → 雲瀑)
  seaDensity:    [0, 1],                     // how solid the cloud sea is
  cascade:       [0, 1],                     // 雲瀑 over the saddle of the near range
  churn:         [0, 1],                     // how hard the cloud sea works: flow speed, surges pushing up the valleys
  highCloud:     [0, 1],                     // a few thin high wisps (never enough to dull the light)
  spindrift:     [0, 1],                     // 風吹雪: snow blown off the ridges and across the slope (strongest in storm)
  dust:          [0, 1],                     // 鑽石塵: sparse ice crystals glinting (cold mornings, clearing)
  skyBrightness: [0, 1],                     // 1 full light … waiting dims a little
  warmth:        [0, 1],                     // golden light (clearing)
  haze:          [0, 1],                     // aerial perspective / mist density
  beacon:        [0, 1],                     // 等你 star
};
// a real 雲海 needs clear, stable weather (an inversion): the sky above stays clear in every state
const STATES = {
  clear:    { seaLevel: -0.40, seaBack: -0.40, seaDensity: 0.80, cascade: 0.00, churn: 0.00, highCloud: 0.10, spindrift: 0.04, dust: 0.60, skyBrightness: 1.00, warmth: 0.10, haze: 0.25, beacon: 0 },
  overcast: { seaLevel: -0.41, seaBack: -0.16, seaDensity: 0.90, cascade: 0.60, churn: 0.35, highCloud: 0.16, spindrift: 0.30, dust: 0.30, skyBrightness: 1.00, warmth: 0.05, haze: 0.30, beacon: 0 },
  storm:    { seaLevel: -0.35, seaBack: -0.08, seaDensity: 1.00, cascade: 1.00, churn: 1.00, highCloud: 0.12, spindrift: 1.00, dust: 0.00, skyBrightness: 1.00, warmth: 0.00, haze: 0.35, beacon: 0 },
  clearing: { seaLevel: -0.48, seaBack: -0.48, seaDensity: 0.55, cascade: 0.00, churn: 0.10, highCloud: 0.16, spindrift: 0.08, dust: 1.00, skyBrightness: 1.00, warmth: 1.00, haze: 0.22, beacon: 0 },
  waiting:  { seaLevel: -0.42, seaBack: -0.42, seaDensity: 0.80, cascade: 0.00, churn: 0.00, highCloud: 0.12, spindrift: 0.02, dust: 0.40, skyBrightness: 0.85, warmth: 0.10, haze: 0.30, beacon: 1 },
};
const KEYS = { '1': 'clear', '2': 'overcast', '3': 'storm', '4': 'clearing', '5': 'waiting' };

/* ------------------------------ the mountains: crest polylines ------------------------------ */
// points [x, z, crest height] in km (camera at the origin looking down +z, heights relative to the eye ≈ 3,400 m);
// s1 / s2: flank steepness on the side with positive / negative cross(segment, p − A) (for a chain running
// left → right s1 is the far side, s2 the face we see); amp: rib (arête / couloir) amplitude; sp: rib spacing (km)
const M = (pts, k = 0.8, hk = 1.45) => pts.map(([x, z, h]) => [x * k, z * k, h > 0 ? h * hk : h * 1.2]);   // main range: closer, taller
const MASSIFS = [
  // far wall, 18–28 km: long, high, mostly lost in the haze; its highest bump sits left of centre
  { s1: 0.60, s2: 0.75, amp: 0.10, sp: 1.40, pts: [[-34, 29, 0.20], [-24, 26, 0.48], [-19, 25.5, 0.30], [-14.5, 23.5, 0.66], [-11, 24.5, 0.42],
                                                   [-6.0, 22.5, 1.00], [-3.5, 23.5, 0.62], [-1.0, 21.5, 0.80], [2.5, 23.0, 0.50], [5.0, 22.0, 0.86],
                                                   [8.5, 24.0, 0.52], [13, 23, 0.92], [17, 24.5, 0.55], [22, 25, 0.70], [34, 28, 0.25]] },
  // main range west: low ridges in the left third, a secondary summit just right of it
  { s1: 0.95, s2: 1.10, amp: 0.16, sp: 0.50, pts: M([[-16, 15.5, -0.15], [-11.5, 14.4, 0.10], [-9.5, 13.8, -0.02], [-7.4, 13.4, 0.12], [-5.6, 13.0, 0.0], [-3.6, 12.4, 0.24], [-2.6, 11.8, 0.40],
                                                   [-1.8, 11.5, 0.50], [-1.2, 11.3, 0.40], [-0.6, 11.0, 0.06]]) },
  { s1: 1.20, s2: 1.20, amp: 0.18, sp: 0.36, pts: M([[-1.8, 11.5, 0.50], [-1.25, 10.4, 0.02], [-0.8, 9.6, -0.60]]) },
  // the hero massif: a long west ridge with a notch and a shoulder, a short summit ridge, a steep drop to the east
  { s1: 1.15, s2: 1.35, amp: 0.34, sp: 0.42, pts: M([[-0.6, 11.0, 0.06], [0.3, 10.4, 0.26], [1.25, 9.8, 0.60], [1.72, 9.55, 0.53], [2.10, 9.38, 0.73],
                                                   [2.60, 9.50, 0.86], [2.95, 9.66, 0.83], [3.55, 10.2, 0.44], [5.2, 11.0, 0.24], [7.4, 12.0, 0.36], [9.8, 13.3, 0.08], [14, 15, -0.2]]) },
  // spurs running diagonally toward us (their gullies read as chevrons); between them the summit wall with couloirs
  { s1: 1.25, s2: 1.25, amp: 0.20, sp: 0.32, pts: M([[2.60, 9.50, 0.86], [2.00, 8.70, 0.30], [1.50, 8.00, -0.30], [1.10, 7.40, -0.80]]) },
  { s1: 1.25, s2: 1.25, amp: 0.20, sp: 0.32, pts: M([[2.95, 9.66, 0.83], [3.70, 8.90, 0.30], [4.40, 8.20, -0.30], [5.00, 7.60, -0.80]]) },
  { s1: 1.20, s2: 1.20, amp: 0.18, sp: 0.32, pts: M([[1.25, 9.80, 0.60], [0.60, 9.00, 0.02], [0.10, 8.40, -0.60]]) },
  { s1: 1.00, s2: 1.00, amp: 0.18, sp: 0.36, pts: M([[7.4, 12.0, 0.36], [6.6, 10.9, -0.05], [6.0, 10.0, -0.55]]) },
  // the near range, 2.5–4 km: a dam across the valley with a saddle in the middle (the 雲瀑 pours over it)
  { s1: 0.85, s2: 1.05, amp: 0.06, sp: 0.15, pts: [[-1.3, 3.4, -0.66], [-0.65, 2.90, -0.32], [-0.15, 2.62, -0.14], [0.25, 2.52, -0.19], [0.60, 2.50, -0.26],
                                                   [0.95, 2.55, -0.18], [1.50, 2.72, -0.07], [2.20, 3.10, -0.15], [3.00, 3.60, -0.34], [3.9, 4.1, -0.66]] },
];
const SADDLE = [0.60, -0.26, 2.50];          // where the 雲瀑 pours over the near range
function buildSegments() {
  const A = [], B = [], C = [];
  MASSIFS.forEach((m, ci) => {
    let u = 0;
    for (let i = 0; i + 1 < m.pts.length; i++) {
      const [x0, z0, h0] = m.pts[i], [x1, z1, h1] = m.pts[i + 1];
      A.push(x0, z0, x1, z1); B.push(h0, h1, m.s1, m.s2); C.push(m.amp, m.sp, 11.3 * ci + 3.7, u);
      u += Math.hypot(x1 - x0, z1 - z0);
    }
  });
  return { A: new Float32Array(A), B: new Float32Array(B), C: new Float32Array(C), n: A.length / 4 };
}
const SEGS = buildSegments();
const MAX_SEG = 64;

/* ------------------------------ state machine (same as the other themes) ------------------------------ */
const smooth = t => t * t * (3 - 2 * t);
let current = { ...STATES.clear };
let from = { ...current }, to = { ...current };
let tStart = 0, tDur = 0;
let stateName = 'clear', pending = null, debounceT = 0;
let override = null;
function now() { return performance.now() / 1000; }
function step(t) {
  const k = tDur > 0 ? Math.min(1, (t - tStart) / tDur) : 1;
  const e = smooth(k);
  for (const p in PARAMS) current[p] = from[p] + (to[p] - from[p]) * e;
}
function applyState(name) {
  if (!STATES[name]) return;
  const t = now();
  step(t);
  from = { ...current };
  to = { ...STATES[name] };
  let dist = 0;
  for (const p in PARAMS) { const [lo, hi] = PARAMS[p]; dist = Math.max(dist, Math.abs(to[p] - from[p]) / (hi - lo)); }
  tStart = t; tDur = CONFIG.fullTransition * dist; stateName = name;
}
function requestState(name) {
  if (!STATES[name]) return;
  pending = name;
  clearTimeout(debounceT);
  debounceT = setTimeout(() => { if (pending !== stateName) applyState(pending); pending = null; }, DEBOUNCE_MS);
}

/* ------------------------------ inputs ------------------------------ */
for (const ev of ['contextmenu', 'selectstart', 'dragstart', 'mousedown']) addEventListener(ev, e => e.preventDefault());
addEventListener('keydown', e => {
  if (KEYS[e.key]) requestState(KEYS[e.key]);
  if (e.key === 'd') document.body.classList.toggle('debug');
});
let lastPolled = null, sessionsFile = null, sessionsOverride = null;
async function poll() {
  if (!CONFIG.polling) return;
  try {
    const r = await fetch('state.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json(), s = j.state;
      if (STATES[s] && s !== lastPolled) { lastPolled = s; requestState(s); }
      sessionsFile = Array.isArray(j.sessions) ? Array.from({ length: 5 }, (_, i) => STATES[j.sessions[i]] ? j.sessions[i] : null) : null;
    }
  } catch { /* unreadable → keep the current state */ }
}
setInterval(poll, POLL_MS);
poll();

/* ------------------------------ day / night (Taipei; same model as the other themes) ------------------------------ */
function sunAltitude(date, lat = 25.04, lon = 121.56) {
  const rad = Math.PI / 180;
  const n = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
  const L = (280.46 + 0.9856474 * n) % 360;
  const g = ((357.528 + 0.9856003 * n) % 360) * rad;
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
  const eps = (23.439 - 0.0000004 * n) * rad;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda));
  const dec = Math.asin(Math.sin(eps) * Math.sin(lambda));
  const gmst = (280.46061837 + 360.98564736629 * n) % 360;
  const ha = (gmst + lon) * rad - ra;
  return Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
}
function sky() {
  let d = new Date();
  if (CONFIG.clockHours != null) { d = new Date(d); d.setHours(0, 0, 0, 0); d = new Date(d.getTime() + CONFIG.clockHours * 3600000); }
  const alt = sunAltitude(d);
  const night = 1 - smooth(Math.min(1, Math.max(0, (alt + 9) / 13)));
  const twilight = Math.exp(-Math.pow((alt + 1.5) / 5, 2));
  const hours = d.getHours() + d.getMinutes() / 60;
  const frac = Math.min(1, Math.max(0, (hours - 5.5) / 13));
  const sunUp = smooth(Math.min(1, Math.max(0, (alt + 2) / 6)));
  // the camera faces WNW across the valley (the 日照金山 viewpoint): at sunrise the sun is behind us, to the left,
  // and lights the peaks head-on in gold while the sky in front shows the Belt of Venus; at noon it is on the left;
  // it sets in front of us, over the peaks (Taipei, October: rises ~97°, sets ~263°)
  const az = (-145 + 138 * frac) * Math.PI / 180;   // radians off the view axis, + = right, ±π = behind (camera ≈ WNW)
  // morning mist: the valleys breathe out between ~05 and ~09, heaviest around 07
  const mist = Math.exp(-Math.pow((hours - 7.0) / 1.7, 2)) * (1 - night);
  return { alt, night, twilight, sunUp, az, hours, mist };
}

/* ------------------------------ WebGL2 ------------------------------ */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, preserveDrawingBuffer: false, powerPreference: 'low-power' });
if (!gl) document.getElementById('nogl').style.display = 'block';

// ---- shared GLSL: hash / noise, the terrain, the cloud-sea top, encodings ----
const COMMON = `#version 300 es
precision highp float;
precision highp int;
const float PI = 3.14159265;
const float ZFAR = ${ZFAR.toFixed(1)};
const vec3  SADDLE = vec3(${SADDLE.map(v => v.toFixed(3)).join(', ')});   // x, y, z (km): where the 雲瀑 pours over the near range
uniform int uOne;                                  // always 1: loop bounds the HLSL compiler cannot unroll (keeps cold compiles short)
uniform int uSteps;                                // march steps / shadow steps, same reason
uniform int uNSeg;                                 // crest segments in use
uniform vec4 uSegA[${MAX_SEG}];                    // A.xz, B.xz (km)
uniform vec4 uSegB[${MAX_SEG}];                    // crest height at A, at B; flank steepness side+, side−
uniform vec4 uSegC[${MAX_SEG}];                    // rib amplitude, rib spacing, chain seed, distance along the chain at A
float saturate(float x) { return clamp(x, 0.0, 1.0); }
float linearstep(float a, float b, float v) { return clamp((v - a) / (b - a), 0.0, 1.0); }
// integer hash (pcg2d-style), stable across GPUs
uvec2 pcg2d(uvec2 v) {
  v = v * 1664525u + 1013904223u;
  v.x += v.y * 1664525u; v.y += v.x * 1664525u;
  v ^= v >> 16u;
  v.x += v.y * 1664525u; v.y += v.x * 1664525u;
  v ^= v >> 16u;
  return v;
}
float hashc(vec2 c) { return float(pcg2d(uvec2(ivec2(c) + 32768)).x) * (1.0 / 4294967295.0); }   // on integer cells
vec2 hash2c(vec2 c) { return vec2(pcg2d(uvec2(ivec2(c) + 32768))) * (1.0 / 4294967295.0); }
float noise(vec2 p) {                        // value noise, quintic interpolation (smooth normals)
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  return mix(mix(hashc(i), hashc(i + vec2(1, 0)), u.x), mix(hashc(i + vec2(0, 1)), hashc(i + vec2(1, 1)), u.x), u.y);
}
vec3 noised(vec2 p) {                        // value noise + analytic derivatives (iq)
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  float a = hashc(i), b = hashc(i + vec2(1, 0)), c = hashc(i + vec2(0, 1)), d = hashc(i + vec2(1, 1));
  float k1 = b - a, k2 = c - a, k4 = a - b - c + d;
  return vec3(a + k1 * u.x + k2 * u.y + k4 * u.x * u.y, du * (vec2(k1, k2) + k4 * u.yx));
}
float fbm3(vec2 p) { return noise(p) * 0.5 + noise(p * 2.03 + 5.3) * 0.3 + noise(p * 4.1 + 11.1) * 0.2; }
float smax(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (a - b) / k, 0.0, 1.0); return mix(b, a, h) + k * h * (1.0 - h); }
const mat2 M2 = mat2(0.80, -0.60, 0.60, 0.80) * 2.07;
float ridged(vec2 p) { float n = noise(p) * 2.0 - 1.0; float r = 1.0 - abs(n); return r * r * (3.0 - 2.0 * r); }
// iq's "eroded" fbm: octaves are damped where the accumulated slope is steep → smooth valleys, rough crests
float erodedFbm(vec2 p, float oct) {                 // oct is fractional: the last octave fades in (no LOD seams)
  float a = 0.0, b = 0.5; vec2 d = vec2(0.0);
  int n = int(ceil(oct));
  for (int i = 0; i < n; i++) { vec3 nn = noised(p); float w = saturate(oct - float(i)); d += nn.yz * w; a += w * b * (nn.x - 0.5) / (1.0 + dot(d, d) * 0.6); b *= 0.5; p = M2 * p; }
  return a;
}
// ---- the massifs: smooth max over crest segments, eroded in each crest's own (u along, d down) coordinates ----
// ribs: a periodic gully profile across the fall line (sharp arêtes, rounded couloir floors), meandering, fanning
// out downhill, every rib its own depth, plus a finer set and a little ridged noise; one pattern per side of the crest
// g: 1 on an arête … 0 in a couloir
float ribs(float u, float d, float side, vec4 c, float oct, out float g) {
  float f = 1.0 / c.y;
  float y = d * f;
  float x = u * f / (1.0 + 0.12 * d) + c.z;                                // (no per-side offset: it flipped at full amplitude along the axis beyond a crest end → cliffs)
  x += 1.10 * (noise(vec2(x * 0.22, y * 0.30) + c.z) - 0.5) + 0.30 * (noise(vec2(x * 1.1, y * 0.9) + 5.0) - 0.5);
  float a1 = 0.45 + 0.55 * noise(vec2(x * 0.9, c.z * 7.0));             // smooth: a per-rib hash made a cliff at every arête
  // rounded arêtes: a cosine profile raised to a power (narrow ridges, broad couloirs) instead of an abs() fold, whose
  // knife-edge made every lit / shaded face flip on a hard vertical line (the faces read as stacked rectangles)
  float g1 = pow(0.5 + 0.5 * cos(6.2831853 * x), 1.6);
  float x2 = x * 2.6 + 0.5 * (noise(vec2(x * 1.3, y * 0.8) + 3.0) - 0.5);
  float g2 = pow(0.5 + 0.5 * cos(6.2831853 * x2), 1.6);
  float g3 = mix(0.6, ridged(vec2(x * 6.0, y * 1.5)), saturate(oct - 6.0));
  g = saturate(a1 * g1 * 0.62 + g2 * 0.26 + g3 * 0.12 + (1.0 - a1) * 0.3);
  float deepen = smoothstep(0.0, 0.30, d) * (0.6 + 0.4 * smoothstep(0.1, 0.8, d));   // gullies emerge gradually below the crest (no shelf line)
  float faces = 0.70 + 0.30 * smoothstep(0.3, 0.7, noise(vec2(x * 0.15, y * 0.2) + 2.0));
  float crest = (noise(vec2(u * f * 1.6, c.z)) - 0.5) * 0.5 * smoothstep(0.25, 0.0, d);   // notches and gendarmes, not a comb
  return c.x * ((g - 0.45) * deepen * faces + crest);
}
// info: x = concavity (0 arête … 1 couloir), y = how much the ribs apply
float massifs(vec2 p, float yProbe, float oct, out vec2 info) {
  // keep the three highest crests (+ the 4th height): their ribs are blended with weights that reach exactly 0 when a

float deckCov(vec2 q) {

  vec3 S = vec3(0.0);
  float tSeaFront = t;
  // rays at or above the horizon still meet a sea that has risen to eye level (they were skipped: a ruler-straight
  // edge at the horizon); they march until they climb above seaMax
  // (only the pool behind the near range, ≥ 2.3 km out, can stand above eye level: upward rays start there, and
  // rays too steep to pass under seaMax by then are skipped — the sky stays cheap)
  if (rd.y < -1e-4 || (seaMax > 0.0 && rd.y * 2.3 < seaMax)) {
    float t0 = rd.y < -1e-4 ? max(seaMax / rd.y, 0.05) : 2.3;
    float tEnd = min(t, ZFAR);
    if (rd.y > 1e-4) tEnd = min(tEnd, seaMax / rd.y);
    if (rd.y > -0.02) tEnd = min(tEnd, 26.0);                                   // near the horizon: beyond this the haze hides it
    float pixA = 2.0 * uTanHalf.y / uRes.y;
    float jit = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));   // static IGN: no shimmer
    // phase 1: clearance-stepped march to the envelope (stop 25 m above it). phase 2: density integration.
    // ONE seaTop() call site for both (each call site costs seconds of cold compile).
    float tt = t0, ts = -1.0, dt = 0.0, tv = 0.0, ta = t0, tb = t0;   // (the fringe needs t0 ≥ 45 m above the top: seaMax margin)
    bool bisecting = false; int nb = 0;
    int nv = -1;
    bool lpend = false; vec3 lp = vec3(0.0); float lDepth = 0.0, lA = 0.0;
    const int NV = 8;
    vec3 ls = normalize(vec3(uLightDir.x, max(uLightDir.y, 0.05), uLightDir.z));
    float mu = dot(rd, uLightDir);
    float g = 0.55, hg = (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * mu, 1.5) * 0.25;  // forward lobe (silver lining)
    float sigma = 70.0 * (0.35 + 0.65 * uSeaDensity);                                    // extinction per km
    vec3 sunL = uLightCol * deckLight(rd * min(tEnd, 8.0));
    vec3 lastC = sunL * 0.45 * (0.55 + 2.2 * hg) + uAmbSky * 0.85 + uAmbGround * 0.25;   // until a sample is shaded
    for (int i = 0; i < 109 + uOne; i++) {
      if (nv < 0 && !bisecting && tt > tEnd) break;
      bool lstep = nv >= 0 && lpend;                                                   // the light probe for the sample before
      float tq = nv < 0 ? (bisecting ? 0.5 * (ta + tb) : tt) : tv;
      vec3 p = lstep ? lp : rd * tq;
      float fpq = tq * pixA / max(-rd.y, 0.02);
      float top = seaTop(p.xz, max(fpq, nv < 0 ? 0.0 : 0.02));
      float depth = top - p.y;
      if (lstep) {
        // light has to cross whatever heap stands between this sample and the sun: the larger of the two depths
        float Tl = exp(-max(max(lDepth, 0.0) / max(ls.y, 0.18), max(depth, 0.0) * 4.0) * 22.0);
        float powder = 1.0 - exp(-max(lDepth, 0.0) * 60.0 - 0.15);
        vec3 c = sunL * Tl * mix(1.0, powder, 0.45) * (0.55 + 2.2 * hg);
        c += uAmbSky * (0.50 + 0.70 * exp(-max(lDepth, 0.0) * 18.0));
        c += uAmbGround * 0.25;
        lastC = c;
        S += T * lA * c;
        T *= 1.0 - lA;
        lpend = false;
        tv += dt;
        if (++nv >= NV || T < 0.02) break;
        continue;
      }
      if (nv < 0) {
        if (!bisecting) {
          if (depth > 0.0) { tb = tt; bisecting = true; continue; }
          ta = tt;
          tt += max(0.004 + (0.010 + 0.025 * smoothstep(-0.04, 0.0, rd.y)) * tt, -depth / (-rd.y + 0.6));   // grazing rays: coarser (their footprint is huge)
          continue;
        }
        if (depth > 0.0) tb = tq; else ta = tq;
        if (++nb < 6) continue;
        // start the volume AT the surface crossing (samples aligned to it: no contour banding, no jitter grain);
        // span ~0.09 km of depth along the ray (longer when grazing), capped by what is behind
        float tsf = 0.5 * (ta + tb);
        float span = min(min(0.09 / max(-rd.y, 0.05), 0.9), tEnd - tsf);
        dt = max(span, 1e-4) / float(NV);
        ts = tsf - min(0.04 / max(-rd.y, 0.05), 1.5 * dt);
        tv = ts + 0.5 * dt;
        nv = 0;
        if (span <= 0.0) break;
        continue;
      } else {
        // where the 雲瀑 falls: torn into flow-aligned streaks of mist
        float cu = SADDLE.z - p.z, cv = p.x - SADDLE.x - uWind.x * 0.18 * max(cu, 0.0);
        float csp = 0.30 + 0.45 * max(cu, 0.0);
        float cas = uCascade > 0.005 ? exp(-(cv * cv) / (csp * csp * 2.0)) * smoothstep(-0.3, 0.1, cu) * smoothstep(1.0, 0.45, cu) * uCascade : 0.0;
        // fringe erosion: fibrous wisps at the top, streaks on the fall
        float fw = octW(0.16, fpq * 1.5);
        float ero = fw > 0.0 ? fw * (noise(p.xz * 11.0 + uFlow * 3.0) * 0.65 + noise(p.xz * 27.0 - uFlow * 2.0) * 0.35 - 0.5) : 0.0;
        if (cas > 0.01) ero = mix(ero, noise(vec2(cv * 30.0, cu * 3.5 - uSnowOff.w * 0.4)) * 0.7 + noise(vec2(cv * 70.0 + 4.0, cu * 8.0 - uSnowOff.w * 0.7)) * 0.3 - 0.55, cas);
        float d = depth + ero * (0.030 + 0.050 * cas);
        // a gauzy fringe ~40 m above the dense body (wider where a pixel covers more ground), then the body
        float wq = 0.035 + min(fpq * 0.5, 0.05);
        // cottony mottling inside (tilted through the layer, so it reads as rounded puffs, not a texture on a sheet)
        float mw = octW(0.10, fpq);
        float cot = mw > 0.0 ? noise(vec2(p.x * 10.0 + p.y * 28.0, p.z * 10.0 - p.y * 21.0) + uFlow * 2.5) : 0.5;
        float dens = mix(1.0, 0.35 + 1.3 * cot, 0.75 * mw) * sigma * ((0.022 + 0.03 * smoothstep(3.0, 15.0, tq)) * smoothstep(-0.05 - 0.010 * tq, 0.0, d) +   // far away the fringe deepens into haze
           0.978 * smoothstep(-0.006, wq, d) * smoothstep(-0.006, wq * 2.5, d)) * (1.0 - 0.55 * cas * smoothstep(0.1, 0.6, cu));
        if (dens > 0.0) {
          // shade it on the next iteration, after probing the envelope 0.15 km toward the light
          lA = 1.0 - exp(-dens * dt); lDepth = d;
          lp = p + ls * 0.06; lpend = true;
          continue;
        }
        tv += dt;
        if (++nv >= NV || T < 0.02) break;
      }
    }
    if (nv < 0 && tt < tEnd && tt > t0 + 1e-3) ts = bisecting ? 0.5 * (ta + tb) : tt;                         // out of steps above the far sea: it is there
    if (ts > 0.0) {
      // where the span ran out of path (the cloud continues), close it off with the light of the last sample
      if (T > 0.02 && ts + dt * float(NV) < tEnd - 0.01) {
        float close = (1.0 - exp(-(tEnd - ts - dt * float(NV)) * 6.0)) * (0.55 + 0.45 * uSeaDensity);
        S += T * close * lastC; T *= 1.0 - close;
      }
      S = fog(S / max(1.0 - T, 1e-3), ts, rd) * (1.0 - T);                                // aerial perspective of where it sits
      tSeaFront = mix(t, ts, saturate((1.0 - T) * 1.5));
    }
  }
  fragColor = vec4(S * uCloudEnc, T);
  fragDepth = vec4(sqrt(min(tPix, ZFAR) / ZFAR), sqrt(min(tSeaFront, ZFAR) / ZFAR), 0.0, 1.0);
#else
  // ---- composite the half-res cloud sea: bilateral (depth-aware) upsample — each of the 4 nearest cloud texels is
  // weighted by bilinear × how well the terrain depth it was computed against matches this pixel's own; if none
  // matches (a thin feature), the closest-depth texel wins. Crisp against the ridge / peaks, soft where it is soft ----
  float T = 1.0;
  vec3 S = vec3(0.0);
  {
    vec2 hf = gl_FragCoord.xy * 0.5 - 0.5;
    ivec2 h0 = ivec2(floor(hf));
    vec2 fw = hf - floor(hf);
    ivec2 hmax = textureSize(uCloudA, 0) - 1;
    float tol = 0.02 * tPix + 0.002;
    vec4 acc = vec4(0.0); float wsum = 0.0, best = 1e9; vec4 bestV = vec4(0.0, 0.0, 0.0, 1.0);
    for (int k = 0; k < 4; k++) {
      ivec2 o = ivec2(k & 1, k >> 1);
      ivec2 q = clamp(h0 + o, ivec2(0), hmax);
      vec4 cv = texelFetch(uCloudA, q, 0);
      float td = texelFetch(uCloudB, q, 0).x; td = td * td * ZFAR;
      float dd = abs(td - tPix);
      float wb = (o.x == 1 ? fw.x : 1.0 - fw.x) * (o.y == 1 ? fw.y : 1.0 - fw.y);
      float wd = exp(-(dd * dd) / (tol * tol));
      acc += cv * wb * wd; wsum += wb * wd;
      if (dd < best) { best = dd; bestV = cv; }
    }
    vec4 cl = wsum > 1e-4 ? acc / wsum : bestV;
    S = cl.rgb / uCloudEnc; T = cl.a;
  }
  col = col * T + S;
  // ---- 風吹雪: spindrift streaming downwind off the crests (sunlit), and blowing along the slope we stand on ----
  vec3 snowAir = uAmbSky * 1.5 + uLightCol * 0.45 + uAmbGround * 0.2;
  float wx = uWind.x / max(0.35, uWind.z);
  float windy = smoothstep(0.06, 0.35, abs(uWind.x));                                   // no lateral wind, no plume
  if (uSpin > 0.01 && windy > 0.0) {
    vec2 w = normalize(vec2(wx >= 0.0 ? 1.0 : -1.0, 0.30));
    float mask = 0.0, pxs = uRes.y / 540.0;
    for (int k = 1; k <= 13 + uOne; k++) {                                  // look upwind (and a little down) for a nearer, high crest
      vec2 qf = gl_FragCoord.xy - (w * 3.3 + vec2(0.0, 0.5)) * float(k) * pxs;
      ivec2 q = clamp(ivec2(qf), ivec2(0), ivec2(uRes) - 1);
      float tk = dec16(texelFetch(uTexA, q, 0).rg); tk = tk * tk * ZFAR;
      if (tk > ZFAR * 0.99 || tk > tPix * 0.8 || tk < 2.5) continue;
      vec2 nq = (vec2(q) + 0.5) / uRes * 2.0 - 1.0;
      float yk = normalize(uFwd + uRight * nq.x * uTanHalf.x + uUp * nq.y * uTanHalf.y).y * tk;
      mask = max(mask, (1.0 - float(k) / 15.0) * smoothstep(-0.25, 0.25, yk));
    }
    vec2 sp = gl_FragCoord.xy / uRes.y;
    float along = dot(sp, w), across = dot(sp, vec2(-w.y, w.x));
    float sgn = sign(wx + 1e-4);
    float gust = smoothstep(0.30, 0.75, noise(vec2(uv.x * 5.0 - uSnowOff.x * 0.3, uv.y * 3.0 + 1.7)));
    if (mask > 0.01) {
      float s = noise(vec2(along * 7.0 - uSnowOff.z * 1.1 * sgn, across * 46.0)) * 0.55 + noise(vec2(along * 16.0 - uSnowOff.z * 1.9 * sgn, across * 110.0 + 3.0)) * 0.45;
      float plume = mask * smoothstep(0.25, 0.75, s) * (0.30 + 0.70 * max(gust, uWind.w)) * windy * uSpin;
      col = mix(col, snowAir, plume * 0.80);
    }
    // ground drift: low, fast streaks hugging the foreground slope and the near range's crest
    float near = smoothstep(0.45, 0.10, tPix) * step(tPix, ZFAR * 0.99);
    if (near > 0.0) {
      // thin, broken wisps (not a sheet): fine streaks gated by drifting gust patches
      float s2 = noise(vec2(sp.x * 26.0 - uSnowOff.z * 1.4 * sgn, sp.y * 300.0)) * 0.6 + noise(vec2(sp.x * 60.0 - uSnowOff.z * 2.2 * sgn, sp.y * 700.0 + 5.0)) * 0.4;
      float drPatch = smoothstep(0.50, 0.85, noise(vec2(sp.x * 3.0 - uSnowOff.x * 0.5, sp.y * 7.0) + 9.0));
      float drift = smoothstep(0.62, 0.92, s2) * drPatch * near * windy * uSpin * (0.4 + 0.6 * max(gust, uWind.w)) * mix(0.4, 1.0, smoothstep(0.15, 0.40, uv.x));
      vec3 driftC = uAmbSky * 1.5 + uAmbGround * 0.2 + uLightCol * 0.45 * B.b;          // in the slope's own sun / shadow
      col = mix(col, driftC * 0.9, drift * 0.45);

  col = pow(aces(col * uExposure), vec3(1.0 / 2.2));
  // ---- 等你: one star in FRONT of everything, pulsing slowly (same place and pulse as the other themes) ----
  if (uBeacon > 0.01) {
    float aspect = uRes.x / uRes.y;
    vec2 bd = (uv - vec2(0.58, 0.80)) * vec2(aspect, 1.0);
    float br = length(bd);
    float pulse = pow(0.5 + 0.5 * sin(time * 2.2 - 1.57), 2.0);
    float core = exp(-br * 110.0) * 1.6;
    float halo = exp(-br * 16.0) * 0.30 + exp(-br * 5.0) * 0.08;
    float spikes = exp(-abs(bd.x) * 320.0) * exp(-abs(bd.y) * 14.0) + exp(-abs(bd.y) * 320.0) * exp(-abs(bd.x) * 14.0);
    col += vec3(1.0, 0.91, 0.74) * (core * (0.55 + 0.45 * pulse) + (halo + spikes * 0.7) * pulse) * uBeacon;
  }
  // dither: triangular-PDF, independent per channel, ±1 LSB of 8 bit, static per pixel (no shimmer) — keeps the smooth
  // sky / cloud-sea / night gradients from stepping, also after the 2× upscale to the screen
  vec2 d1 = hash2c(gl_FragCoord.xy), d2 = hash2c(gl_FragCoord.xy + vec2(71.0, 13.0)), d3 = hash2c(gl_FragCoord.xy + vec2(29.0, 157.0));

}`;

// ---------- FXAA (after Lottes' FXAA 3.11 "quality"): finds the edge, searches along it to both ends and blends by
// the position on the span → long, nearly horizontal ridge lines and cloud contours lose their stair steps (~0.3 ms) ----------
const FS_FXAA = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uInv;
out vec4 fragColor;
float L(vec2 uv) { return dot(texture(uTex, uv).rgb, vec3(0.299, 0.587, 0.114)); }
void main() {
  vec2 uv = gl_FragCoord.xy * uInv;
  vec4 cM = texture(uTex, uv);
  float lM = dot(cM.rgb, vec3(0.299, 0.587, 0.114));
  float lN = L(uv + vec2(0.0, uInv.y)), lS = L(uv - vec2(0.0, uInv.y)), lE = L(uv + vec2(uInv.x, 0.0)), lW = L(uv - vec2(uInv.x, 0.0));
  float lMax = max(lM, max(max(lN, lS), max(lE, lW))), lMin = min(lM, min(min(lN, lS), min(lE, lW)));
  float range = lMax - lMin;
  if (range < max(0.03, lMax * 0.10)) { fragColor = vec4(cM.rgb, 1.0); return; }      // flat (incl. the dither): untouched
  float lNE = L(uv + uInv), lSW = L(uv - uInv), lNW = L(uv + vec2(-uInv.x, uInv.y)), lSE = L(uv + vec2(uInv.x, -uInv.y));
  float edgeH = abs(lNW + lNE - 2.0 * lN) + 2.0 * abs(lW + lE - 2.0 * lM) + abs(lSW + lSE - 2.0 * lS);
  float edgeV = abs(lNW + lSW - 2.0 * lW) + 2.0 * abs(lN + lS - 2.0 * lM) + abs(lNE + lSE - 2.0 * lE);
  bool horz = edgeH >= edgeV;
  float l1 = horz ? lS : lW, l2 = horz ? lN : lE;
  float g1 = abs(l1 - lM), g2 = abs(l2 - lM);
  bool steep1 = g1 >= g2;
  float gScaled = 0.25 * max(g1, g2);
  float stp = horz ? uInv.y : uInv.x;
  float lLocal;
  if (steep1) { stp = -stp; lLocal = 0.5 * (l1 + lM); } else lLocal = 0.5 * (l2 + lM);
  vec2 cur = uv + (horz ? vec2(0.0, stp * 0.5) : vec2(stp * 0.5, 0.0));
  vec2 off = horz ? vec2(uInv.x, 0.0) : vec2(0.0, uInv.y);
  vec2 p1 = cur - off, p2 = cur + off;
  float e1 = L(p1) - lLocal, e2 = L(p2) - lLocal;
  bool r1 = abs(e1) >= gScaled, r2 = abs(e2) >= gScaled;
  const float Q[10] = float[10](1.0, 1.0, 1.0, 1.5, 2.0, 2.0, 2.0, 4.0, 8.0, 8.0);
  for (int i = 0; i < 10; i++) {
    if (r1 && r2) break;
    if (!r1) { p1 -= off * Q[i]; e1 = L(p1) - lLocal; r1 = abs(e1) >= gScaled; }
    if (!r2) { p2 += off * Q[i]; e2 = L(p2) - lLocal; r2 = abs(e2) >= gScaled; }
  }
  float d1 = horz ? uv.x - p1.x : uv.y - p1.y, d2 = horz ? p2.x - uv.x : p2.y - uv.y;
  bool near1 = d1 < d2;
  float dMin = min(d1, d2), span = d1 + d2;
  bool lMSmaller = lM < lLocal;
  bool good = ((near1 ? e1 : e2) < 0.0) != lMSmaller;
  float offEdge = good ? -dMin / span + 0.5 : 0.0;
  // sub-pixel aliasing (single-pixel features)
  float lAvg = (2.0 * (lN + lS + lE + lW) + lNE + lNW + lSE + lSW) / 12.0;
  float sub = smoothstep(0.0, 1.0, clamp(abs(lAvg - lM) / range, 0.0, 1.0));
  float subOff = sub * sub * 0.75;
  float fo = max(offEdge, subOff);
  vec2 fuv = uv + (horz ? vec2(0.0, fo * stp) : vec2(fo * stp, 0.0));
  fragColor = vec4(texture(uTex, fuv).rgb, 1.0);
}`;

// ---------- particles, all moving with the shared wind (6 vertices each, no CPU simulation) ----------
// 風吹雪 (blown ground snow, low on the screen, in three depth layers): 2 = a few big, soft, out-of-focus grains right
// in front of the lens, 1 = mid grains as horizontal motion streaks, 0 = fine far grains over the near range's crest.
// 3 = 鑽石塵: sparse ice crystals that glint when their facet catches the sun (or the moon).
const SNOW_NEAR = 40, SNOW_MID = 1200, SNOW_FAR = 1400, SNOW_DUST = 420;
const VS_SNOW = `#version 300 es
precision highp float;
uniform float uSpin, uDust, uTime;
uniform vec2  uRes;
uniform vec4  uWind, uSnowOff;
uniform vec3  uFlakeCol, uGlintCol;
uniform vec4  uCampS[5];                 // tents: screen px x, y
uniform vec4  uCampL[5];                 // tents: lamp × alpha
out vec2 vQ;
out float vA;
flat out int vKind;
out vec3 vCol;
float h1(float n) { return fract(sin(n * 12.9898) * 43758.5453); }
float vn(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = h1(dot(i, vec2(1.0, 57.0))), b = h1(dot(i + vec2(1.0, 0.0), vec2(1.0, 57.0)));
  float c = h1(dot(i + vec2(0.0, 1.0), vec2(1.0, 57.0))), d = h1(dot(i + vec2(1.0, 1.0), vec2(1.0, 57.0)));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
void main() {
  int fid = gl_VertexID / 6, corner = gl_VertexID % 6;
  float id = float(fid);
  float a = h1(id + 1.0), b = h1(id + 7.0), c = h1(id + 13.0), d = h1(id + 19.0), e = h1(id + 41.0);
  int kind = fid < ${SNOW_NEAR} ? 2 : fid < ${SNOW_NEAR + SNOW_MID} ? 1 : fid < ${SNOW_NEAR + SNOW_MID + SNOW_FAR} ? 0 : 3;
  vec2 asp = vec2(uRes.y / uRes.x, 1.0);
  vec2 qc = corner == 0 ? vec2(-1, -1) : corner == 1 ? vec2(1, -1) : corner == 2 ? vec2(1, 1) : corner == 3 ? vec2(-1, -1) : corner == 4 ? vec2(1, 1) : vec2(-1, 1);
  vec2 pos, off;
  vec3 col = uFlakeCol;
  if (kind == 3) {
    // diamond dust: drifts slowly with the wind, sinks very slowly; a facet flashes now and then
    pos = fract(vec2(a, b) + vec2(uSnowOff.x * 0.10 * asp.x, -uTime * 0.004 * (0.5 + d)) + vec2(0.01 * sin(uTime * (0.3 + 0.4 * d) + id), 0.0));
    float ph = uTime * (0.25 + 0.9 * c) + id * 7.31;
    float glint = pow(max(0.0, sin(ph)), 90.0);
    float sz = (2.0 + 5.0 * glint) / uRes.y;
    off = qc * sz;
    vA = uDust * (0.10 + 0.90 * glint) * mix(0.4, 1.0, smoothstep(0.22, 0.40, pos.x)) * step(e, 0.55 + 0.45 * uDust);
    col = mix(col, uGlintCol, glint);
  } else {
    float z = kind == 2 ? 0.45 + 0.25 * c : kind == 1 ? 0.30 + 0.45 * c : 0.10 + 0.14 * c;    // parallax: screen speed scale
    // blown snow travels with the wind, lifting and dipping with eddies; it hugs the lower screen (slope, near crest)
    pos = fract(vec2(a, b) + vec2(uSnowOff.x * asp.x * z, uSnowOff.y * z * 0.3) + vec2(0.0, 0.015 * sin(uSnowOff.x * (3.0 + 4.0 * d) + id * 1.7)));
    vec2 vel = vec2(uWind.x, 0.03 * cos(uSnowOff.x * (3.0 + 4.0 * d) + id * 1.7)) * z;
    vec2 dir = normalize(vel + vec2(1e-4, 0.0));
    float speed = length(vel);
    if (kind == 2) off = qc * (0.022 + 0.030 * d);                                          // a soft out-of-focus grain
    else {
      float len = kind == 1 ? 0.003 + 0.016 * min(speed, 1.2) * (0.6 + 0.4 * d) : 0.0012 + 0.008 * min(speed, 1.2);   // streak ∝ speed
      float wid = kind == 1 ? 0.0010 + 0.0012 * c : 0.0008;
      off = dir * qc.x * len * 0.5 + vec2(-dir.y, dir.x) * qc.y * wid;
    }
    float band = smoothstep(0.25, 0.80, vn(pos * vec2(3.0, 2.0) + vec2(uSnowOff.x * asp.x, 0.0) * 0.30 + 3.0));   // gust bands
    float keep = mix(0.35, 1.0, smoothstep(0.22, 0.40, pos.x));
    float region = kind == 0 ? smoothstep(0.36, 0.46, pos.y) * smoothstep(0.62, 0.52, pos.y)              // along the near range's crest
