<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>寫實草原桌布</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #4a6a2e;
               user-select: none; -webkit-user-select: none; -webkit-user-drag: none; cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; pointer-events: none; }
  #hud { position: fixed; left: 10px; bottom: 8px; font: 12px/1.5 Consolas, monospace; color: rgba(255,255,255,.85);
         background: rgba(0,0,0,.4); padding: 4px 8px; border-radius: 4px; white-space: pre; display: none; }
  body.debug #hud { display: block; }
  #nogl { display: none; position: fixed; inset: 0; color: #dde; font: 14px sans-serif; padding: 24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="nogl">這個主題需要 WebGL2。</div>
<script>
/* =====================================================================================
 * 寫實草原 (meadow-real) — 2026-10-02 — a realistic grass meadow as a live wallpaper
 *
 * Grass technique ported from SimonDev's Quick_Grass (MIT, github.com/simondevyoutube/Quick_Grass; video
 * "How do Major Video Games Render Grass?"), itself after Sucker Punch's Ghost of Tsushima GDC 2021 talk:
 *  - every blade is a low-vertex triangle strip (7 segments near, 1 segment far), drawn instanced; per-blade
 *    variety (jitter, facing angle, height, width, lean, colour) comes from a hash of the blade position in
 *    the vertex shader, nothing is stored per vertex
 *  - the blade is a curve (lean eased by height) and bends further with the wind; wind = a slowly turning
 *    direction field + a strength field, eased so that gusts snap, plus travelling gust fronts
 *  - "rounded" normals: two normals rotated ±0.3π around the blade axis, blended across the width; a crease
 *    darkening along the middle; root AO; base→tip colour gradient; wrap diffuse, a fake backscatter
 *    translucency, Blinn-Phong sheen; normals blend towards UP with distance so the far field reads as a carpet
 *  - the blade is thickened in view space when seen edge-on (no disappearing blades)
 * Everything else (procedural rolling terrain, analytic sky with sun / Mie glow / clouds / haze, distant hills
 * and treeline, windmills, the 等你 star, the state machine, polling, day/night clock, wpPause, bench) is this
 * theme's own. Raw WebGL2, no libraries, works offline.
 * ===================================================================================== */

/* ------------------------------ config ------------------------------ */
const FPS = 30;
const RES_SCALE = 0.5;
const CONFIG = { fullTransition: 4.0, polling: true, clockHours: /[?&]day=1/.test(location.search) ? 10.5 : null, skip: '',
                 bladesHigh: 80000, bladesLow: 200000, expoHigh: 1.4, expoLow: 2.25, msaa: true };   // clockHours: test override (0–24), null = real time
const DEBOUNCE_MS = 300;
const POLL_MS = 1000;
const CAM_H = 1.65;                          // 稻田: eye a little above the rice                          // eye height above the (flat, near) ground: standing in the grass, the hills stay in view
const PITCH = -0.10;                         // radians, looking slightly down
const VFOV = 0.86;                           // vertical field of view (radians) ≈ 49°
const ZFAR = 600.0;
const LOD_DIST = 11.0;                       // high-detail blades up to here
const GRASS_MAX = 70.0;                      // blades fade out here; beyond: the analytic carpet
const Z_NEAR_BLADES = 0.6;

// parameter ranges (used to normalise transition distances)
const PARAMS = {
  sway:          [0, 1],                     // base wind strength
  gustRate:      [0, 0.5],                   // gust fronts per second
  gustStrength:  [0, 1],                     // bending at a front
  cloudCover:    [0, 1],
  skyBrightness: [0, 1],                     // 1 clear blue … 0 dark storm sky
  warmth:        [0, 1],                     // low golden light (clearing)
  haze:          [0, 1],                     // aerial perspective / fog density
  beacon:        [0, 1],                     // 等你 star
  busy:          [0, 1],                     // 稻田: how far the big cloud in the upper left has built up
};
// 稻田: the sky stays fair in every state — how busy Claude is shows only in the wind (rice waves) and the cabins' smoke
const STATES = {
  clear:    { sway: 0.25, gustRate: 0.05, gustStrength: 0.30, cloudCover: 0.25, skyBrightness: 1.00, warmth: 0.05, haze: 0.22, beacon: 0, busy: 0.12 },
  overcast: { sway: 0.50, gustRate: 0.14, gustStrength: 0.60, cloudCover: 0.30, skyBrightness: 1.00, warmth: 0.00, haze: 0.24, beacon: 0, busy: 0.55 },
  storm:    { sway: 0.49, gustRate: 0.34, gustStrength: 0.70, cloudCover: 0.32, skyBrightness: 1.00, warmth: 0.00, haze: 0.26, beacon: 0, busy: 1.00 },
  clearing: { sway: 0.12, gustRate: 0.03, gustStrength: 0.20, cloudCover: 0.22, skyBrightness: 1.00, warmth: 1.00, haze: 0.28, beacon: 0, busy: 0.30 },
  waiting:  { sway: 0.05, gustRate: 0.00, gustStrength: 0.00, cloudCover: 0.28, skyBrightness: 0.92, warmth: 0.10, haze: 0.26, beacon: 1, busy: 0.40 },
};
const KEYS = { '1': 'clear', '2': 'overcast', '3': 'storm', '4': 'clearing', '5': 'waiting' };

/* ------------------------------ state machine (same as the other themes) ------------------------------ */
const smooth = t => t * t * (3 - 2 * t);
let current = { ...STATES.clear };
let from = { ...current }, to = { ...current };
let tStart = 0, tDur = 0;
let stateName = 'clear', pending = null, debounceT = 0;
let override = null;
function now() { return performance.now() / 1000; }
function step(t) {
  const k = tDur > 0 ? Math.min(1, (t - tStart) / tDur) : 1;
  const e = smooth(k);
  for (const p in PARAMS) current[p] = from[p] + (to[p] - from[p]) * e;
}
function applyState(name) {
  if (!STATES[name]) return;
  const t = now();
  step(t);
  from = { ...current };
  to = { ...STATES[name] };
  let dist = 0;
  for (const p in PARAMS) { const [lo, hi] = PARAMS[p]; dist = Math.max(dist, Math.abs(to[p] - from[p]) / (hi - lo)); }
  tStart = t; tDur = CONFIG.fullTransition * dist; stateName = name;
}
function requestState(name) {
  if (!STATES[name]) return;
  pending = name;
  clearTimeout(debounceT);
  debounceT = setTimeout(() => { if (pending !== stateName) applyState(pending); pending = null; }, DEBOUNCE_MS);
}

/* ------------------------------ inputs ------------------------------ */
for (const ev of ['contextmenu', 'selectstart', 'dragstart', 'mousedown']) addEventListener(ev, e => e.preventDefault());
addEventListener('keydown', e => {
  if (KEYS[e.key]) requestState(KEYS[e.key]);
  if (e.key === 'd') document.body.classList.toggle('debug');
  if (e.key === 'g') spawnGust(1, -30);
});
let lastPolled = null, sessionsFile = null, sessionsOverride = null;
async function poll() {
  if (!CONFIG.polling) return;
  try {
    const r = await fetch('state.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json(), s = j.state;
      if (STATES[s] && s !== lastPolled) { lastPolled = s; requestState(s); }
      sessionsFile = Array.isArray(j.sessions) ? Array.from({ length: 5 }, (_, i) => STATES[j.sessions[i]] ? j.sessions[i] : null) : null;
    }
  } catch { /* unreadable → keep the current state */ }
}
setInterval(poll, POLL_MS);
poll();

/* ------------------------------ day / night (Taipei; same model as the other themes) ------------------------------ */
function sunAltitude(date, lat = 25.04, lon = 121.56) {
  const rad = Math.PI / 180;
  const n = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
  const L = (280.46 + 0.9856474 * n) % 360;
  const g = ((357.528 + 0.9856003 * n) % 360) * rad;
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
  const eps = (23.439 - 0.0000004 * n) * rad;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda));
  const dec = Math.asin(Math.sin(eps) * Math.sin(lambda));
  const gmst = (280.46061837 + 360.98564736629 * n) % 360;
  const ha = (gmst + lon) * rad - ra;
  return Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
}
function sky() {
  let d = new Date();
  if (CONFIG.clockHours != null) { d = new Date(d); d.setHours(0, 0, 0, 0); d = new Date(d.getTime() + CONFIG.clockHours * 3600000); }
  const alt = sunAltitude(d);
  const night = 1 - smooth(Math.min(1, Math.max(0, (alt + 9) / 13)));
  const twilight = Math.exp(-Math.pow((alt + 1.5) / 5, 2));
  const hours = d.getHours() + d.getMinutes() / 60;
  const frac = Math.min(1, Math.max(0, (hours - 5.5) / 13));
  const sunUp = smooth(Math.min(1, Math.max(0, (alt + 2) / 6)));
  // the camera faces roughly south-south-east: the sun crosses from front-left (morning) to front-right (afternoon)
  const az = -0.55 + 1.15 * frac;            // radians off the view axis, + = right
  return { alt, night, twilight, sunUp, az, hours };
}

/* ------------------------------ WebGL2 ------------------------------ */
const canvas = document.getElementById('c');
if (/[?&]msaa=0/.test(location.search)) CONFIG.msaa = false;   // test: ?msaa=0
const gl = canvas.getContext('webgl2', { antialias: CONFIG.msaa, alpha: false, depth: true, preserveDrawingBuffer: false, powerPreference: 'low-power' });
if (!gl) document.getElementById('nogl').style.display = 'block';

// ---- shared GLSL: hash / noise, terrain, wind, cloud shadow, atmosphere ----
const COMMON = `#version 300 es
precision highp float;
uniform float uTime, uSway, uTurb, uShadowDrift, uCloudShadow, uWindScroll;
uniform vec4  uGust[4];          // front x (m, along x + z·slant), width (m), strength, slant
uniform vec3  uCam;              // camera position (world)
uniform vec3  uLightDir;         // towards the key light (sun / moon)
uniform vec3  uLightCol;         // key light radiance (linear)
uniform vec3  uAmbSky, uAmbGround;  // hemisphere ambient
uniform vec3  uHazeCol;          // aerial perspective colour at the horizon
uniform float uHaze;             // fog density scale
uniform float uNight, uExposure;
const float PI = 3.14159265;
float saturate(float x) { return clamp(x, 0.0, 1.0); }
float linearstep(float a, float b, float v) { return clamp((v - a) / (b - a), 0.0, 1.0); }
float remap(float v, float a, float b, float c, float d) { return mix(c, d, (v - a) / (b - a)); }
float easeOut(float x, float t) { return 1.0 - pow(1.0 - x, t); }
float easeIn(float x, float t) { return pow(x, t); }
mat3 rotateX(float a) { float c = cos(a), s = sin(a); return mat3(1, 0, 0, 0, c, s, 0, -s, c); }
mat3 rotateY(float a) { float c = cos(a), s = sin(a); return mat3(c, 0, -s, 0, 1, 0, s, 0, c); }
mat3 rotateAxis(vec3 axis, float angle) {
  axis = normalize(axis); float s = sin(angle), c = cos(angle), oc = 1.0 - c;
  return mat3(oc * axis.x * axis.x + c,          oc * axis.x * axis.y + axis.z * s, oc * axis.z * axis.x - axis.y * s,
              oc * axis.x * axis.y - axis.z * s, oc * axis.y * axis.y + c,          oc * axis.y * axis.z + axis.x * s,
              oc * axis.z * axis.x + axis.y * s, oc * axis.y * axis.z - axis.x * s, oc * axis.z * axis.z + c);
}
// integer hash (pcg2d-style), stable across GPUs
uvec2 pcg2d(uvec2 v) {
  v = v * 1664525u + 1013904223u;
  v.x += v.y * 1664525u; v.y += v.x * 1664525u;
  v ^= v >> 16u;
  v.x += v.y * 1664525u; v.y += v.x * 1664525u;
  v ^= v >> 16u;
  return v;
}
vec2 hash22(vec2 p) { uvec2 h = pcg2d(uvec2(ivec2(floor(p * 1024.0)))); return vec2(h) * (1.0 / 4294967295.0); }
vec4 hash42(vec2 p) {
  uvec2 h = pcg2d(uvec2(ivec2(floor(p * 1024.0))));
  uvec2 g = pcg2d(h + 7u);
  return vec4(h, g) * (1.0 / 4294967295.0);
}
float hashc(vec2 c) { return float(pcg2d(uvec2(ivec2(c))).x) * (1.0 / 4294967295.0); }   // on integer cells
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hashc(i), hashc(i + vec2(1, 0)), u.x), mix(hashc(i + vec2(0, 1)), hashc(i + vec2(1, 1)), u.x), u.y);
}
float snoise(vec2 p) { return noise(p) * 2.0 - 1.0; }
float fbm2(vec2 p) { return noise(p) * 0.625 + noise(p * 2.03 + 5.3) * 0.375; }
float fbm3(vec2 p) { return noise(p) * 0.5 + noise(p * 2.03 + 5.3) * 0.3 + noise(p * 4.1 + 11.1) * 0.2; }
float fbm4(vec2 p) { return noise(p) * 0.45 + noise(p * 2.03 + 5.3) * 0.27 + noise(p * 4.1 + 11.1) * 0.17 + noise(p * 8.3 + 23.7) * 0.11; }
// gently rolling ground; flat around the camera, flattening again far out so it meets the analytic plane
float terrainH(vec2 p) {
  float h = snoise(p * 0.030 + vec2(7.1, 3.3)) * 1.5 + snoise(p * 0.085 + vec2(1.0, 9.0)) * 0.45 + snoise(p * 0.21) * 0.10;
  return h * 0.10 * smoothstep(1.5, 16.0, length(p)) * smoothstep(150.0, 60.0, p.y);   // 稻田: paddies are flat
}
vec3 terrainN(vec2 p) {
  float e = 0.35;
  float hx = terrainH(p + vec2(e, 0.0)) - terrainH(p - vec2(e, 0.0));
  float hz = terrainH(p + vec2(0.0, e)) - terrainH(p - vec2(0.0, e));
  return normalize(vec3(-hx, 2.0 * e, -hz));
}
// large-scale field colour (metres): 0 yellow-green … 1 blue-green; .y = dry patches
vec2 fieldMap(vec2 p) { return vec2(fbm2(p * 0.045 + 3.0), noise(p * 0.11 + 9.0)); }
// gust fronts at ground point (x, z): a crest (+) with a trough behind it where the blades spring back (−),
// so a front reads as a travelling wave, not a whole-field lean
float gustAt(vec2 p) {
  float g = 0.0;
  for (int i = 0; i < 4; i++) {
    vec4 G = uGust[i];
    float d = (p.x + p.y * G.w - G.x) / max(G.y, 0.1);
    g += G.z * (exp(-d * d) * (1.0 + 0.25 * sin(uTime * 9.0 + p.x * 2.5 + p.y * 1.1)) - 0.45 * exp(-(d + 2.0) * (d + 2.0) * 0.6));
  }
  return g;
}
// wind as a lean vector (xz, radians): a slowly turning direction field × an eased strength field (Quick_Grass),
// plus the gust fronts pushing along +x
vec2 windLean(vec2 p) {
  float dir = snoise(p * 0.05 + uWindScroll * 0.08) * 0.9 + 0.35;                                  // mostly blowing +x, wandering
  float str = snoise(p * 0.25 + vec2(uWindScroll * 1.7, uWindScroll * 0.6));
  float lean = easeIn(remap(str, -1.0, 1.0, 0.25, 1.0), 2.0) * 1.25;
  float flutter = snoise(p * 1.7 + vec2(uTime * 2.6, -uTime * 1.9)) * 0.06 * uTurb;
  vec2 w = vec2(cos(dir), sin(dir)) * (lean * uSway * 0.75 + flutter);
  w.x += gustAt(p) * 1.3;
  return w;
}
// sunlight reaching the ground (cloud shadows drifting with the wind)
float lightAt(vec2 p) {
  float s = fbm2((p - vec2(uShadowDrift, uShadowDrift * 0.3)) * 0.020);             // 稻田: big cloud shadows sweeping the fields
  return 1.0 - smoothstep(0.56, 0.64, s) * 0.62 * uCloudShadow;                    // 稻田: an occasional shadow drifting over
}
// aerial perspective: scattering towards the haze colour with distance; stronger looking into the light
vec3 fog(vec3 c, float dist, vec3 dir) {
  float d = uHaze * 0.0014;
  float f = 1.0 - exp(-dist * d);
  float sunward = pow(saturate(dot(dir, uLightDir)), 6.0) * 0.5;
  vec3 hz = uHazeCol * (1.0 + sunward * uLightCol);
  return mix(c, hz, f);
}
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
vec3 finish(vec3 c) { return pow(aces(c * uExposure), vec3(1.0 / 2.2)); }
// the blade lighting model (Quick_Grass): wrap diffuse, Blinn-Phong sheen, fake backscatter translucency, hemisphere ambient,
// cloud shadow, gust sheen, aerial perspective. Used per fragment near, per vertex far.
vec3 shadeBlade(vec3 albedo, vec3 N, vec3 V, float heightPercent, float lodFade, float g, float shade, vec3 world) {
  float wrap = 0.18;                                                          // v2: 0.35 flattened every blade to the same value
  float dotNL = saturate((dot(N, uLightDir) + wrap) / (1.0 + wrap));
  vec3 direct = uLightCol * dotNL * shade;
  vec3 H = normalize(uLightDir + V);
  float spec = pow(saturate(dot(N, H)), 36.0) * (0.10 + 0.35 * heightPercent) * (1.0 + 1.5 * max(g, 0.0)) * shade;
  float back = saturate((dot(V, -uLightDir) + wrap) / (1.0 + wrap));
  vec3 scatter = uLightCol * back * 0.36 * albedo * (1.0 - 0.5 * lodFade) * pow(heightPercent, 1.4) * shade;
  vec3 amb = mix(uAmbGround, uAmbSky, N.y * 0.5 + 0.5) * mix(0.35, 1.0, heightPercent * heightPercent);   // v2: the lower canopy gets little sky
  vec3 col = albedo * (direct + amb) + uLightCol * spec * 0.6 + scatter;
  col *= 1.0 + 0.22 * g;                                                      // the gust crest catches the light, the trough behind it darkens
  return fog(col, distance(uCam, world), -V);
}
`;

// ---------- grass: instanced blades ----------
const VS_GRASS = COMMON + `
layout(location = 0) in vec3 aOff;       // blade root x, z, per-blade random
uniform mat4  uViewProj;
uniform mat4  uView, uProj;
uniform vec4  uGrassParams;             // segments, vertices, is high LOD, unused
uniform vec2  uGrassSize;                // width, height (m)
uniform float uPxWorld;                  // world size of one pixel at 1 m
uniform vec3  uColA, uColB, uColC, uColD, uTipA, uTipB;  // base colours (yellow-green, green, blue-green, dry), tip colours
out vec3  vColour;
out float vDry;                          // 1 = this blade has a dried tip
out vec4  vParams;                       // heightPercent, lodFadeOut (1 = far), xSide, gust
out vec3  vN1, vN2;
out vec3  vWorld;
out float vSkyFade, vLight;
void main() {
  vec2 root = aOff.xy;
  float h0 = terrainH(root);
  vec3 bladePos = vec3(root.x, h0, root.y);
  float dist = distance(uCam, bladePos);
  float highLODOut = smoothstep(LOD_DIST * 0.4, LOD_DIST, dist);                 // 0 near … 1 at the LOD distance
  float lodFadeIn = smoothstep(GRASS_MAX * 0.6, GRASS_MAX, dist);                 // blades vanish into the carpet
  vec4 hv = hash42(root);
  vec2 hc = hash22(root + 17.3);
  float randomAngle = hv.x * 2.0 * PI;
  float randomShade = remap(hv.y, 0.0, 1.0, 0.38, 1.12);                          // v2: wider per-blade value range
  float randomHeight = remap(hv.z, 0.0, 1.0, 0.86, 1.10) * (1.0 - lodFadeIn);       // 稻田: an even crop
  randomHeight *= 1.0;           // a few tall seed stalks in the near field (depth cue)
  float randomLean = remap(hv.w, 0.0, 1.0, 0.08, 0.42);
  float leanAnim = snoise(vec2(uTime * 0.35) + root * 137.4) * 0.08;
  float SEG = uGrassParams.x, VERTS = uGrassParams.y;
  float vertID = float(gl_VertexID);
  float xSide = mod(vertID, 2.0);
  float heightPercent = (vertID - xSide) / (SEG * 2.0);
  float totalHeight = uGrassSize.y * randomHeight;
  float widthHigh = max(easeOut(1.0 - heightPercent, 2.0), 0.14);                  // the tip keeps ≥ 1 px so it does not break into dots
  float widthLow = max(1.0 - heightPercent, 0.2);
  float wScale = mix(1.0, 2.4, lodFadeIn * 0.6 + highLODOut * 0.25);               // far blades: wider, fewer
  float totalWidth = max(uGrassSize.x * wScale, uPxWorld * dist * 0.9) * mix(widthHigh, widthLow, highLODOut) * (0.8 + 0.4 * hc.x);
  totalWidth *= mix(0.58, 1.0, smoothstep(0.8, 4.0, dist));                       // v3: real blades are narrow; 3 cm ribbons right at the lens read as CG
  vDry = step(0.78, fract(hc.x * 7.31 + hv.y * 3.7)) * (1.0 - highLODOut);
  float x = (xSide - 0.5) * totalWidth;
  float y = heightPercent * totalHeight;
  // wind
  vec2 wl = windLean(root);
  float g = gustAt(root);
  // the left ~15 % of the screen stays calm (desktop icons live there)
  vec4 clipRoot = uViewProj * vec4(bladePos, 1.0);
  float calm = smoothstep(-0.45, -0.95, clipRoot.x / max(clipRoot.w, 0.01));
  wl *= 1.0 - 0.55 * calm;
  float windLeanAngle = length(wl);
  vec3 windAxis = windLeanAngle > 1e-4 ? vec3(-wl.y, 0.0, wl.x) / windLeanAngle : vec3(0.0, 0.0, 1.0);   // lean toward (wl.x, wl.y)
  windLeanAngle = min(windLeanAngle, 1.35) * heightPercent;
  randomLean += leanAnim;
  float easedHeight = mix(easeIn(heightPercent, 2.0), 1.0, highLODOut);
  float curveAmount = -randomLean * easedHeight;
  // normal of the curve
  vec3 n1 = rotateX(-randomLean * easedHeight) * vec3(0.0, heightPercent + 0.01, 0.0);
  vec3 n2 = rotateX(-randomLean * easedHeight * 0.9) * vec3(0.0, (heightPercent + 0.01) * 0.9, 0.0);
  vec3 ncurve = normalize(n1 - n2);
  mat3 grassMat = rotateAxis(windAxis, windLeanAngle) * rotateY(randomAngle);
  vec3 faceNormal = grassMat * vec3(0.0, 0.0, 1.0);
  vec3 vn = vec3(0.0, -ncurve.z, ncurve.y);
  vec3 vn1 = grassMat * (rotateY(PI * 0.3) * vn);
  vec3 vn2 = grassMat * (rotateY(-PI * 0.3) * vn);
  vec3 pos = grassMat * (rotateX(curveAmount) * vec3(x, y, 0.0)) + bladePos;
  // colour: field patches → base / tip, per-blade shade, far LOD converges to one colour
  vec2 fm = fieldMap(root);
  vec3 baseC = mix(mix(uColA, uColB, smoothstep(0.3, 0.7, fm.x)), uColC, smoothstep(0.55, 0.9, fm.x));
  baseC = mix(baseC, uColD, smoothstep(0.62, 0.9, fm.y) * 0.7);
  vec3 tipC = mix(uTipA, uTipB, hc.y);
  tipC = mix(tipC, uColD * 1.6, smoothstep(0.62, 0.9, fm.y) * 0.5);
  float buried = mix(0.32, 1.0, smoothstep(0.65, 1.25, randomHeight));             // v2: short blades are under the canopy → darker
  vec3 highC = mix(baseC, tipC, easeIn(heightPercent, 2.2)) * randomShade * mix(buried, 1.0, highLODOut);
  vec3 lowC = mix(baseC, tipC, easeIn(heightPercent, 2.0)) * 0.72;                 // ≈ the near blades' average shade
  vColour = mix(highC, lowC, highLODOut);
  // view-space thickening when the blade is edge-on

    c.x += v * dt;
    if (c.x > c.z * 0.95) c.x = -c.z * 0.95;
    const target = i < want ? 1 : 0;
    const edge = Math.min(1, (c.z * 0.95 - Math.abs(c.x)) / (c.z * 0.15));           // fade at the wrap
    c.alpha += (target * edge - c.alpha) * Math.min(1, dt * 0.4);

}
function packPuffs() {
  const list = [];
  for (const c of PUFF_CLOUDS) {
    if (c.alpha < 0.01) continue;
    for (const p of c.puffs) {
      const wx = c.x + p.o[0], wy = c.base + p.o[1], wz = c.z + p.o[2];
      list.push([(wx - cam.pos[0]) ** 2 + (wz - cam.pos[2]) ** 2 + (wy - cam.pos[1]) ** 2, wx, wy, wz, p.r, p.n[0], p.n[1], p.n[2], c.base, c.alpha * 0.92, p.seed, c.H]);
    }
  }
  const sway = Math.sin(sceneTime * 0.01) * 120;                                    // the big one barely drifts
  for (const p of HERO.puffs) {
    const on = Math.min(1, Math.max(0, (HERO.level - p.t) / 0.12));
    if (on < 0.01) continue;
    const wx = HERO.center[0] + sway + p.o[0], wy = HERO.base + p.o[1], wz = HERO.center[2] + p.o[2];
    list.push([(wx - cam.pos[0]) ** 2 + (wz - cam.pos[2]) ** 2 + (wy - cam.pos[1]) ** 2, wx, wy, wz, p.r * (0.55 + 0.45 * on), p.n[0], p.n[1], p.n[2], HERO.base, on * 0.95, p.seed, HERO.H]);
  }
  list.sort((a, b) => b[0] - a[0]);                                                 // back to front
  list.forEach((e, i) => puffBuf.set([e[1], e[2], e[3], e[4], e[5], e[6], e[7], e[8], e[9], e[10], e[11], 0], i * 12));
  return list.length;
}
function setCommon(pr, L) {
  const u = pr.u;
  gl.uniform1f(u.uTime, sceneTime); gl.uniform1f(u.uSway, current.sway); gl.uniform1f(u.uTurb, 0.3 + current.sway + current.gustStrength);
  gl.uniform1f(u.uShadowDrift, shadowDrift); gl.uniform1f(u.uWindScroll, windScroll);
  gl.uniform1f(u.uCloudShadow, (0.6 + 0.8 * current.cloudCover) * (1 - 0.7 * L.night));
  gl.uniform4fv(u.uGust, gustArr);
  gl.uniform3fv(u.uCam, cam.pos);
  gl.uniform3fv(u.uLightDir, L.lightDir); gl.uniform3fv(u.uLightCol, L.lightCol);
  gl.uniform3fv(u.uAmbSky, L.ambSky); gl.uniform3fv(u.uAmbGround, L.ambGround);
  gl.uniform3fv(u.uHazeCol, L.hazeCol); gl.uniform1f(u.uHaze, current.haze * (1 - 0.3 * L.night));
  gl.uniform1f(u.uNight, L.night); gl.uniform1f(u.uExposure, L.exposure);
  if (u.uColA) { gl.uniform3fv(u.uColA, L.colA); gl.uniform3fv(u.uColB, L.colB); gl.uniform3fv(u.uColC, L.colC); gl.uniform3fv(u.uColD, L.colD); gl.uniform3fv(u.uTipA, L.tipA); gl.uniform3fv(u.uTipB, L.tipB); }
  if (u.uViewProj) gl.uniformMatrix4fv(u.uViewProj, false, viewProj);
  if (u.uView) gl.uniformMatrix4fv(u.uView, false, view);
  if (u.uProj) gl.uniformMatrix4fv(u.uProj, false, proj);
}
function render(sk) {
  const L = lighting(sk); L.night = sk.night;
  const skip = CONFIG.skip;
  gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LESS);
  gl.depthMask(true);
  gl.clearDepth(1.0);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.CULL_FACE);
  // 1) grass first, near to far (early-z: the terrain and sky behind the blades are never shaded): high LOD then low LOD, instanced strips
  if (!skip.includes('grass')) {
    const pxWorld = 2 * Math.tan(VFOV / 2) / canvas.height;
    gl.enableVertexAttribArray(0); gl.vertexAttribDivisor(0, 1);
    if (!skip.includes('high')) {
      gl.useProgram(P_GRASS.p); setCommon(P_GRASS, L);
      gl.uniform2f(P_GRASS.u.uGrassSize, GRASS_W, GRASS_H); gl.uniform1f(P_GRASS.u.uPxWorld, pxWorld);
      gl.uniform4f(P_GRASS.u.uGrassParams, SEG_HIGH, VERTS_HIGH, 1, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, bufHigh); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      if (CONFIG.msaa) gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);                        // soft margins on the defocused near blades
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, VERTS_HIGH, nHigh);
      gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
    }
    if (!skip.includes('low')) {
      gl.useProgram(P_GRASS_LOW.p); setCommon(P_GRASS_LOW, L);
      gl.uniform2f(P_GRASS_LOW.u.uGrassSize, GRASS_W, GRASS_H); gl.uniform1f(P_GRASS_LOW.u.uPxWorld, pxWorld);
      gl.uniform4f(P_GRASS_LOW.u.uGrassParams, SEG_LOW, VERTS_LOW, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, bufLow); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, VERTS_LOW, nLow);
    }
    gl.vertexAttribDivisor(0, 0);
  }
  // 1b) rice panicles: stems (instanced 6-segment strips) then heads (points)
  if (!skip.includes('flowers') && P_FSTEM && nFlowers) {
    const pxWorld = 2 * Math.tan(VFOV / 2) / canvas.height;
    gl.bindBuffer(gl.ARRAY_BUFFER, bufFlowers);
    gl.useProgram(P_FSTEM.p); setCommon(P_FSTEM, L);
    gl.uniform1f(P_FSTEM.u.uPxWorld, pxWorld);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(0, 1);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 12, nFlowers);
    gl.vertexAttribDivisor(0, 0);
    gl.useProgram(P_FHEAD.p); setCommon(P_FHEAD, L);
    gl.uniform2f(P_FHEAD.u.uRes, canvas.width, canvas.height);
    gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);
    if (CONFIG.msaa) gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);                         // soft panicle edges
    gl.drawArrays(gl.POINTS, 0, nFlowers);
    gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  }
  // 2) terrain (only the pixels between / beyond the blades)
  if (!skip.includes('terrain')) {
    gl.useProgram(P_TERRAIN.p); setCommon(P_TERRAIN, L);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufTerrain);
    gl.enableVertexAttribArray(0); gl.vertexAttribDivisor(0, 0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxTerrain);
    gl.drawElements(gl.TRIANGLES, terrainCount, gl.UNSIGNED_INT, 0);
  }
  // 2b) debris in the air (alpha-tested points)
  if (!skip.includes('debris') && P_DEBRIS) {
    const n = packDebris();
    if (n) {
      gl.useProgram(P_DEBRIS.p); setCommon(P_DEBRIS, L);
      gl.uniform2f(P_DEBRIS.u.uRes, canvas.width, canvas.height);
      gl.bindBuffer(gl.ARRAY_BUFFER, bufDebris); gl.bufferSubData(gl.ARRAY_BUFFER, 0, debrisBuf.subarray(0, n * 8));
      gl.enableVertexAttribArray(0); gl.enableVertexAttribArray(1); gl.vertexAttribDivisor(0, 0); gl.vertexAttribDivisor(1, 0);
      gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 32, 0); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 16);
      gl.drawArrays(gl.POINTS, 0, n);
      gl.disableVertexAttribArray(1);
    }
  }
  // 3) sky + far ground + hills + windmills + star, at the far plane
  if (!skip.includes('sky')) {
    gl.useProgram(P_SKY.p); setCommon(P_SKY, L);
    const u = P_SKY.u;
    gl.uniform2f(u.uRes, canvas.width, canvas.height);
    gl.uniform3fv(u.uFwd, cam.fwd); gl.uniform3fv(u.uRight, cam.right); gl.uniform3fv(u.uUp, cam.up);
    gl.uniform2fv(u.uTanHalf, tanHalf);
    gl.uniform3fv(u.uZenith, L.zenith); gl.uniform3fv(u.uHorizonC, L.horizonC); gl.uniform3fv(u.uSunCol, L.sunCol);
    gl.uniform3fv(u.uCloudLit, L.cloudLit); gl.uniform3fv(u.uCloudShade, L.cloudShade);
    gl.uniform1f(u.uCloud, current.cloudCover); gl.uniform1f(u.uTwilight, sk.twilight); gl.uniform1f(u.uSunUp, sk.sunUp);
    gl.uniform1f(u.uBeacon, current.beacon); gl.uniform1f(u.uBright, current.skyBrightness); gl.uniform1f(u.uWarm, current.warmth);
    gl.uniform3fv(u.uMoonDir, L.moonDir);
    gl.uniform4fv(u.uMill, millA); gl.uniform4fv(u.uMillB, millB);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufTri);
    gl.enableVertexAttribArray(0); gl.vertexAttribDivisor(0, 0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  // 4) puff clouds over the sky (behind everything else), back to front, premultiplied blending
  if (!skip.includes('clouds') && P_PUFF) {
    const n = packPuffs();
    if (n) {
      gl.useProgram(P_PUFF.p); setCommon(P_PUFF, L);
      const u = P_PUFF.u;
      gl.uniform3fv(u.uCamR, cam.right); gl.uniform3fv(u.uCamU, cam.up); gl.uniform3fv(u.uCamF, cam.fwd);
      gl.uniform3fv(u.uSunDir, L.night > 0.5 ? L.moonDir : L.sunDir);
      gl.uniform3fv(u.uCloudLit, L.cloudLit); gl.uniform3fv(u.uCloudShade, L.cloudShade); gl.uniform3fv(u.uSunCol, L.sunCol);
      gl.uniform2f(u.uRes, canvas.width, canvas.height);
      gl.uniform1f(u.uBeacon, current.beacon); gl.uniform1f(u.uTwilight, sk.twilight);
      gl.bindBuffer(gl.ARRAY_BUFFER, bufPuff); gl.bufferSubData(gl.ARRAY_BUFFER, 0, puffBuf.subarray(0, n * 12));
      for (let k = 0; k < 3; k++) { gl.enableVertexAttribArray(k); gl.vertexAttribPointer(k, 4, gl.FLOAT, false, 48, k * 16); gl.vertexAttribDivisor(k, 1); }
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
      gl.depthMask(true); gl.disable(gl.BLEND);
      for (let k = 0; k < 3; k++) gl.vertexAttribDivisor(k, 0);
      gl.disableVertexAttribArray(1); gl.disableVertexAttribArray(2);
    }
  }
}
function frame(ms) {
  raf = requestAnimationFrame(frame);
  if (ms < nextFrame) return;
  nextFrame += FRAME_MS;
  if (nextFrame < ms) nextFrame = ms + FRAME_MS;
  const t = now(), dt = Math.min(0.1, t - lastT);
  lastT = t;
  const sk = advance(t, dt);
  render(sk);
  fpsCount++;
  if (t - fpsT >= 1) { fps = fpsCount / (t - fpsT); fpsCount = 0; fpsT = t; }
  if (document.body.classList.contains('debug')) {
    document.getElementById('hud').textContent =
      `state ${stateName}${pending ? ' (→' + pending + ')' : ''}\n` +
      Object.keys(PARAMS).map(p => `${p.padEnd(14)} ${current[p].toFixed(2)}`).join('\n') +
      `\ngusts ${gusts.length}  next ${nextGustIn.toFixed(1)}s  blades ${nHigh}+${nLow}` +
      `\nfps ${fps.toFixed(1)}  res ${canvas.width}×${canvas.height}  sun ${sk.alt.toFixed(1)}°  night ${sk.night.toFixed(2)}  twilight ${sk.twilight.toFixed(2)}` +
      `\nmills ${effectiveSlots().map(s => s || '-').join(' ')}${sessionsOverride ? ' (override)' : sessionsFile ? '' : ' (ambient)'}  ` +
      mills.filter(m => m.alpha > 0).map(m => `#${m.slot} ${m.state} ${(m.alpha * 100) | 0}% ${m.cur.speed.toFixed(1)}r/s`).join(' ');
  }
}
function start() { if (gl && !raf) { lastT = now(); raf = requestAnimationFrame(frame); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }
let hostPaused = false;
document.addEventListener('visibilitychange', () => (document.hidden || hostPaused ? stop() : start()));
// the host (tools/wallpaper.js) pauses us while a window covers the whole desktop
window.wpPause = on => { hostPaused = !!on; if (hostPaused) stop(); else if (!document.hidden) start(); };
if (!document.hidden) start();

// cost measurement: median / p90 GPU time of one frame's draws (readPixels sync before and after)
function bench(frames = 60) {
  const px = new Uint8Array(4), gpu = [];
  const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  for (let i = 0; i < frames; i++) {
    const sk = advance(now(), 1 / FPS);
    sync(); const t0 = performance.now(); render(sk); sync(); gpu.push(performance.now() - t0);
  }
  gpu.sort((a, b) => a - b);
  return { median: +gpu[frames >> 1].toFixed(2), p90: +gpu[Math.floor(frames * 0.9)].toFixed(2), res: canvas.width + 'x' + canvas.height, blades: nHigh + nLow };
}

// testing hooks (themes/demo.html looks for window.theme)
window.theme = window.meadowReal = {
  requestState, applyState, STATES, PARAMS, CONFIG, sky, bench, lighting,
  setOverride(o) { override = o; },
  gust(strength = 1, front) { spawnGust(strength, front); },
  setBlades(high, low, expoHigh, expoLow) { CONFIG.bladesHigh = high; CONFIG.bladesLow = low; if (expoHigh) CONFIG.expoHigh = expoHigh; if (expoLow) CONFIG.expoLow = expoLow; buildGrass(); },
  setSessions(a) { sessionsOverride = a ? Array.from({ length: 5 }, (_, i) => a[i] || null) : null; },
  get sessions() { return effectiveSlots(); }, mills, MILL_HOMES, MILL_STATES,
  get gusts() { return gusts.map(g => ({ ...g })); },
  get current() { return { ...current }; }, get state() { return stateName; },
  get blades() { return { high: nHigh, low: nLow }; },
};
