<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>孤樹・聖誕燈</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1028; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
           image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  #panel { position: fixed; right: 12px; bottom: 12px; max-width: calc(100% - 24px); box-sizing: border-box;
           background: rgba(14, 17, 26, .8); color: #e8ecf2; font: 12px/1.4 system-ui, "Microsoft JhengHei", sans-serif;
           border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(6px); }
  #panel[hidden] { display: none; }
  #panel .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #panel button { font: inherit; color: inherit; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
                  border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  #panel button.on { background: #f5d35c; color: #1b1a12; border-color: #f5d35c; }
  #panel input[type=range] { width: 150px; }
  #panel .dim { opacity: .65; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel" hidden>
  <div class="row" id="states"></div>
  <div class="row">
    <label><input type="checkbox" id="tour"> 自動輪播</label>
    <button id="dir">風向 →</button>
    <button id="shake">搖一下</button>
    <button id="relight">重新點燈</button>
    <button id="more">積雪 +</button>
    <button id="seed">換一棵</button>
  </div>
  <div class="row">
    <span>時間</span><input type="range" id="hour" min="0" max="24" step="0.25">
    <span id="hourText"></span>
    <label><input type="checkbox" id="realtime"> 真實時間</label>
  </div>
  <div class="row dim" id="status"></div>
</div>
<script>
'use strict';
// 孤樹・聖誕燈：冬天的孤樹（同一棵有骨架的像素橡樹，葉子落光、枝上積雪），掛一串像素燈泡。
// 燈串就是狀態指示：不在＝熄燈只剩雪；待命＝暖黃慢呼吸；思考＝亂閃；執行＝跑馬燈；收尾＝亮光掃過整串；等你＝整串同步眨。
// Claude 上線時燈一顆顆點亮，最後樹頂的星亮起。全部程式生成，沒有外部圖檔。
const Q = new URLSearchParams(location.search);
const CONFIG = {
  px: +Q.get('px') || 4,                 // 一個像素格 = 幾個螢幕像素
  seed: +Q.get('seed') || 7,
  clockHours: Q.has('day') ? 11 : Q.has('dusk') ? 17.3 : Q.has('night') ? 22 : (Q.has('hour') ? +Q.get('hour') : null),
  polling: true,
  fps: 30,
};
const LABELS = { none: '不在', clear: '待命', overcast: '思考', storm: '執行', clearing: '收尾', waiting: '等你' };
// amber: 燈串偏暖黃的程度（待命時整串是暖黃，其他狀態是彩色）
const STATES = {
  clear:    { wind: .14, gust: .3,  flutter: .4,  dim: 0,   cloud: .1,  glow: 1,    snow: .35, amber: 1 },
  overcast: { wind: .32, gust: .5,  flutter: .9,  dim: .08, cloud: .6,  glow: .75,  snow: .6,  amber: 0 },
  storm:    { wind: .85, gust: 1,   flutter: 1.5, dim: .25, cloud: .95, glow: .4,   snow: 1,   amber: 0 },
  clearing: { wind: .06, gust: .15, flutter: .3,  dim: 0,   cloud: .2,  glow: 1.25, snow: .12, amber: 0 },
  waiting:  { wind: .02, gust: .05, flutter: .1,  dim: .04, cloud: .2,  glow: 1,    snow: .22, amber: .25 },
};
const MODES = { clear: 'breathe', overcast: 'twinkle', storm: 'chase', clearing: 'sweep', waiting: 'blink' };
const PARAMS = Object.assign({ dir: 1 }, STATES.clear);
let target = Object.assign({ dir: 1 }, STATES.clear), stateName = 'clear';
// 不在（no Claude session at all）: the string goes dark; when a session shows up the bulbs light one by one
let absent = false, powerSet = false, onT = -99, offT = -99;
let mode = 'breathe', prevMode = 'breathe', modeT = -99;
let accum = Q.has('snow') ? clamp0(+Q.get('snow')) : .3;   // 地面／枝上積雪厚度 0..1，下雪時慢慢變厚
function clamp0(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

// ---------- helpers ----------
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const NZ = new Float32Array(1024); { const r = mulberry(99); for (let i = 0; i < 1024; i++) NZ[i] = r(); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return NZ[i & 1023] * (1 - u) + NZ[(i + 1) & 1023] * u; }
function hash(a, b, c) { let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1440662683); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// ---------- palettes: winter night / dusk / overcast day ----------
const PAL = {
  night: { skyTop: '#060a1c', skyMid: '#111a3a', skyLow: '#283361', hill: '#3a4878', pine: '#141c34', snowFar: '#6d7cb0', snowNear: '#46548a', snowLit: '#b4c2ec', shadow: '#2a3460',
           stalk: '#2a2c40', twig: '#0d1020', bark: '#080a12', barkRim: '#4a5a86', snow: '#c9d5f6', sun: '#eef2ff', glow: '#8fa6d8', cloud: '#262f55' },
  gold:  { skyTop: '#33406e', skyMid: '#a3809f', skyLow: '#f2b98a', hill: '#8c86ab', pine: '#3a3552', snowFar: '#e8cfd2', snowNear: '#a3a1c6', snowLit: '#fff0de', shadow: '#6b6a99',
           stalk: '#6e5250', twig: '#2a2030', bark: '#1a1420', barkRim: '#e0a070', snow: '#fff0e4', sun: '#fff2d8', glow: '#ffc68a', cloud: '#e6c2c4' },
  day:   { skyTop: '#7896bd', skyMid: '#aec2d8', skyLow: '#e0e8f0', hill: '#a9b9cb', pine: '#4f5d6a', snowFar: '#eaf0f7', snowNear: '#c9d5e4', snowLit: '#ffffff', shadow: '#97a8c2',
           stalk: '#86745c', twig: '#3a3238', bark: '#2a2228', barkRim: '#8a7a70', snow: '#ffffff', sun: '#fffef5', glow: '#fff6d8', cloud: '#eef2f6' },
};
for (const k in PAL) for (const c in PAL[k]) PAL[k][c] = hex(PAL[k][c]);
// bulb colours along the string (classic multicolour), and the warm amber used when it's idle
const BULB = ['#ff3b3b', '#3ddc6a', '#ffbf3a', '#4aa8ff', '#ff5fd2'].map(hex), AMBER = hex('#ffb347'), STAR = hex('#ffe58a');

// ---------- world ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, horizonY, groundY, trunkX, T0, tree, nodes, clusters, backC, frontC, crown, blades, bg, pal, light, sun, clouds = [];
let clumps = [], stars = [], glints = [], paused = false, time = 0, windOff = 0;
let wire = [], bulbs = [], starNode = null, glowSpr = [], starSpr = null, lightsLevel = 0, lightsCol = [255, 200, 120];

function hours() { if (CONFIG.clockHours != null) return CONFIG.clockHours; const d = new Date(); return d.getHours() + d.getMinutes() / 60; }

function computeLight() {
  const h = hours();
  const elev = Math.sin((h - 7) / 10 * Math.PI);           // short winter day: ~07:00–17:00
  let wg = clamp(1 - Math.abs(elev - .1) / .35), wd = clamp((elev - .1) / .4), wn = clamp((.05 - elev) / .25);
  const s = wg + wd + wn || 1; wg /= s; wd /= s; wn /= s;
  const p = {};
  for (const k in PAL.day) p[k] = [0, 1, 2].map(i => PAL.night[k][i] * wn + PAL.gold[k][i] * wg + PAL.day[k][i] * wd);
  const isMoon = wn > .5;
  // moon hangs high on the left at night; the low winter sun drifts across by day
  const frac = isMoon ? .25 : clamp((h - 7) / 10);
  const x = isMoon ? W * .2 : W * .08 + (W * .5 - W * .08) * frac;
  const y = isMoon ? H * .16 : Math.max(H * .14, horizonY - Math.max(0, elev) * H * .6 - H * .03);
  return { pal: p, wn, wg, wd, dark: wn + wg * .55 + wd * .15, sun: { x, y, moon: isMoon, r: Math.max(2, Math.round(H * (isMoon ? .016 : .018))) } };
}

// ---------- tree (same skeleton as 孤樹; the crown is bare twigs now) ----------
function genTree() {
  const R = mulberry(CONFIG.seed * 7919 + 1);
  nodes = []; clusters = [];
  T0 = Math.max(3, Math.round(H * .036));
  function grow(depth, len, thick, rel, pw) {
    let world = pw + rel;
    if (Math.abs(world) > 1.45) { rel -= Math.sign(world) * (Math.abs(world) - 1.45) * .9; world = pw + rel; }
    const n = { depth, len, thick, rel, th: 0, w: 0, kids: [], ph: R() * 99, bend: (R() - .5) * (depth === 0 ? .06 : .3) * len, x0: 0, y0: 0, x1: 0, y1: 0, wa: 0, snow: 0 };
    n.tr = thick / T0;
    n.k = 32 + 240 * n.tr * n.tr;
    n.c = 2 * Math.sqrt(n.k) * .13;
    n.sens = Math.pow(1 - Math.min(1, n.tr), 1.5) + .05;
    nodes.push(n);
    if (depth < 6) {
      const count = depth === 0 ? 3 : depth < 3 ? 2 + (R() < .45 ? 1 : 0) : 2 + (R() < .2 ? 1 : 0);
      for (let i = 0; i < count; i++) {
        if (depth >= 4 && R() < .08) continue;
        const s = (i / (count - 1)) * 2 - 1;
        const spread = depth === 0 ? 1.15 : depth === 1 ? .7 : .55;
        const a = s * spread * (.75 + R() * .5) + (R() - .5) * .35;
        const kl = depth === 0 ? 1.06 : .72 + R() * .12;
        n.kids.push(grow(depth + 1, len * kl, Math.max(1, thick * (depth === 0 ? .62 : .66)), a, world));
      }
    }
    const baseR = H * (.06 - depth * .005);
    if (depth === 2) { clusters.push(cluster(n, .9, baseR * 1.4, .05, R)); clusters.push(cluster(n, .5, baseR * 1.2, .1, R)); }
    if (depth >= 3) {
      clusters.push(cluster(n, 1, baseR, R(), R));
      if (depth < 6) clusters.push(cluster(n, .45 + R() * .35, baseR * .85, R(), R));
    }
    return n;
  }
  tree = grow(0, H * .13, T0, (R() - .5) * .06, 0);
  // more flex than the leafy oak (nothing to catch the wind) – but the loaded limbs still sway
  for (const n of nodes) n.leafy = .35;
  solve(tree, trunkX, groundY, 0);
  for (const n of nodes) { n.wa0 = n.wa; n.snow = .55 + Math.random() * .45; }
  clusters.forEach(placeCluster);
  let cx = 0, cy = 0; for (const c of clusters) { cx += c.x; cy += c.y; } cx /= clusters.length; cy /= clusters.length;
  let r = 0; for (const c of clusters) r = Math.max(r, Math.hypot(c.x - cx, c.y - cy) + c.r * .6);
  crown = { x: cx, y: cy, r };
  for (const c of clusters) { c.rx = c.x; c.ry = c.y; c.wa0 = c.n.wa; }
  backC = clusters.filter(c => c.z < .4).sort((a, b) => a.z - b.z);
  frontC = clusters.filter(c => c.z >= .4).sort((a, b) => a.z - b.z);
  genGarland();
}
function cluster(n, f, r, z, R) {
  r = Math.max(3, Math.round(r * (.8 + R() * .5)));
  const lobes = [], nl = 3 + (R() * 3 | 0);
  for (let i = 0; i < nl; i++) lobes.push({ dx: (R() - .5) * r, dy: (R() - .5) * r * .8, rr: r * (.55 + R() * .3) });
  lobes.push({ dx: 0, dy: 0, rr: r * .7 });
  return { n, f, off: (R() - .5) * r * .8, r, z, ph: R() * 6.28, lobes, id: (R() * 1e6) | 0, spr: null, x: 0, y: 0 };
}
function solve(n, x, y, pw) {
  n.wa = pw + n.rel + n.th; n.x0 = x; n.y0 = y;
  n.x1 = x + Math.sin(n.wa) * n.len; n.y1 = y - Math.cos(n.wa) * n.len;
  for (const k of n.kids) solve(k, n.x1, n.y1, n.wa);
}
function placeCluster(c) {
  const n = c.n;
  c.x = n.x0 + (n.x1 - n.x0) * c.f + Math.cos(n.wa) * c.off;
  c.y = n.y0 + (n.y1 - n.y0) * c.f + Math.sin(n.wa) * c.off;
}
// each cluster is a clump of fine bare twigs growing out along its branch, with snow lying on their tops
function buildSprites() {
  const p = pal;
  for (const c of clusters) {
    const S = c.r * 2 + 5, o = c.r + 2, R = mulberry(c.id), grid = new Uint8Array(S * S);
    const put = (x, y, v) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < S && y < S && grid[y * S + x] < v) grid[y * S + x] = v; };
    const twig = (x, y, a, len, gen) => {
      for (let s = 0; s < len; s++) {
        x += Math.sin(a); y -= Math.cos(a); a += (R() - .5) * .45;
        if (Math.hypot(x - o, y - o) > c.r + 1) break;
        put(x, y, 1);
        if (gen < 2 && s > 1 && R() < .14) twig(x, y, a + (R() < .5 ? -1 : 1) * (.5 + R() * .4), (len - s) * .6, gen + 1);
      }
    };
    const nt = 3 + Math.round(c.r / 3);
    for (let i = 0; i < nt; i++) {
      const a = c.wa0 + (R() - .5) * 2.2 * .6 + (R() - .5) * .6;
      twig(o + (R() - .5) * c.r * .5, o + (R() - .5) * c.r * .5, a, c.r * (.55 + R() * .5), 0);
    }
    // snow caps on twig tops
    for (let y = 1; y < S; y++) for (let x = 0; x < S; x++)
      if (grid[y * S + x] === 1 && grid[(y - 1) * S + x] === 0 && hash(c.id, x, y) < .45 + accum * .4) grid[(y - 1) * S + x] = 2;
    const back = c.z < .4;
    const tw = back ? mix(p.twig, p.skyMid, .25) : p.twig, sn = back ? mix(p.snow, p.skyMid, .4) : p.snow;
    const can = c.spr || (c.spr = document.createElement('canvas'));
    can.width = S; can.height = S;
    const g = can.getContext('2d'), img = g.createImageData(S, S), d = img.data;
    for (let i = 0; i < S * S; i++) {
      if (!grid[i]) continue;
      const col = grid[i] === 2 ? sn : tw;
      d[i * 4] = col[0]; d[i * 4 + 1] = col[1]; d[i * 4 + 2] = col[2]; d[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    c.o = o;
  }
}

// ---------- the string of lights ----------
// A garland spirals down the crown: a front pass (in front of the branches) then a back pass (behind them, dimmer).
// Every anchor is pinned to a point on a branch, so the string sways and swings with the tree.
function genGarland() {
  const cand = [];
  for (const n of nodes) if (n.depth >= 2) for (const f of [.5, 1]) cand.push({ n, f, x: n.x0 + (n.x1 - n.x0) * f, y: n.y0 + (n.y1 - n.y0) * f });
  const used = new Set();
  const snap = (x, y) => {
    let best = null, bd = 1e9;
    for (const c of cand) { if (used.has(c)) continue; const d = Math.hypot(c.x - x, (c.y - y) * 1.4); if (d < bd) { bd = d; best = c; } }
    used.add(best); return { n: best.n, f: best.f };
  };
  const cx = crown.x, cy = crown.y, r = crown.r;
  const yT = cy - r * .5, yB = cy + r * .42, rows = 4;
  const hw = y => Math.sqrt(Math.max(0, r * r - (y - cy) * (y - cy))) * .8;
  const pts = [];
  for (let k = 0; k < rows; k++) {
    const y0 = yT + (yB - yT) * k / rows, y1 = yT + (yB - yT) * (k + .5) / rows, y2 = yT + (yB - yT) * (k + 1) / rows;
    const xa = cx - hw(y0) * (k ? 1 : .55), xb = cx + hw(y1);
    if (!k) pts.push({ ...snap(xa, y0), back: false });
    const nf = 3 + (k > 0 ? 1 : 0);
    for (let i = 1; i <= nf; i++) { const t = i / nf; pts.push({ ...snap(xa + (xb - xa) * t, y0 + (y1 - y0) * t + Math.sin(t * Math.PI) * r * .06), back: false }); }
    const xc = cx - hw(y2);
    const nb = 3;
    for (let i = 1; i <= nb; i++) { const t = i / nb; pts.push({ ...snap(xb + (xc - xb) * t, y1 + (y2 - y1) * t - Math.sin(t * Math.PI) * r * .05), back: true }); }
  }
  // segments between consecutive anchors; a segment is "back" when it runs on the far side
  wire = []; bulbs = [];
  const at = a => ({ x: a.n.x0 + (a.n.x1 - a.n.x0) * a.f, y: a.n.y0 + (a.n.y1 - a.n.y0) * a.f });
  for (let i = 1; i < pts.length; i++) {
    const A = pts[i - 1], B = pts[i], pa = at(A), pb = at(B), d = Math.hypot(pb.x - pa.x, pb.y - pa.y);
    const seg = { A, B, back: B.back, sag: d * .16 + 1.5, steps: Math.max(2, Math.ceil(d * 1.3)) };
    wire.push(seg);
    const cnt = Math.max(1, Math.round(d / 6.5));
    for (let j = 0; j < cnt; j++) bulbs.push({ seg, s: (j + .5) / cnt, ci: bulbs.length % BULB.length, b: 0, x: 0, y: 0 });
  }
  // the star sits on the highest branch tip
  starNode = nodes.reduce((m, n) => n.y1 < m.y1 ? n : m, nodes[0]);
}
function segPoint(seg, s) {
  const A = seg.A, B = seg.B;
  const ax = A.n.x0 + (A.n.x1 - A.n.x0) * A.f, ay = A.n.y0 + (A.n.y1 - A.n.y0) * A.f;
  const bx = B.n.x0 + (B.n.x1 - B.n.x0) * B.f, by = B.n.y0 + (B.n.y1 - B.n.y0) * B.f;
  return [ax + (bx - ax) * s, ay + (by - ay) * s + seg.sag * 4 * s * (1 - s)];
}
function buildGlowSprites() {
  const mk = (col, R) => {
    const can = document.createElement('canvas'); can.width = can.height = R * 2 + 1;
    const g = can.getContext('2d'), gr = g.createRadialGradient(R + .5, R + .5, 0, R + .5, R + .5, R);
    gr.addColorStop(0, css(col, .9)); gr.addColorStop(.25, css(col, .35)); gr.addColorStop(1, css(col, 0));
    g.fillStyle = gr; g.fillRect(0, 0, R * 2 + 1, R * 2 + 1); return can;
  };
  glowSpr = BULB.map(c => mk(c, 6)); glowSpr.amber = mk(AMBER, 6);
  starSpr = mk(STAR, 14);
}
// brightness of bulb i (0..1+) in a lighting mode at time t
function modeB(m, i, t, N) {
  switch (m) {
    case 'breathe': return .3 + .7 * (.5 - .5 * Math.cos((t / 5 - i * .012) * Math.PI * 2));
    case 'twinkle': return .1 + .9 * smooth(.42, .72, noise1(t * 2.2 + i * 7.31));
    case 'chase': { const p = (((i - t * 13) % 5) + 5) % 5; return p < 2 ? 1 : .1; }
    case 'sweep': { const head = (t * 34) % (N + 50) - 20; return .7 + .5 * Math.exp(-(((i - head) / 7) ** 2)); }
    // the whole string flashes together: bright, with a sharp double blink every 1.6 s (it reads as "hey, over here")
    case 'blink': { const p = t % 1.6; return (p < .16 || (p > .32 && p < .48)) ? .05 : 1.1; }
  }
  return 0;
}
function updateLights() {
  const N = bulbs.length, step = 4.2 / Math.max(1, N);
  const fade = clamp((time - modeT) / .6);
  let sr = 0, sg = 0, sb = 0, sum = 0;
  for (let i = 0; i < N; i++) {
    const L = bulbs[i];
    let b = modeB(mode, i, time, N) * fade + modeB(prevMode, i, time, N) * (1 - fade);
    if (absent) {
      const e = time - offT;                              // power cut: the whole string flickers, then dark
      b = e < .9 ? b * (hash(Math.floor(e * 16), 3, 1) > .4 ? 1 : .08) * (1 - e / 1.1) : 0;
    } else {
      const e = time - onT - i * step;                    // lighting ceremony: one bulb after another
      b = e < 0 ? 0 : b + Math.max(0, 1 - e / .3) * .9;
    }

  requestAnimationFrame(loop);
  if (now - last < 1000 / CONFIG.fps - 2) return;
  const dt = Math.min(.05, (now - last) / 1000 || 1 / 30); last = now; time += dt;
  const h = hours();
  if (now - lastRefresh > 30000 || Math.abs(h - lastHours) > .05) { lastRefresh = now; lastHours = h; lastAccum = accum; refresh(); }
  update(dt); draw();
}

// ---------- state from VibingWrapper ----------
function setAbsent(v) {
  v = !!v;
  if (!powerSet) { powerSet = true; absent = v; onT = -99; offT = -99; return; }   // first state: no ceremony
  if (v === absent) return;
  absent = v;
  if (absent) offT = time; else onT = time;
}
function applyState(j) {
  if (typeof j === 'string') j = { state: j, force: true };
  if (j && j.state === 'none') setAbsent(true);
  else if (j && Array.isArray(j.sessions)) setAbsent(j.sessions.every(x => !x));
  else if (j && j.state) setAbsent(false);
  const s = (j && STATES[j.state]) ? j.state : 'clear';
  if (s === stateName && j && !j.force) return;
  if (s !== stateName) { prevMode = mode; mode = MODES[s]; modeT = time; }
  stateName = s; target = Object.assign({ dir: target.dir }, STATES[s]);
  markPanel();
}
async function requestState() { try { const r = await fetch('state.json', { cache: 'no-store' }); if (r.ok) applyState(await r.json()); } catch (e) {} }
setInterval(() => { if (CONFIG.polling && !paused && !document.hidden) requestState(); }, 1000);
window.wpPause = on => { paused = !!on; if (!paused) { last = performance.now(); requestAnimationFrame(loop); } };
document.addEventListener('visibilitychange', () => { if (!document.hidden && !paused) { last = performance.now(); requestAnimationFrame(loop); } });
function setSessions(a) { if (Array.isArray(a)) setAbsent(a.every(x => !x)); }   // one tree for all sessions (for now)
function setOverride(p) { if (p) Object.assign(target, p); else target = Object.assign({ dir: target.dir }, STATES[stateName]); }
function relight() { if (!powerSet) powerSet = true; absent = false; onT = time; }
window.theme = { requestState, applyState, setSessions, setOverride, STATES, PARAMS, CONFIG, refresh, relight,
                 shake: () => shake(crown.x, crown.y, 1), strike: () => shake(crown.x, crown.y, 1.3) };

// ---------- touch the tree (in a browser; the real wallpaper ignores the mouse) ----------
function toWorld(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  const p = toWorld(e); let best = null, bd = 16;
  for (const n of nodes) { if (n.depth === 0) continue; const d = Math.hypot(n.x1 - p.x, n.y1 - p.y); if (d < bd) { bd = d; best = n; } }
  const inCrown = Math.hypot(p.x - crown.x, p.y - crown.y) < crown.r || (Math.abs(p.x - trunkX) < T0 * 2 && p.y > crown.y && p.y < groundY + 2);
  if (!best && !inCrown) return;
  drag = { n: null, cand: best, x: p.x, y: p.y, sx: p.x, sy: p.y, t: performance.now() };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag) { const p = toWorld(e); cv.style.cursor = crown && Math.hypot(p.x - crown.x, p.y - crown.y) < crown.r ? 'grab' : ''; return; }
  const p = toWorld(e); drag.x = p.x; drag.y = p.y;
  if (!drag.n && drag.cand && Math.hypot(p.x - drag.sx, p.y - drag.sy) > 2) { drag.n = drag.cand; cv.style.cursor = 'grabbing'; }
});
cv.addEventListener('pointerup', () => {
  if (!drag) return;
  if (!drag.n) shake(drag.sx, drag.sy, 1);
  drag = null; cv.style.cursor = '';
});

// ---------- test panel (?panel=1) ----------
const panel = document.getElementById('panel');
function markPanel() {
  if (panel.hidden) return;
  for (const b of document.querySelectorAll('#states button')) b.classList.toggle('on', b.dataset.s === (absent ? 'none' : stateName));
}
if (Q.has('panel')) {
  panel.hidden = false;
  const box = document.getElementById('states');
  for (const s of ['none', ...Object.keys(STATES)]) { const b = document.createElement('button'); b.textContent = LABELS[s]; b.dataset.s = s;
    b.onclick = () => { CONFIG.polling = false; tour.checked = false; applyState(s); }; box.appendChild(b); }
  const tour = document.getElementById('tour'), order = ['none', 'clear', 'overcast', 'storm', 'clearing', 'waiting'];
  setInterval(() => { if (tour.checked) { CONFIG.polling = false; const cur = absent ? 'none' : stateName; applyState(order[(order.indexOf(cur) + 1) % order.length]); } }, 9000);
  const dirB = document.getElementById('dir');
  dirB.onclick = () => { target.dir = -Math.sign(target.dir || 1); dirB.textContent = target.dir > 0 ? '風向 →' : '風向 ←'; };
  document.getElementById('shake').onclick = () => shake(crown.x, crown.y, 1.2);
  document.getElementById('relight').onclick = () => { CONFIG.polling = false; relight(); markPanel(); };
  document.getElementById('more').onclick = () => { accum = Math.min(1, accum + .2); for (const n of nodes) n.snow = 1; buildSprites(); };
  document.getElementById('seed').onclick = () => { CONFIG.seed++; rebuild(); };
  const hour = document.getElementById('hour'), ht = document.getElementById('hourText'), rt = document.getElementById('realtime');
  const showH = () => { const h = hours(); ht.textContent = String(Math.floor(h)).padStart(2, '0') + ':' + String(Math.round(h % 1 * 60)).padStart(2, '0'); hour.value = h; };
  hour.oninput = () => { CONFIG.clockHours = +hour.value; rt.checked = false; refresh(); showH(); };
  rt.checked = CONFIG.clockHours == null; rt.onchange = () => { CONFIG.clockHours = rt.checked ? null : +hour.value; refresh(); showH(); };
  showH();
  const st = document.getElementById('status');
  setInterval(() => { st.textContent = `${LABELS[absent ? 'none' : stateName]}・燈 ${bulbs.length} 顆 亮度 ${Math.round(lightsLevel * 100)}%・風 ${PARAMS.wind.toFixed(2)}・雪 ${PARAMS.snow.toFixed(2)}・積雪 ${Math.round(accum * 100)}%・雪塊 ${clumps.length}・種子 ${CONFIG.seed}`; }, 300);
}

addEventListener('resize', () => { clearTimeout(rebuild.t); rebuild.t = setTimeout(rebuild, 200); });
rebuild(); markPanel(); requestState();
requestAnimationFrame(loop);
</script>
