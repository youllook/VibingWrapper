<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>海月桌布</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04121c;
               user-select: none; -webkit-user-select: none; -webkit-user-drag: none; cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; pointer-events: none; }
  #hud { position: fixed; left: 10px; bottom: 8px; font: 12px/1.5 Consolas, monospace; color: rgba(255,255,255,.85);
         background: rgba(0,0,0,.4); padding: 4px 8px; border-radius: 4px; white-space: pre; display: none; }
  body.debug #hud { display: block; }
  #nogl { display: none; position: fixed; inset: 0; color: #dde; font: 14px sans-serif; padding: 24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="nogl">這個主題需要 WebGL2。</div>
<script>
/* =====================================================================================
 * 海月 (jellyfish) — a realistic sea floor with moon jellies as a live wallpaper
 * 2026-10-15 first version
 *
 * Fully procedural, raw WebGL2, no libraries, no model / image files (the jelly is a stand-in until the modelled
 * moon_jelly.glb arrives — see 素材.md).
 *  - Units are metres; the camera sits 1.4 m above the sand, ~8 m under the surface, looking a little up.
 *  - Everything is shaded in LINEAR light into a 4× MSAA float target, then one pass tone-maps it (so the god rays,
 *    the transparent jellies and the particles add up correctly).
 *  - Water: per-channel extinction along the view ray (red dies first, the distance turns blue-green) with an
 *    in-scatter colour that brightens toward the surface and toward the light; the light reaching any point is the
 *    surface light attenuated by its depth (a second, per-channel extinction).
 *  - The surface seen from below: rippled normals; Snell's window where the ripples tilt it into view, total internal
 *    reflection of the dark water elsewhere.
 *  - Sea floor: a heightfield (fbm dunes, a far rise, rocks as noisy domes) ray-marched per pixel, sand ripples,
 *    animated caustics (two layers of moving-point Worley edges, domain-warped).
 *  - Eelgrass: instanced ribbon blades (gl_VertexID, no buffers), each bent along a circular arc by the current and
 *    a slow sway; lit per vertex.
 *  - Moon jellies: the bell is a surface of revolution driven by a pulse curve (fast contraction, slower relaxation,
 *    a rest), the contraction travels from the apex to the margin; body physics on the CPU (thrust from the
 *    contraction, drag, slight negative buoyancy, steering toward a wandering home). The oral arms and the marginal
 *    tentacles trail the bell through a short position history (in the water's frame), so they hang back when it
 *    swims and stream when it turns.
 *  - God rays: a separate additive pass ray-marches the water column and looks up each sample's light through a
 *    moving shaft pattern on the surface (Henyey–Greenstein forward scattering).
 *  - Infrastructure (state machine, polling, Taipei sun, day/night, wpPause, bench, session slots) is shared with
 *    the other themes.
 * ===================================================================================== */

/* ------------------------------ config ------------------------------ */
const FPS = 30;
const RES_OVERRIDE = +(new URLSearchParams(location.search).get('res') || 0);
const MAX_PIXELS = 1920 * 1080;
function resScale(w, h) { return RES_OVERRIDE || Math.min(1, Math.sqrt(MAX_PIXELS / (w * h))); }
const CONFIG = { fullTransition: 4.0, polling: true, clockHours: /[?&]day=1/.test(location.search) ? 10.5 : /[?&]night=1/.test(location.search) ? 22 : null, skip: '', msaa: 4 };
const DEBOUNCE_MS = 300;
const POLL_MS = 1000;
const CAM = { pos: [0, 1.1, 0], pitch: 0.20, vfov: 0.85 };
const SURF = 9.0;                            // the surface, metres above the sand datum

const PARAMS = {
  turbidity:  [0, 1],                        // murk: shorter visibility, more marine snow
  current:    [0, 1],                        // water flow: grass lean, drift, particles
  shafts:     [0, 1],                        // god-ray strength
  caustics:   [0, 1],                        // caustic strength on the sand / jellies
  chop:       [0, 1],                        // surface agitation (faster, harder ripples and caustics)
  bubbles:    [0, 1],                        // bubble streams from the floor
  brightness: [0, 1],                        // 1 full light … waiting dims a little
  beacon:     [0, 1],                        // 等你 star
};
const STATES = {
  clear:    { turbidity: 0.25, current: 0.12, shafts: 0.70, caustics: 0.75, chop: 0.25, bubbles: 0.15, brightness: 1.00, beacon: 0 },
  overcast: { turbidity: 0.60, current: 0.35, shafts: 0.40, caustics: 0.40, chop: 0.40, bubbles: 0.30, brightness: 0.92, beacon: 0 },
  storm:    { turbidity: 0.75, current: 1.00, shafts: 0.45, caustics: 0.55, chop: 1.00, bubbles: 1.00, brightness: 0.90, beacon: 0 },
  clearing: { turbidity: 0.15, current: 0.08, shafts: 1.00, caustics: 1.00, chop: 0.30, bubbles: 0.20, brightness: 1.00, beacon: 0 },
  waiting:  { turbidity: 0.30, current: 0.00, shafts: 0.55, caustics: 0.50, chop: 0.10, bubbles: 0.00, brightness: 0.82, beacon: 1 },
};
const KEYS = { '1': 'clear', '2': 'overcast', '3': 'storm', '4': 'clearing', '5': 'waiting' };

/* ------------------------------ the floor: rocks and eelgrass meadows ------------------------------ */
// rocks: [x, z, radius, height]; the left third (desktop icons) stays calm and low
const ROCKS = [[-4.6, 6.4, 0.95, 0.55], [-3.5, 7.3, 0.55, 0.35], [3.9, 5.4, 0.70, 0.42], [6.2, 10.0, 1.50, 0.95],
               [-8.5, 15.0, 2.20, 1.30], [1.9, 8.8, 0.40, 0.22]];
// seagrass beds: [x, z, radius, leaf scale]. Shoots are shared out by on-screen area (∝ area / distance²), so the
// near beds read as a dense carpet and the far ones cost little; the open sand in the middle keeps the caustics
const CLUSTERS = [[-3.9, 5.2, 2.30, 1.00], [4.4, 5.6, 2.50, 1.10], [7.8, 10.5, 3.20, 1.15], [-6.8, 10.5, 3.20, 1.10],
                  [1.2, 14.5, 3.60, 1.05], [-3.2, 18.5, 4.20, 1.00],
                  [7.2, 19.0, 4.20, 1.00], [-11.0, 16.0, 4.20, 1.00], [12.5, 13.5, 3.20, 1.05]];
const LEAVES = 6;                            // leaves per shoot, fanning from one point
const SHOOTS = 3000;
const BLADES = SHOOTS * LEAVES;
const GRASS_SEG = 6;
const clusterStart = (() => {                // cumulative shoot counts per bed
  const w = CLUSTERS.map(([x, z, r]) => Math.PI * r * r / Math.max(9, x * x + z * z));
  const sum = w.reduce((a, b) => a + b, 0);
  const out = [0];
  w.forEach(v => out.push(out[out.length - 1] + v / sum * SHOOTS));
  return new Float32Array(out.map(Math.round));
})();
const VENTS = [[1.3, 0.0, 7.2], [-2.6, 0.0, 11.5], [5.1, 0.0, 13.0]];   // bubble streams (y filled from the floor)

/* ------------------------------ state machine (same as the other themes) ------------------------------ */
const smooth = t => t * t * (3 - 2 * t);
let current = { ...STATES.clear };
let from = { ...current }, to = { ...current };
let tStart = 0, tDur = 0;
let stateName = 'clear', pending = null, debounceT = 0;
let override = null;
function now() { return performance.now() / 1000; }
function step(t) {
  const k = tDur > 0 ? Math.min(1, (t - tStart) / tDur) : 1;
  const e = smooth(k);
  for (const p in PARAMS) current[p] = from[p] + (to[p] - from[p]) * e;
}
function applyState(name) {
  if (!STATES[name]) return;
  const t = now();
  step(t);
  from = { ...current };
  to = { ...STATES[name] };
  let dist = 0;
  for (const p in PARAMS) { const [lo, hi] = PARAMS[p]; dist = Math.max(dist, Math.abs(to[p] - from[p]) / (hi - lo)); }
  tStart = t; tDur = CONFIG.fullTransition * dist; stateName = name;
}
function requestState(name) {
  if (!STATES[name]) return;
  pending = name;
  clearTimeout(debounceT);
  debounceT = setTimeout(() => { if (pending !== stateName) applyState(pending); pending = null; }, DEBOUNCE_MS);
}

/* ------------------------------ inputs ------------------------------ */
for (const ev of ['contextmenu', 'selectstart', 'dragstart', 'mousedown']) addEventListener(ev, e => e.preventDefault());
addEventListener('keydown', e => {
  if (KEYS[e.key]) requestState(KEYS[e.key]);
  if (e.key === 'd') document.body.classList.toggle('debug');
});
let lastPolled = null, sessionsFile = null, sessionsOverride = null;
async function poll() {
  if (!CONFIG.polling) return;
  try {
    const r = await fetch('state.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json(), s = j.state;
      if (STATES[s] && s !== lastPolled) { lastPolled = s; requestState(s); }
      sessionsFile = Array.isArray(j.sessions) ? Array.from({ length: 5 }, (_, i) => STATES[j.sessions[i]] ? j.sessions[i] : null) : null;
    }
  } catch { /* unreadable → keep the current state */ }
}
setInterval(poll, POLL_MS);
poll();

/* ------------------------------ day / night (Taipei; same model as the other themes) ------------------------------ */
function sunAltitude(date, lat = 25.04, lon = 121.56) {
  const rad = Math.PI / 180;
  const n = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
  const L = (280.46 + 0.9856474 * n) % 360;
  const g = ((357.528 + 0.9856003 * n) % 360) * rad;
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
  const eps = (23.439 - 0.0000004 * n) * rad;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda));
  const dec = Math.asin(Math.sin(eps) * Math.sin(lambda));
  const gmst = (280.46061837 + 360.98564736629 * n) % 360;
  const ha = (gmst + lon) * rad - ra;
  return Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
}
function sky() {
  let d = new Date();
  if (CONFIG.clockHours != null) { d = new Date(d); d.setHours(0, 0, 0, 0); d = new Date(d.getTime() + CONFIG.clockHours * 3600000); }
  const alt = sunAltitude(d);
  const night = 1 - smooth(Math.min(1, Math.max(0, (alt + 9) / 13)));
  const twilight = Math.exp(-Math.pow((alt + 1.5) / 5, 2));
  const hours = d.getHours() + d.getMinutes() / 60;
  const frac = Math.min(1, Math.max(0, (hours - 5.5) / 13));
  const sunUp = smooth(Math.min(1, Math.max(0, (alt + 2) / 6)));
  return { alt, night, twilight, sunUp, hours, frac };
}

/* ------------------------------ camera ------------------------------ */
const cam = (() => {
  const p = CAM.pitch;
  const fwd = [0, Math.sin(p), Math.cos(p)], right = [1, 0, 0], up = [0, Math.cos(p), -Math.sin(p)];
  return { fwd, right, up };
})();
let tanHalf = [Math.tan(CAM.vfov / 2) * 16 / 9, Math.tan(CAM.vfov / 2)];
function dirFromNdc(x, y, th = tanHalf) {
  const d = [0, 1, 2].map(i => cam.fwd[i] + cam.right[i] * x * th[0] + cam.up[i] * y * th[1]);
  const l = Math.hypot(...d);
  return d.map(v => v / l);
}
const TAN_169 = [Math.tan(CAM.vfov / 2) * 16 / 9, Math.tan(CAM.vfov / 2)];
function fromScreen(sx, sy, dist) {             // a world point at screen position (0..1, y down) on a 16:9 frame
  const d = dirFromNdc(sx * 2 - 1, (1 - sy) * 2 - 1, TAN_169);
  return d.map((v, i) => CAM.pos[i] + v * dist);
}

/* ------------------------------ WebGL2 ------------------------------ */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, preserveDrawingBuffer: false, powerPreference: 'low-power' });
if (!gl) document.getElementById('nogl').style.display = 'block';
const floatRT = gl && !!gl.getExtension('EXT_color_buffer_float');

const COMMON = `#version 300 es
precision highp float;
precision highp int;
uniform vec2 uRes;
uniform vec3 uCamPos, uFwd, uRight, uUp;
uniform vec2 uTanHalf;
uniform float uTime;
uniform vec3 uLd;                  // direction the light travels in the water (down)
uniform vec3 uLsurf;               // light just under the surface (linear)
uniform vec3 uDeep, uUpC;          // water in-scatter: looking level / down, looking up
uniform vec3 uSigma, uSigK;        // view extinction, down-welling extinction (1/m)
uniform float uCaust, uShafts, uTurb, uChop, uNight, uBright, uCurrent;
uniform vec2 uFlow;                // integrated flow offset (m), for drifting patterns
uniform int uNRocks, uSteps;
uniform vec4 uClustersBG[${CLUSTERS.length}];       // loop bounds as uniforms: keeps the compiler from unrolling (compile time)
uniform vec4 uRocks[${ROCKS.length}];
const float SURF = ${SURF.toFixed(2)};
#define saturate(x) clamp(x, 0.0, 1.0)
uvec2 pcg2d(uvec2 v) {
  v = v * 1664525u + 1013904223u; v.x += v.y * 1664525u; v.y += v.x * 1664525u; v ^= v >> 16u;
  v.x += v.y * 1664525u; v.y += v.x * 1664525u; v ^= v >> 16u; return v;
}
vec2 hash22(vec2 p) { return vec2(pcg2d(uvec2(ivec2(floor(p)) + 32768))) * (1.0 / 4294967295.0); }
float hash12(vec2 p) { return hash22(p).x; }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * noise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p + 3.1; a *= 0.5; } return s; }
float smax(float a, float b, float k) { float h = saturate(0.5 + 0.5 * (a - b) / k); return mix(b, a, h) + k * h * (1.0 - h); }
float rocksH(vec2 p) {
  float h = -9.0;
  for (int i = 0; i < uNRocks; i++) {
    vec4 r = uRocks[i];
    vec2 d = (p - r.xy) / r.z;
    float q = 1.0 - dot(d, d);
    if (q > -0.2) {
      float n = noise(p * 2.6 + float(i) * 7.3) * 0.30 + noise(p * 7.0 + float(i)) * 0.10;
      h = max(h, r.w * (sqrt(max(q, 0.0)) * 1.05 + n - 0.25) - 0.05);
    }
  }
  return h;
}
float dunes(vec2 p) {
  return 0.28 * fbm(p * 0.13) - 0.14 + 0.9 * smoothstep(12.0, 45.0, p.y) + 0.5 * smoothstep(-5.0, -16.0, p.x) * smoothstep(4.0, 16.0, p.y);
}
float seabed(vec2 p) { return smax(dunes(p), rocksH(p), 0.12); }
float ripples(vec2 p) {
  vec2 w = p + 0.6 * vec2(noise(p * 0.5), noise(p * 0.5 + 9.0));
  return 0.010 * sin(dot(w, vec2(5.2, 1.4))) * (0.5 + 0.5 * noise(p * 0.8 + 3.0));
}
// caustics: two layers of Worley edges with moving feature points, domain warped
float caustic(vec2 p, float t) {
  p += 0.35 * vec2(noise(p * 0.6 + t * 0.07), noise(p * 0.6 + 5.0 - t * 0.07));
  float c = 0.0;
  for (int L = 0; L < 2; L++) {
    vec2 q = L == 0 ? p * 1.5 : p * 2.6 + vec2(5.2, 1.3);
    vec2 i = floor(q), f = fract(q);
    float f1 = 8.0, f2 = 8.0;
    for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
      vec2 g = vec2(x, y), h = hash22(i + g);
      vec2 o = 0.5 + 0.40 * sin(t * (0.55 + 0.5 * h.yx) + 6.2831 * h);
      vec2 r = g + o - f;
      float d = dot(r, r);
      if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
    }
    float e = sqrt(f2) - sqrt(f1);
    c += exp(-e * (L == 0 ? 10.0 : 14.0)) * (L == 0 ? 0.70 : 0.45);
  }
  return c;
}
vec3 water(vec3 rd) {                       // in-scattered water colour along a view direction
  vec3 c = mix(uDeep, uUpC, smoothstep(-0.55, 0.85, rd.y));
  c += uUpC * pow(saturate(dot(rd, -uLd)), 5.0) * 0.9;
  return c * uBright;
}
vec3 fogW(vec3 col, float t, vec3 rd) { vec3 T = exp(-uSigma * t); return col * T + water(rd) * (1.0 - T); }
vec3 downwell(float y) { return uLsurf * exp(-uSigK * max(SURF - y, 0.0)) * uBright; }
vec3 rayDir(vec2 fc) {
  vec2 ndc = fc / uRes * 2.0 - 1.0;
  return normalize(uFwd + uRight * ndc.x * uTanHalf.x + uUp * ndc.y * uTanHalf.y);
}
vec4 proj(vec3 p) {
  vec3 r = p - uCamPos;
  float w = dot(r, uFwd);
  const float n = 0.05, f = 150.0;
  return vec4(dot(r, uRight) / uTanHalf.x, dot(r, uUp) / uTanHalf.y, (w * (f + n) - 2.0 * f * n) / (f - n), w);
}
`;

const VS_TRI = `#version 300 es
layout(location = 0) in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

/* ---------- background: water volume, the surface from below, the sea floor ---------- */
const FS_BG = COMMON + `
#ifdef BAKE
layout(location = 0) out vec4 oA;            // t, normal x, normal z, rock
layout(location = 1) out vec4 oB;            // albedo, ao
#else
out vec4 o;
uniform sampler2D uGA, uGB;
#endif
float marchFloor(vec3 ro, vec3 rd) {
  if (rd.y > 0.09) return -1.0;
  const float HMAX = 2.6;
  float t = rd.y < 0.0 ? max(0.0, (ro.y - HMAX) / -rd.y) : 0.0;
  float tmax = 70.0, lt = t, lh = 1.0;
  for (int i = 0; i < uSteps; i++) {
    vec3 p = ro + rd * t;
    float h = p.y - seabed(p.xz);
    if (h < 0.0) {                                          // bisect between the last two samples
      float a = lt, b = t;
      for (int k = 0; k < 5; k++) { float m = 0.5 * (a + b); vec3 q = ro + rd * m; if (q.y - seabed(q.xz) < 0.0) b = m; else a = m; }
      return 0.5 * (a + b);
    }
    lt = t; lh = h;
    t += max(0.02 + 0.004 * t, h * 0.7);
    if (t > tmax || p.y > HMAX + 0.5 && rd.y > 0.0) break;
  }
  return -1.0;
}
void main() {
  vec3 ro = uCamPos, rd = rayDir(gl_FragCoord.xy);
#ifdef BAKE
  float t = marchFloor(ro, rd);
  if (t <= 0.0) { oA = vec4(-1.0, 0.0, 0.0, 0.0); oB = vec4(0.0); return; }
  {
    vec3 p = ro + rd * t;
    float e = 0.015 + 0.002 * t;
    float hr = rocksH(p.xz), hd = dunes(p.xz);
    float h0 = seabed(p.xz) + ripples(p.xz);
    float hx = seabed(p.xz + vec2(e, 0)) + ripples(p.xz + vec2(e, 0));
    float hz = seabed(p.xz + vec2(0, e)) + ripples(p.xz + vec2(0, e));
    vec3 N = normalize(vec3(h0 - hx, e, h0 - hz));
    float rock = smoothstep(-0.02, 0.06, hr - hd);
    // sand: pale, speckled; rocks: dark, mottled with algae
    vec3 sand = vec3(0.62, 0.57, 0.47) * (0.82 + 0.30 * noise(p.xz * 6.0)) * (0.9 + 0.2 * noise(p.xz * 40.0));
    vec3 stone = mix(vec3(0.20, 0.21, 0.20), vec3(0.16, 0.22, 0.12), smoothstep(0.4, 0.8, noise(p.xz * 3.0 + 2.0)));
    stone *= 0.7 + 0.5 * noise(p.xz * 18.0);
    vec3 alb = mix(sand, stone, rock);
    float bed = 0.0;                                       // darker, detritus-covered sand under the beds
    for (int i = 0; i < ${CLUSTERS.length}; i++) { vec4 C = uClustersBG[i]; bed = max(bed, smoothstep(1.05, 0.55, length(p.xz - C.xy) / C.z)); }
    alb = mix(alb, vec3(0.16, 0.15, 0.09) * (0.7 + 0.6 * noise(p.xz * 9.0)), bed * 0.85 * (1.0 - rock));
    float ao = mix(1.0, 0.55 + 0.45 * smoothstep(-0.1, 0.25, hd - hr + 0.3), 1.0 - rock) * (0.75 + 0.25 * N.y);
    oA = vec4(t, N.x, N.z, rock); oB = vec4(alb, ao);
  }
#else
  vec3 col;
  ivec2 px = ivec2(gl_FragCoord.xy);
  vec4 A = texelFetch(uGA, px, 0);
  float t = A.x;
  if (t > 0.0) {
    vec4 B = texelFetch(uGB, px, 0);
    vec3 p = ro + rd * t;
    vec3 N = vec3(A.y, sqrt(max(0.0, 1.0 - A.y * A.y - A.z * A.z)), A.z);
    vec3 alb = B.rgb; float ao = B.a;
    vec3 down = downwell(p.y);
    float ndl = saturate(dot(N, -uLd));
    float ca = caustic(p.xz * 0.85 + uFlow * 0.05, uTime * (0.7 + 0.8 * uChop));
    vec3 direct = down * ndl * (0.22 + 1.5 * ca * uCaust);
    vec3 amb = (uUpC * 1.1 + uDeep * 0.3) * (0.45 + 0.55 * N.y) * uBright;
    col = alb * (direct + amb) * ao;
    col = fogW(col, t, rd);
  } else if (rd.y > 0.0) {
    float ts = (SURF - ro.y) / rd.y;
    vec2 q = ro.xz + rd.xz * ts;
    // rippled underside of the surface
    float k = 0.30 + 0.55 * uChop, sp = 0.25 + 0.5 * uChop;
    vec2 g = vec2(noise(q * 0.9 + vec2(uTime * sp, 0.0)) - noise(q * 0.9 + vec2(0.37, 0.0) + vec2(uTime * sp, 0.0)),
                  noise(q * 0.9 + vec2(0.0, uTime * sp * 0.7)) - noise(q * 0.9 + vec2(0.0, 0.37) + vec2(0.0, uTime * sp * 0.7)));
    g += 0.5 * vec2(noise(q * 2.3 - uTime * sp * 1.3) - noise(q * 2.3 + vec2(0.2, 0) - uTime * sp * 1.3),
                    noise(q * 2.3 + 4.0 + uTime * sp) - noise(q * 2.3 + vec2(4.0, 4.2) + uTime * sp));
    vec3 n = normalize(vec3(g.x * 3.0 * k, -1.0, g.y * 3.0 * k));       // pointing down into the water
    float cosI = saturate(dot(rd, -n)), sinI = sqrt(1.0 - cosI * cosI);

  const I = Math.max(0.02, (Lsurf[0] + Lsurf[1] + Lsurf[2]) / 9.6);
  const deep = scale3([0.0010, 0.008, 0.026], I);
  const upC = scale3(mix3([0.008, 0.062, 0.14], [0.005, 0.040, 0.12], sk.night), I);
  const t = current.turbidity;
  const sigma = scale3([0.40, 0.105, 0.080], 1 + 1.4 * t);
  const sigK = [0.26, 0.045, 0.030];
  const exposure = lerp(0.95, 8.5, smooth(Math.min(1, sk.night)));
  return { Ld, Lsurf, deep, upC, sigma, sigK, exposure };
}

/* ------------------------------ frame ------------------------------ */
let raf = 0, lastT = now(), sceneTime = 0, nextFrame = 0, fps = 0, fpsCount = 0, fpsT = now();
const FRAME_MS = 1000 / FPS;
let flowOff = [0, 0], snowOff = [0, 0, 0];
const rocksU = new Float32Array(ROCKS.flat()), clustersU = new Float32Array(CLUSTERS.flat()), ventsU = new Float32Array(VENTS.flat());
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const pw = Math.round(innerWidth * dpr), ph = Math.round(innerHeight * dpr);
  const s = resScale(pw, ph);
  const w = Math.max(2, Math.round(pw * s)), h = Math.max(2, Math.round(ph * s));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  tanHalf = [Math.tan(CAM.vfov / 2) * w / h, Math.tan(CAM.vfov / 2)];
  if (gl && (rt.w !== w || rt.h !== h)) allocRT(w, h);
}
addEventListener('resize', resize);
let lastSky = null;
function advance(t, dt) {
  step(t);
  if (override) Object.assign(current, override);
  sceneTime += dt;
  const still = 1 - 0.9 * current.beacon;
  const cv = 0.03 + 0.14 * current.current;              // current speed, m/s, toward +x
  const flowV = [cv * still, 0, 0.01 * still];
  for (let i = 0; i < 3; i++) flowDisp[i] += flowV[i] * 0.7 * dt;
  flowOff[0] += flowV[0] * dt; flowOff[1] += flowV[2] * dt;
  snowOff[0] += flowV[0] * dt; snowOff[1] += 0.012 * dt; snowOff[2] += flowV[2] * dt;
  updateJellies(dt, t, flowV);
  lastSky = sky();
  return lastSky;
}
function setCommon(u, L, sk) {
  gl.uniform2f(u.uRes, canvas.width, canvas.height);
  gl.uniform3fv(u.uCamPos, CAM.pos); gl.uniform3fv(u.uFwd, cam.fwd); gl.uniform3fv(u.uRight, cam.right); gl.uniform3fv(u.uUp, cam.up);
  gl.uniform2fv(u.uTanHalf, tanHalf);
  gl.uniform1f(u.uTime, sceneTime);
  gl.uniform3fv(u.uLd, L.Ld); gl.uniform3fv(u.uLsurf, L.Lsurf); gl.uniform3fv(u.uDeep, L.deep); gl.uniform3fv(u.uUpC, L.upC);
  gl.uniform3fv(u.uSigma, L.sigma); gl.uniform3fv(u.uSigK, L.sigK);
  gl.uniform1f(u.uCaust, current.caustics); gl.uniform1f(u.uShafts, current.shafts); gl.uniform1f(u.uTurb, current.turbidity);
  gl.uniform1f(u.uChop, current.chop); gl.uniform1f(u.uNight, sk.night); gl.uniform1f(u.uBright, current.brightness);
  gl.uniform1f(u.uCurrent, current.current * (1 - 0.9 * current.beacon));
  gl.uniform2fv(u.uFlow, flowOff);
  if (u.uRocks) gl.uniform4fv(u.uRocks, rocksU);
  if (u.uClustersBG) gl.uniform4fv(u.uClustersBG, clustersU);
  if (u.uNRocks) gl.uniform1i(u.uNRocks, ROCKS.length);
  if (u.uSteps) gl.uniform1i(u.uSteps, 90);
}
function setJelly(u, m) {
  gl.uniform3fv(u.uJPos, m.pos);
  const Y = m.axis, X = norm3(cross3(Y, Math.abs(Y[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0])), Z = cross3(X, Y);
  gl.uniform3fv(u.uJX, X); gl.uniform3fv(u.uJY, Y); gl.uniform3fv(u.uJZ, Z);
  gl.uniform1f(u.uJR, m.R); gl.uniform1f(u.uJPhase, m.phase); gl.uniform1f(u.uJYaw, m.yaw);
  gl.uniform1f(u.uJAlpha, smooth(m.alpha)); gl.uniform1f(u.uJGlow, m.cur.glow);
  gl.uniform3fv(u.uJTint, m.tint);
  gl.uniform3fv(u.uHist, m.histOut);
}
const skip = k => CONFIG.skip.includes(k);
function render(sk) {
  if (!rt.baked) bakeStatic();
  const L = lighting(sk);
  gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fbMS);
  gl.viewport(0, 0, rt.w, rt.h);
  gl.clearColor(0, 0, 0, 1); gl.clearDepth(1);
  gl.depthMask(true);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.bindVertexArray(vao);
  // 1. water, surface, sea floor
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
  if (!skip('bg')) {
    gl.useProgram(P_BG.p); setCommon(P_BG.u, L, sk);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rt.gA); gl.uniform1i(P_BG.u.uGA, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, rt.gB); gl.uniform1i(P_BG.u.uGB, 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  // 2. eelgrass (opaque, depth-tested)
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
  if (!skip('grass')) {
    gl.useProgram(P_GRASS.p); setCommon(P_GRASS.u, L, sk);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, hmap.tex); gl.uniform1i(P_GRASS.u.uHmap, 0);
    gl.uniform4fv(P_GRASS.u.uClusters, clustersU); gl.uniform1fv(P_GRASS.u.uClusterStart, clusterStart);
    gl.drawArrays(gl.TRIANGLES, 0, BLADES * GRASS_SEG * 6);
  }
  // 3. jellies, far → near, premultiplied alpha, no depth writes
  gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  if (!skip('jelly')) {
    const order = jellies.filter(m => m.alpha > 0).sort((a, b) => Math.hypot(b.pos[0], b.pos[1] - CAM.pos[1], b.pos[2]) - Math.hypot(a.pos[0], a.pos[1] - CAM.pos[1], a.pos[2]));
    for (const m of order) {
      // inner side of the bell, the strands, then the outer side
      gl.enable(gl.CULL_FACE);
      gl.useProgram(P_BELL.p); setCommon(P_BELL.u, L, sk); setJelly(P_BELL.u, m);
      gl.cullFace(gl.FRONT); gl.drawArrays(gl.TRIANGLES, 0, 56 * 18 * 6);
      gl.disable(gl.CULL_FACE);
      gl.useProgram(P_TENT.p); setCommon(P_TENT.u, L, sk); setJelly(P_TENT.u, m);
      gl.drawArrays(gl.LINES, 0, TENT_N * TENT_SEG * 2);
      gl.useProgram(P_ARM.p); setCommon(P_ARM.u, L, sk); setJelly(P_ARM.u, m);
      gl.drawArrays(gl.TRIANGLES, 0, 4 * ARM_SEG * 6);
      gl.enable(gl.CULL_FACE);
      gl.useProgram(P_BELL.p);
      gl.cullFace(gl.BACK); gl.drawArrays(gl.TRIANGLES, 0, 56 * 18 * 6);
      gl.disable(gl.CULL_FACE);
    }
  }
  // 4. marine snow, bubbles, specks
  if (!skip('part')) {
    gl.useProgram(P_PART.p); setCommon(P_PART.u, L, sk);
    gl.uniform3fv(P_PART.u.uSnowOff, snowOff); gl.uniform3fv(P_PART.u.uVents, ventsU);
    gl.uniform1f(P_PART.u.uBubbles, current.bubbles); gl.uniform1f(P_PART.u.uBio, 0.15 + 0.85 * sk.night);
    gl.drawArrays(gl.POINTS, 0, N_SNOW + N_BUB + N_BIO);
  }
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.depthMask(true);
  // 5. god rays at half resolution (added in the final pass)
  gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fbRays);
  gl.viewport(0, 0, rt.rw, rt.rh);
  if (!skip('rays')) { gl.useProgram(P_RAYS.p); setCommon(P_RAYS.u, L, sk); gl.drawArrays(gl.TRIANGLES, 0, 3); }
  else { gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }
  // resolve the MSAA target, tone-map to the screen
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, rt.fbMS); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, rt.fbR);
  gl.blitFramebuffer(0, 0, rt.w, rt.h, 0, 0, rt.w, rt.h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(P_FINAL.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rt.tex);
  gl.uniform1i(P_FINAL.u.uTex, 0); gl.uniform2f(P_FINAL.u.uRes, canvas.width, canvas.height);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, rt.rays); gl.uniform1i(P_FINAL.u.uRays, 1);
  gl.uniform1f(P_FINAL.u.uExposure, L.exposure); gl.uniform1f(P_FINAL.u.uEnc, rt.enc);
  gl.uniform1f(P_FINAL.u.uBeacon, current.beacon); gl.uniform1f(P_FINAL.u.uTime, sceneTime);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function frame(ms) {
  raf = requestAnimationFrame(frame);
  if (ms < nextFrame) return;
  nextFrame += FRAME_MS;
  if (nextFrame < ms) nextFrame = ms + FRAME_MS;
  const t = now(), dt = Math.min(0.1, t - lastT);
  lastT = t;
  const sk = advance(t, dt);
  render(sk);
  fpsCount++;
  if (t - fpsT >= 1) { fps = fpsCount / (t - fpsT); fpsCount = 0; fpsT = t; }
  if (document.body.classList.contains('debug')) {
    document.getElementById('hud').textContent =
      `state ${stateName}${pending ? ' (→' + pending + ')' : ''}\n` +
      Object.keys(PARAMS).map(p => `${p.padEnd(11)} ${current[p].toFixed(2)}`).join('\n') +
      `\nfps ${fps.toFixed(1)}  res ${canvas.width}×${canvas.height} msaa ${rt.samples}  sun ${sk.alt.toFixed(1)}°  night ${sk.night.toFixed(2)}` +
      `\njellies ${effectiveSlots().map(s => s || '-').join(' ')}${sessionsOverride ? ' (override)' : sessionsFile ? '' : ' (ambient)'}  ` +
      jellies.filter(m => m.slot >= 0 && m.alpha > 0).map(m => `#${m.slot} ${m.state} ${(m.alpha * 100) | 0}%`).join(' ');
  }
}
function start() { if (gl && !raf) { lastT = now(); raf = requestAnimationFrame(frame); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }
let hostPaused = false;
document.addEventListener('visibilitychange', () => (document.hidden || hostPaused ? stop() : start()));
// the host (tools/wallpaper.js) pauses us while a window covers the whole desktop
window.wpPause = on => { hostPaused = !!on; if (hostPaused) stop(); else if (!document.hidden) start(); };
if (gl) { resize(); if (!document.hidden) start(); }

// cost measurement: median / p90 GPU time of one frame's draws (readPixels sync before and after)
function bench(frames = 60) {
  const px = new Uint8Array(4), gpu = [];
  const sync = () => { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); };
  for (let i = 0; i < frames; i++) {
    const sk = advance(now(), 1 / FPS);
    sync(); const t0 = performance.now(); render(sk); sync(); gpu.push(performance.now() - t0);
  }
  gpu.sort((a, b) => a - b);
  return { median: +gpu[frames >> 1].toFixed(2), p90: +gpu[Math.floor(frames * 0.9)].toFixed(2), res: canvas.width + 'x' + canvas.height };
}

// testing hooks (themes/demo.html looks for window.theme)
window.theme = window.jellyfish = {
  requestState, applyState, STATES, PARAMS, CONFIG, sky, bench, lighting, ROCKS, CLUSTERS,
  setOverride(o) { override = o; },
  frame(dt = 1 / FPS) { const t = now(); lastT = t; render(advance(t, dt)); },
  simulate(sec, dt = 1 / FPS) { let t = now(); for (let k = 0; k < sec / dt; k++) advance(t += dt, dt); },   // run the scene forward without drawing
  setSessions(a) { sessionsOverride = a ? Array.from({ length: 5 }, (_, i) => a[i] || null) : null; },
  get sessions() { return effectiveSlots(); }, jellies, JELLY_SPOTS, JELLY_STATES,
  get current() { return { ...current }; }, get state() { return stateName; },
  get sceneTime() { return sceneTime; }, compileMs,
};
