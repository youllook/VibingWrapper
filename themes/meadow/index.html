<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>草原桌布</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* wallpaper: always the bottom layer, nothing selectable / draggable / clickable (same as the other themes) */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #5c7a3a;
               user-select: none; -webkit-user-select: none; -webkit-user-drag: none; cursor: default; }
  /* rendered at RES_SCALE of the window, stretched back up by CSS */
  canvas { display: block; width: 100vw; height: 100vh; pointer-events: none; }
  #hud { position: fixed; left: 10px; bottom: 8px; font: 12px/1.5 Consolas, monospace; color: rgba(255,255,255,.8);
         background: rgba(0,0,0,.35); padding: 4px 8px; border-radius: 4px; white-space: pre; display: none; }
  body.debug #hud { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
/* =====================================================================================
 * 草原＋蒲公英 v2 (meadow theme, painted look) — 2026-10-01 — sibling of themes/ocean
 *
 * Art direction: an original background in the spirit of a 1990s Japanese animated film — depth
 * layers (painted sky with big cumulus → hazy far mountains → mid mountains → near green hills
 * with a ridge → the meadow slope → soft foreground blades), a lone broad tree as the focal point,
 * low sun from the upper right (backlit grass: warm translucent tips, cool undersides, rim light),
 * cloud shadows drifting across the field with the wind, aerial perspective, warm highlights /
 * blue-violet shadows. In a storm a gust front sweeps the field as a wave of light and shadow.
 *
 * Tech (WebGL1, four draw calls): full-screen pass (sky, mountains, hills, far meadow, tree,
 * windmills, 等你 star) · ~9 000 clumped grass blades + dandelion stems in one triangle strip bent by
 * a shared wind field (gusts = travelling fronts) · dandelion heads (point sprites) · particles
 * (seeds with parachutes, tumbling leaves, fireflies). State machine, polling, keys, HUD, wpPause,
 * day / night clock and the window.theme API are the same as the other themes.
 * Mountain layers: procedural by default; painted PNG layers in assets/ are used when present.
 * ===================================================================================== */

/* ------------------------------ config ------------------------------ */
const FPS = 30;
const RES_SCALE = 0.5;
const CONFIG = { fullTransition: 4.0, polling: true, clockHours: /[?&]day=1/.test(location.search) ? 10.5 : null, paintedLayers: true, skip: '' };   // skip: debug, e.g. 'cards,blades' leaves passes out   // clockHours: test override (0–24), null = real time
const DEBOUNCE_MS = 300;
const POLL_MS = 1000;
const HORIZON = 0.45;                        // where the flat meadow meets the near hills (screen fraction from the bottom)
const CAM_H = 1.25;                          // eye height above the ground (m): low, in the grass
const FOV = 1.0;
const ZFAR = 60.0;
const N_BLADES = 0, Z_NEAR = 2.2, Z_FAR_BLADES = 19.0;   // v5: the ribbon blades are gone (painted strips + tufts instead)
const TREE = { x: 0.70, z: 21.0 };           // the lone tree: screen x (fraction) at that distance — right third, off the star column

// parameter ranges (used to normalise distances)
const PARAMS = {
  sway:          [0, 1],                     // base breeze
  gustRate:      [0, 0.5],                   // gusts per second (random within a rhythm)
  gustStrength:  [0, 1],                     // bending at a gust front
  seedRate:      [0, 1],                     // single seeds drifting by, per second
  burstChance:   [0, 1],                     // chance a gust releases a big burst of seeds
  leafRate:      [0, 1],                     // leaves falling from the tree, per second (working)
  skyBrightness: [0, 1],                     // 1 blue sky … 0 dark grey
  cloudCover:    [0, 1],
  warmth:        [0, 1],                     // golden light (clearing)
  beacon:        [0, 1],                     // 等你 star
};
const STATES = {
  clear:    { sway: 0.25, gustRate: 0.05, gustStrength: 0.25, seedRate: 0.08, burstChance: 0.00, leafRate: 0.0, skyBrightness: 1.00, cloudCover: 0.42, warmth: 0.20, beacon: 0 },
  overcast: { sway: 0.45, gustRate: 0.12, gustStrength: 0.45, seedRate: 0.20, burstChance: 0.00, leafRate: 0.0, skyBrightness: 0.66, cloudCover: 0.78, warmth: 0.00, beacon: 0 },
  storm:    { sway: 0.26, gustRate: 0.24, gustStrength: 1.00, seedRate: 0.30, burstChance: 0.55, leafRate: 1.0, skyBrightness: 0.55, cloudCover: 0.88, warmth: 0.00, beacon: 0 },
  clearing: { sway: 0.30, gustRate: 0.06, gustStrength: 0.30, seedRate: 0.45, burstChance: 0.00, leafRate: 0.1, skyBrightness: 0.92, cloudCover: 0.50, warmth: 1.00, beacon: 0 },
  // 等你: almost still, the sky dims, one star pulses slowly
  waiting:  { sway: 0.08, gustRate: 0.00, gustStrength: 0.00, seedRate: 0.03, burstChance: 0.00, leafRate: 0.0, skyBrightness: 0.52, cloudCover: 0.55, warmth: 0.10, beacon: 1 },
};
const KEYS = { '1': 'clear', '2': 'overcast', '3': 'storm', '4': 'clearing', '5': 'waiting' };

/* ------------------------------ state machine (as the other themes) ------------------------------ */
const smooth = t => t * t * (3 - 2 * t);
let current = { ...STATES.clear };
let from = { ...current }, to = { ...current };
let tStart = 0, tDur = 0;
let stateName = 'clear', pending = null, debounceT = 0;
let override = null;
function now() { return performance.now() / 1000; }
function step(t) {
  const k = tDur > 0 ? Math.min(1, (t - tStart) / tDur) : 1;
  const e = smooth(k);
  for (const p in PARAMS) current[p] = from[p] + (to[p] - from[p]) * e;
}
function applyState(name) {
  if (!STATES[name]) return;
  const t = now();
  step(t);
  from = { ...current };
  to = { ...STATES[name] };
  let dist = 0;
  for (const p in PARAMS) { const [lo, hi] = PARAMS[p]; dist = Math.max(dist, Math.abs(to[p] - from[p]) / (hi - lo)); }
  tStart = t; tDur = CONFIG.fullTransition * dist; stateName = name;
}
function requestState(name) {
  if (!STATES[name]) return;
  pending = name;
  clearTimeout(debounceT);
  debounceT = setTimeout(() => { if (pending !== stateName) applyState(pending); pending = null; }, DEBOUNCE_MS);
}

/* ------------------------------ inputs ------------------------------ */
for (const ev of ['contextmenu', 'selectstart', 'dragstart', 'mousedown']) addEventListener(ev, e => e.preventDefault());
addEventListener('keydown', e => {
  if (KEYS[e.key]) requestState(KEYS[e.key]);
  if (e.key === 'd') document.body.classList.toggle('debug');
});
let lastPolled = null, sessionsFile = null, sessionsOverride = null;
async function poll() {
  if (!CONFIG.polling) return;
  try {
    const r = await fetch('state.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json(), s = j.state;
      if (STATES[s] && s !== lastPolled) { lastPolled = s; requestState(s); }
      sessionsFile = Array.isArray(j.sessions) ? Array.from({ length: 5 }, (_, i) => STATES[j.sessions[i]] ? j.sessions[i] : null) : null;
    }
  } catch { /* unreadable → keep the current state */ }
}
setInterval(poll, POLL_MS);
poll();

/* ------------------------------ day / night (same model as the other themes) ------------------------------ */
function sunAltitude(date, lat = 25.04, lon = 121.56) {
  const rad = Math.PI / 180;
  const n = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
  const L = (280.46 + 0.9856474 * n) % 360;
  const g = ((357.528 + 0.9856003 * n) % 360) * rad;
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
  const eps = (23.439 - 0.0000004 * n) * rad;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda));
  const dec = Math.asin(Math.sin(eps) * Math.sin(lambda));
  const gmst = (280.46061837 + 360.98564736629 * n) % 360;
  const ha = (gmst + lon) * rad - ra;
  return Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
}
function sky() {
  let d = new Date();
  if (CONFIG.clockHours != null) { d = new Date(d); d.setHours(0, 0, 0, 0); d = new Date(d.getTime() + CONFIG.clockHours * 3600000); }
  const alt = sunAltitude(d);
  const night = 1 - smooth(Math.min(1, Math.max(0, (alt + 9) / 13)));
  const twilight = Math.exp(-Math.pow((alt + 1.5) / 5, 2));
  const hours = d.getHours() + d.getMinutes() / 60;
  const frac = Math.min(1, Math.max(0, (hours - 5.5) / 13));
  // the light always comes from the upper right (the painting's key light); it only drifts a little with the hour
  const sunX = 0.66 + 0.18 * frac;
  const sunY = HORIZON + 0.14 + 0.26 * Math.min(1, Math.max(0, alt / 60));
  const sunUp = smooth(Math.min(1, Math.max(0, (alt + 2) / 6)));
  return { alt, night, twilight, sunX, sunY, sunUp };
}

/* ------------------------------ WebGL ------------------------------ */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: true, preserveDrawingBuffer: false, powerPreference: 'low-power' });

// shared GLSL: hash noise, the wind field, the cloud-shadow / gust-light field (JS mirrors windAt())
const COMMON = `
precision highp float;
uniform float uTime, uSway, uShadowDrift, uCloudShadow, uLightFloor;
uniform vec3  uLightDir;    // key light (sun by day, moon by night): from the upper right, in front of the viewer

uniform vec4  uGust[4];     // front position (m, along x + z·slant), width (m), strength, slant
uniform vec4  uShadow[4];   // big cloud shadows: centre x, centre z, radius x (m), strength (radius z = 0.55 × radius x)
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  vec2 a = mod(i, 289.0), b = mod(i + 1.0, 289.0);
  return mix(mix(hash(a), hash(vec2(b.x, a.y)), u.x), mix(hash(vec2(a.x, b.y)), hash(b), u.x), u.y);
}
float fbm2(vec2 p) { return noise(p) * 0.6 + noise(p * 2.1 + 5.3) * 0.4; }
float fbm3(vec2 p) { return noise(p) * 0.5 + noise(p * 2.1 + 5.3) * 0.3 + noise(p * 4.3 + 11.1) * 0.2; }
// large-scale field colour map: patches of yellow-green / green / blue-green / olive over metres (not per blade)
vec2 fieldMap(float x, float z) { return vec2(fbm2(vec2(x, z * 1.3) * 0.075 + 3.0), noise(vec2(x, z * 1.3) * 0.13 + 9.0)); }
// bending at ground point (x, z): + = blown toward +x
float windAt(float x, float z, float t) {
  float w = uSway * (sin(t * 0.9 + x * 0.35 + z * 0.2) * 0.6 + sin(t * 1.7 + x * 0.9 - z * 0.4) * 0.3 + sin(t * 2.9 + x * 2.1) * 0.15);
  for (int i = 0; i < 4; i++) {
    vec4 g = uGust[i];
    float d = (x + z * g.w - g.x) / max(g.y, 0.1);
    w += g.z * exp(-d * d) * (1.0 + 0.35 * sin(t * 7.0 + x * 3.0 + z * 1.3));
  }
  return w;
}
// the gust wave alone (−1 trough … +1 crest): drives the "wave of light" sheen on tufts, strips and the slope
float gustAt(float x, float z) {
  float g = 0.0;
  for (int i = 0; i < 4; i++) {
    vec4 G = uGust[i];
    float d = (x + z * G.w - G.x) / max(G.y, 0.1);
    g += G.z * (exp(-d * d * 0.5) - 0.9 * exp(-(d - 1.8) * (d - 1.8) * 0.6));
  }
  return clamp(g, -1.0, 1.0);
}
// sheen: crest = warmer yellow-green and +12 % value, trough = cooler blue-green
vec3 sheen(vec3 c, float g) { return g > 0.0 ? mix(c, c * vec3(1.16, 1.12, 0.84), g) : mix(c, c * vec3(0.88, 0.96, 1.08), -g); }
// sunlight reaching ground point (x, z): 1 full sun … ~0.45 under a cloud shadow. Cloud shadows drift with
// the wind; a gust front carries a band of sunlight with a darker rim ahead of it (light + shadow wave)
float lightAt(float x, float z) {
  float s = fbm2(vec2(x - uShadowDrift, z * 1.6 - uShadowDrift * 0.3) * 0.035);
  float l = 1.0 - smoothstep(0.42, 0.68, s) * 0.30 * uCloudShadow;                // fine broken shade
  for (int i = 0; i < 4; i++) {                                                   // the deliberate big ones: soft but defined edge
    vec4 S = uShadow[i];
    if (S.w < 0.01) continue;
    float e = length(vec2((x - S.x) / S.z, (z - S.y) / (S.z * 0.55)));
    l -= S.w * 0.62 * (1.0 - smoothstep(0.75, 1.05, e));
  }
  for (int i = 0; i < 4; i++) {
    vec4 g = uGust[i];
    float d = (x + z * g.w - g.x) / max(g.y, 0.1);
    l += g.z * (0.45 * exp(-d * d * 0.5) - 0.40 * exp(-(d - 1.8) * (d - 1.8) * 0.6));
  }
  return clamp(l, uLightFloor, 1.35);
}`;

// ---------- pass 1: the painting behind the grass ----------
const VS_SKY = `attribute vec2 p; void main() { gl_Position = vec4(p, 0.9999, 1.0); }`;   // at the far plane: drawn after the grass, depth-tested
const FS_SKY = COMMON + `
uniform vec2  uRes;
uniform float uBright, uCloud, uNight, uTwilight, uSunUp, uWarm, uBeacon, uTreeSway, uLayers;
uniform vec2  uSun, uDrift;
uniform vec3  uZenith, uHorizonC, uCloudLit, uCloudShade, uSunCol, uGroundLight, uShadowTint;
uniform vec3  uMtnFar, uMtnMid, uHill, uMeadowA, uMeadowB, uTreeLit, uTreeShade, uFieldA, uFieldB, uFieldC, uFieldD;
uniform vec4  uMill[5];     // windmill: screen x, base y, scale (uv per unit height), alpha
uniform vec4  uMillB[5];    // sail angle, lamp 0..1
uniform sampler2D uTexFar, uTexMid, uTexNear;   // painted mountain layers (optional)
uniform sampler2D uAtlasCloud;
uniform float uCloudOn, uSheet;                 // 1 = sprites; grey sheet behind them (overcast)
uniform vec4  uCloudSpr[10];                    // sprite: centre uv.x, centre uv.y, width (uv), cell
uniform vec4  uCloudSprB[10];                   // alpha, lit (0..1 how much of it is lit), unused, unused
uniform vec4  uCloudCells[8];                   // atlas cell rects u, v (from top), w, h
uniform vec4  uLayerBox;    // x: uv.y of the canvas bottom, y: canvas height in uv, z: far layer used, w: mid layer used
uniform float uLayerNearOn;
uniform vec3  uTintFar, uTintMid, uTintNear;   // per-layer light (neutral daylight paintings → time of day / state)
const float HORIZON = ${HORIZON.toFixed(3)};
const float CAM_H = ${CAM_H.toFixed(2)};
const float FOV = ${FOV.toFixed(2)};
vec4 layer(sampler2D tex, vec2 uv) {
  vec2 tuv = vec2(uv.x, 1.0 - (uv.y - uLayerBox.x) / uLayerBox.y);
  if (tuv.y < 0.0 || tuv.y > 1.0) return vec4(0.0);
  return texture2D(tex, tuv);
}
float fbm4(vec2 p) { return noise(p) * 0.45 + noise(p * 2.1 + 5.3) * 0.27 + noise(p * 4.3 + 11.1) * 0.17 + noise(p * 8.7 + 23.7) * 0.11; }
float box(vec2 q, vec2 lo, vec2 hi) { return min(min(q.x - lo.x, hi.x - q.x), min(q.y - lo.y, hi.y - q.y)); }
mat2 rot2(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
// painted ridgelines (screen x in aspect units → ridge height in uv). The near hill rises to the left.
float ridgeFar(float x)  { return HORIZON + 0.145 + 0.075 * fbm3(vec2(x * 0.9 + 3.0, 1.0)) + 0.03 * noise(vec2(x * 3.5, 7.0)); }
float ridgeMid(float x)  { return HORIZON + 0.075 + 0.055 * fbm3(vec2(x * 1.4 + 9.0, 2.0)) + 0.025 * noise(vec2(x * 5.0, 3.0)); }
float ridgeNear(float x, float aspect) { float k = clamp(1.0 - x / aspect, 0.0, 1.0); return HORIZON + 0.012 + 0.07 * k * k + 0.025 * fbm2(vec2(x * 1.1 + 2.0, 5.0)); }
// one windmill in local units (base (0,0), tower top y = 1): returns (lit side 0..1, coverage, window)
vec4 windmill(vec2 q, float ang, float px) {
  float tower = min(min(q.x + 0.17 - q.y * 0.05, 0.17 - q.y * 0.05 - q.x), min(q.y, 1.0 - q.y));
  float tA = smoothstep(-px, px, tower);
  float roof = smoothstep(px, -px, length((q - vec2(0.0, 1.0)) * vec2(1.0, 1.5)) - 0.19);
  float lit = tA * smoothstep(-0.08, 0.10, q.x);
  float cov = max(tA, roof), sails = 0.0;
  vec2 hub = vec2(0.0, 1.02);
  for (int i = 0; i < 4; i++) {
    vec2 r = rot2(ang + float(i) * 1.5708) * (q - hub);
    float arm = smoothstep(px, -px, abs(r.x) - 0.014) * step(0.0, r.y) * step(r.y, 0.66);
    float lat = box(r, vec2(-0.13, 0.16), vec2(0.0, 0.64));
    float latA = smoothstep(-px, px, lat) * (0.5 + 0.5 * smoothstep(0.03, 0.0, abs(fract(r.y * 9.0) - 0.5) - 0.28));
    float frame = smoothstep(px, -px, min(abs(r.x + 0.13), abs(r.y - 0.64)) - 0.013) * smoothstep(-px, px, lat + 0.03);
    sails = max(sails, max(arm, max(latA * 0.9, frame)));
  }
  sails = max(sails, smoothstep(px, -px, length(q - hub) - 0.045));
  float win = smoothstep(-px, px, box(q, vec2(-0.05, 0.42), vec2(0.05, 0.56)));
  return vec4(lit, cov, sails, win);
}
// the lone tree: a few overlapping painted lobes with a noisy edge, lit from the upper right
float treeSDF(vec2 d) {
  float c = length((d - vec2(0.0, 0.66)) * vec2(1.0, 1.25)) - 0.46;
  for (int i = 0; i < 10; i++) {
    float a = float(i) * 0.628 + 0.3;
    vec2 cc = vec2(0.0, 0.66) + vec2(cos(a) * 0.40, sin(a) * 0.30);
    c = min(c, length((d - cc) * vec2(1.0, 1.2)) - (0.17 + 0.05 * sin(float(i) * 2.3)));
  }
  float e = noise(d * 11.0 + 3.0) * 0.07 + noise(d * 27.0) * 0.025;
  return c + e - 0.03;
}
float seg(vec2 p, vec2 a, vec2 b) { vec2 ab = b - a; float h = clamp(dot(p - a, ab) / dot(ab, ab), 0.0, 1.0); return length(p - a - ab * h); }
// trunk and main limbs (canopy unit = 5.2 m): tapered, flared at the root, a slight natural curve, limbs
// forking into the canopy; bark painted as value bands — warm on the sun side, cool dark on the shadow side
vec3 tree(vec2 d, float px, float sway, out float a) {
  d.x -= sway * d.y;
  float cx = 0.035 * sin(d.y * 3.2 + 0.4) - 0.02;                                 // natural curve
  float r = 0.072 - 0.034 * d.y + 0.11 * exp(-max(d.y, 0.0) * 9.0);                // taper + root flare
  float trunk = smoothstep(px, -px, abs(d.x - cx) - r) * step(-0.04, d.y) * step(d.y, 0.70);
  vec2 fork = vec2(cx, 0.62);
  float br = smoothstep(px, -px, seg(d, fork, vec2(-0.36, 1.02)) - (0.034 - 0.02 * (d.y - 0.6)))
           + smoothstep(px, -px, seg(d, vec2(cx, 0.68), vec2(0.36, 1.00)) - (0.032 - 0.02 * (d.y - 0.6)))
           + smoothstep(px, -px, seg(d, vec2(cx, 0.70), vec2(0.06, 1.18)) - (0.028 - 0.016 * (d.y - 0.7)))
           + smoothstep(px, -px, seg(d, vec2(-0.20, 0.84), vec2(-0.50, 1.00)) - 0.016);
  a = clamp(trunk + br, 0.0, 1.0);
  float side = (d.x - cx) / max(r, 0.02);                                         // −1 shadow side … +1 sun side
  float lit = smoothstep(-0.5, 0.9, side);
  float bands = 0.85 + 0.3 * step(0.5, fract(noise(vec2(d.x * 38.0, d.y * 7.0)) * 2.0 + d.y * 3.0));   // vertical bark strokes
  vec3 shadowC = vec3(0.16, 0.11, 0.09), litC = vec3(0.46, 0.34, 0.22);
  vec3 col = mix(shadowC, litC, lit) * bands;
  col = mix(col, col * vec3(0.9, 0.95, 1.1), (1.0 - lit) * 0.5);                    // cool shadow side
  return col;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float aspect = uRes.x / uRes.y;
  vec2 p = vec2(uv.x * aspect, uv.y);
  float t = uTime;
  vec3 col;
  // ---- sky ----
  float up = clamp((uv.y - HORIZON) / (1.0 - HORIZON), 0.0, 1.0);
  col = mix(uHorizonC, uZenith, pow(up, 0.6));
  vec2 sd = (uv - uSun) * vec2(aspect, 1.0);
  float sr = length(sd);
  col += uSunCol * vec3(1.0, 0.9, 0.7) * (exp(-sr * 2.5) * 0.14 + exp(-sr * 12.0) * 0.18) * uSunUp;
  // stars (night)
  if (uNight > 0.01) {
    vec2 sp2 = p * 90.0;
    vec2 cell = floor(sp2), f = fract(sp2);
    float h = hash(cell + 3.7);
    if (h > 0.91) {
      vec2 pos = vec2(hash(cell + 11.1), hash(cell + 27.3)) * 0.7 + 0.15;
      float b = pow(hash(cell + 41.9), 3.0);
      float tw = 0.75 + 0.25 * sin(t * (1.5 + 3.0 * h) + h * 60.0);
      col += vec3(0.9, 0.93, 1.0) * smoothstep(0.16, 0.0, length(f - pos)) * (0.3 + 0.7 * b) * tw * uNight * smoothstep(0.0, 0.15, uv.y - HORIZON);
    }
  }
  // moon
  col += vec3(0.85, 0.90, 1.0) * (smoothstep(0.017, 0.010, length((uv - vec2(0.82, 0.86)) * vec2(aspect, 1.0))) * 1.6 + exp(-length((uv - vec2(0.82, 0.86)) * vec2(aspect, 1.0)) * 10.0) * 0.25) * uNight;
  // ---- cumulus: gouache blobs with crisp edges, lit from the sun side, flattened toward the horizon ----
  if (uCloudOn > 0.5 && uv.y > HORIZON - 0.02) {
    float hz = max(uv.y - HORIZON, 0.0);
    // soft grey sheet behind the sprites when the cover closes in
    col = mix(col, mix(uCloudShade, uCloudLit, 0.5), uSheet * smoothstep(0.0, 0.12, hz) * (0.55 + 0.45 * smoothstep(0.0, 0.5, hz)));
    for (int i = 0; i < 10; i++) {
      vec4 S = uCloudSpr[i];
      if (S.z < 0.001) continue;
      float h = S.z * aspect * 0.666;                                                // every cell is 1024×682

attribute vec4 aP;          // x, z, height (m), width (m)

vec3 bendPoint(vec4 b, float t, float flex, float wind) {

/* ------------------------------ particles: seeds, leaves, fireflies (JS) ------------------------------ */
const parts = [];
let puff = 1;
const seedHeads = plants.filter(q => q.type === 0);
const treeWorld = () => { const aspect = canvas.width / canvas.height; return { x: (TREE.x - 0.5) * aspect * FOV * TREE.z, z: TREE.z }; };
function spawnSeed(q, burst) {
  if (parts.length >= MAX_PART) return;

  parts.push({ x: q.x + (Math.random() - 0.5) * 0.05, y: q.h * 0.9 + Math.random() * 0.1, z: q.z + (Math.random() - 0.5) * 0.1,
    vx: (0.3 + Math.random() * 0.6) * (burst ? 2.5 : 1) + wind * 1.5, vy: 0.15 + Math.random() * (burst ? 0.8 : 0.3), vz: (Math.random() - 0.5) * 0.3,
    ang: (Math.random() - 0.5) * 0.6, spin: (Math.random() - 0.5) * 1.2, size: 0.038 + Math.random() * 0.024, type: 0, alpha: 0.9, tint: 0,
    age: 0, life: 14 + Math.random() * 14, wob: Math.random() * 6.28 });
}
function spawnLeaf() {                        // leaves fall from the tree's canopy
  if (parts.length >= MAX_PART) return;
  const T = treeWorld();
  parts.push({ x: T.x + (Math.random() - 0.5) * 5.0, y: 3.5 + Math.random() * 3.5, z: T.z + (Math.random() - 0.5) * 3, vx: 0.5 + Math.random(), vy: -0.3, vz: (Math.random() - 0.5) * 0.4,
    ang: Math.random() * 6.28, spin: (Math.random() - 0.5) * 6, size: 0.09 + Math.random() * 0.05, type: 1, alpha: 1, tint: Math.random(),
    age: 0, life: 20, wob: Math.random() * 6.28, landed: 0 });
}

  if (parts.length >= MAX_PART) return;
  const z = 2.6 + Math.random() * 10, xr = z * FOV * (canvas.width / canvas.height);
  parts.push({ x: (Math.random() * 2 - 1) * xr, y: 0.3 + Math.random() * 1.0, z, vx: 0, vy: 0, vz: 0, ang: 0, spin: 0, size: 0.09, type: 2, alpha: 0, tint: 0,
    age: 0, life: 10 + Math.random() * 12, wob: Math.random() * 6.28 });
}
let seedAcc = 0, leafAcc = 0, fireAcc = 0;
function updateParticles(dt, sk) {
  seedAcc += current.seedRate * dt;
  while (seedAcc >= 1) { seedAcc -= 1; if (seedHeads.length) spawnSeed(seedHeads[(Math.random() * seedHeads.length) | 0], false); }
  for (const g of gusts) {
    if (g.burst && !g.fired && g.front > -8) {
      g.fired = true;
      const n = 10 + ((Math.random() * 14) | 0);
      for (let k = 0; k < n; k++) { const q = seedHeads[(Math.random() * seedHeads.length) | 0]; const m = 8 + ((Math.random() * 14) | 0); for (let j = 0; j < m; j++) spawnSeed(q, true); }
      puff = Math.max(0.15, puff - 0.5);
    }
  }
  puff = Math.min(1, puff + dt / 70);
  leafAcc += current.leafRate * 1.2 * dt;
  while (leafAcc >= 1) { leafAcc -= 1; spawnLeaf(); }
  fireAcc += sk.night * (1 - current.leafRate) * 2.0 * dt;
  while (fireAcc >= 1) { fireAcc -= 1; if (parts.filter(p => p.type === 2).length < 40) spawnFirefly(); }
  const t = sceneTime;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.age += dt;
    if (p.type === 0) {
      const w = windAt(p.x, p.z, t);
      const gust = Math.max(0, w - current.sway * 0.5);
      p.vx += ((1.0 + 3.0 * w) - p.vx) * Math.min(1, dt * 1.5);
      p.vy += ((-0.10 + 0.35 * Math.sin(t * 1.3 + p.wob) + 0.9 * gust) - p.vy) * Math.min(1, dt * 1.2);

    } else if (p.type === 1) {
      const w = windAt(p.x, p.z, t);
      if (!p.landed) {
        p.vx += ((0.8 + 2.5 * w) - p.vx) * Math.min(1, dt * 2);
        p.vy += ((-0.45 + 0.35 * Math.sin(t * 3.0 + p.wob) + 0.6 * Math.max(0, w - 0.3)) - p.vy) * Math.min(1, dt * 2);
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;

      } else {
        p.x += Math.max(0, w - 0.5) * 1.2 * dt;

      p.x += Math.sin(t * 0.7 + p.wob) * 0.25 * dt; p.y += Math.cos(t * 0.9 + p.wob * 1.7) * 0.15 * dt;

/* ------------------------------ windmills: one per Claude session (user: 多session，遠處風車) ------------------------------ */
// Slot i of state.json "sessions" always gets home spot i on the near ridge. Each mill has its own look per
// session state (sail speed, lamp, blink) eased from the current values; the sail angle is integrated so a
// speed change never jumps. Zero sessions → one ambient mill in slot 0 following the sky state.
const MILL_HOMES = [[0.36, 1.0], [0.84, 0.85], [0.21, 0.7], [0.50, 0.9], [0.93, 1.1]];   // [screen x, size]; off the star column (58 %), the tree (70 %) and the left edge
const MILL = { fade: 2.5, baseScale: 0.075 };
const MPARAMS = { speed: [0, 3], lamp: [0, 1], blink: [0, 1] };
const MILL_STATES = {
  clear:    { speed: 0.18, lamp: 0.0, blink: 0 },
  overcast: { speed: 0.70, lamp: 0.3, blink: 0 },
  storm:    { speed: 2.60, lamp: 0.8, blink: 0 },
  clearing: { speed: 0.00, lamp: 0.1, blink: 0 },
  waiting:  { speed: 0.00, lamp: 0.0, blink: 1 },

const mills = MILL_HOMES.map((h, i) => ({ slot: i, active: false, alpha: 0, state: null, cur: { ...MILL_STATES.clear }, from: null, to: null, tStart: 0, tDur: 0, angle: i * 0.7 }));

}

/* ------------------------------ palette (CPU, once per frame): warm light, blue-violet shadow ------------------------------ */
const lerp = (a, b, k) => a + (b - a) * k;

  const day = (clear, grey) => mix3(grey, clear, b);

  let horizonC = day([0.86, 0.90, 0.92], [0.70, 0.72, 0.74]);
  zenith = mix3(zenith, [0.40, 0.32, 0.55], tw * 0.6);
  horizonC = mix3(horizonC, [1.0, 0.62, 0.40], tw * 0.8);
  zenith = mix3(zenith, [0.07, 0.10, 0.19], night);
  horizonC = mix3(horizonC, [0.18, 0.21, 0.32], night);
  let cloudLit = day([1.0, 0.98, 0.94], [0.78, 0.78, 0.80]);
  let cloudShade = day([0.62, 0.66, 0.82], [0.50, 0.52, 0.60]);
  cloudLit = mix3(cloudLit, [1.0, 0.72, 0.52], tw * 0.7); cloudShade = mix3(cloudShade, [0.55, 0.38, 0.52], tw * 0.6);
  cloudLit = mix3(cloudLit, [0.34, 0.38, 0.48], night); cloudShade = mix3(cloudShade, [0.16, 0.18, 0.26], night);   // moonlit grey-blue
  const sunCol = scale3(mix3([1.0, 0.95, 0.82], [1.0, 0.58, 0.32], tw), (1 - night) * (0.5 + 0.5 * b));
  let ground = day([1.0, 0.98, 0.92], [0.78, 0.80, 0.86]);
  ground = mix3(ground, [1.08, 0.96, 0.74], warm * 0.6);
  ground = mix3(ground, [1.05, 0.72, 0.52], tw * 0.6);
  ground = mix3(ground, [0.46, 0.49, 0.56], night);                                     // moon: a blue-white key light at ~45 % of day
  const shadowTint = mix3([0.58, 0.62, 0.86], [0.76, 0.78, 0.86], night);                 // blue-violet shadows
  const lightFloor = lerp(0.25, 0.55, night);                                              // shadows never go black at night
  const lightDir = [0.52, 0.62, 0.59];                                                     // upper right, in front (unit length)
  const rimCol = mix3(scale3(mix3([1.0, 0.92, 0.62], [1.0, 0.62, 0.38], tw), 0.6 * (0.5 + 0.5 * b)), [0.62, 0.70, 0.90], night);   // warm by day, cool moonlight at night
  const fieldA = nd(day([0.68, 0.74, 0.24], [0.50, 0.54, 0.26]));                            // yellow-green
  const fieldB = nd(day([0.48, 0.64, 0.22], [0.38, 0.48, 0.26]));                            // green
  const fieldC = nd(day([0.36, 0.54, 0.28], [0.32, 0.42, 0.30]));                            // cooler green
  const fieldD = nd(day([0.56, 0.56, 0.22], [0.42, 0.42, 0.24]));                            // olive
  const treeCore = nd(day([0.11, 0.25, 0.11], [0.14, 0.22, 0.16]));
  const treeMid = nd(day([0.33, 0.52, 0.19], [0.30, 0.40, 0.22]));
  const mtnFar = nd(day(mix3([0.62, 0.66, 0.84], [0.80, 0.62, 0.68], tw * 0.5), [0.58, 0.60, 0.68]));
  const mtnMid = nd(day(mix3([0.42, 0.56, 0.60], [0.55, 0.45, 0.52], tw * 0.5), [0.44, 0.48, 0.54]));
  const hill = nd(day(mix3([0.44, 0.62, 0.30], [0.60, 0.50, 0.30], tw * 0.5), [0.40, 0.48, 0.34]));
  const meadowA = nd(day(mix3([0.56, 0.68, 0.24], [0.66, 0.56, 0.26], warm * 0.5), [0.44, 0.52, 0.28]));   // yellow-green
  const meadowB = nd(day([0.30, 0.52, 0.34], [0.32, 0.42, 0.34]));                                           // blue-green
  const treeLit = nd(day(mix3([0.74, 0.80, 0.30], [0.84, 0.70, 0.28], warm * 0.5), [0.48, 0.56, 0.30]));

}

/* ------------------------------ loop ------------------------------ */
let raf = 0, nextFrame = 0, lastT = now(), sceneTime = 0;
let drift = [0, 0];
const FRAME_MS = 1000 / FPS;
let fpsCount = 0, fpsT = now(), fps = 0;

function advance(t, dt) {
  step(t);
  if (override) Object.assign(current, override);
  sceneTime += dt;
  const w = 0.003 + 0.010 * current.sway;
  drift[0] += w * dt; drift[1] -= w * dt * 0.3;
  for (const c of cloudSprites) { c.x += w * dt * 1.6 * c.speed; if (c.x > 1.35) c.x -= 1.7; }   // sprites drift with the wind and wrap
  const sk = sky();
  updateGusts(dt);
  updateParticles(dt, sk);
  updateMills(dt, t, sk);
  return sk;
}

function render(sk) {
  const P = palette(sk);
  const aspect = canvas.width / canvas.height;
  const sunX = (sk.sunX - 0.5) * 2;
  const T = treeWorld();
  const treeWind = windAt(T.x, T.z, sceneTime);
  const treeSway = treeWind * 0.006;                                            // the trunk barely leans
  const cloudShadow = (0.35 + 0.65 * current.cloudCover) * (1 - 0.6 * sk.night);
  const backlight = sk.sunUp * (1 - sk.night) * (0.35 + 0.65 * current.skyBrightness) * (1 + 0.5 * current.warmth);
  packClouds(sk);
  const setWind = pr => { gl.uniform1f(pr.u.uTime, sceneTime); gl.uniform1f(pr.u.uSway, current.sway); gl.uniform4fv(pr.u.uGust, gustArr); gl.uniform1f(pr.u.uShadowDrift, shadowDrift); gl.uniform1f(pr.u.uCloudShadow, cloudShadow); gl.uniform4fv(pr.u.uShadow, shadowArr); };

  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LESS);
  gl.clearDepth(1.0);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  // 2) blades + stems: one strip, depth-tested, blended only for the soft near edges
  gl.depthMask(true);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(P_BLADE.p);
  setWind(P_BLADE);
  gl.uniform2f(P_BLADE.u.uRes, canvas.width, canvas.height);
  gl.uniform1f(P_BLADE.u.uAspect, aspect);
  gl.uniform3fv(P_BLADE.u.uGroundLight, P.ground); gl.uniform3fv(P_BLADE.u.uHaze, P.haze); gl.uniform3fv(P_BLADE.u.uShadowTint, P.shadowTint); gl.uniform3fv(P_BLADE.u.uSunCol, P.sunCol);
  gl.uniform1f(P_BLADE.u.uSunX, sunX); gl.uniform1f(P_BLADE.u.uNight, sk.night); gl.uniform1f(P_BLADE.u.uWarm, current.warmth); gl.uniform1f(P_BLADE.u.uBacklight, backlight);
  gl.enableVertexAttribArray(0); gl.enableVertexAttribArray(1); gl.enableVertexAttribArray(2);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufStrip);
  gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 40, 0);
  gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 40, 16);
  gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 40, 32);
  gl.uniform3fv(P_BLADE.u.uRimCol, P.rimCol); gl.uniform3fv(P_BLADE.u.uLightDir, P.lightDir); gl.uniform1f(P_BLADE.u.uLightFloor, P.lightFloor);
  gl.uniform3fv(P_BLADE.u.uFieldA, P.fieldA); gl.uniform3fv(P_BLADE.u.uFieldB, P.fieldB); gl.uniform3fv(P_BLADE.u.uFieldC, P.fieldC); gl.uniform3fv(P_BLADE.u.uFieldD, P.fieldD);
  if (!CONFIG.skip.includes('blades') && strip.length) gl.drawArrays(gl.TRIANGLE_STRIP, 0, strip.length * VERTS_PER);
  // 3a) painted grass strips, near → far, alpha-tested and depth-written (early-z kills the overlap)
  gl.disable(gl.BLEND);
  gl.depthMask(true);
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(P_STRIP.p);
  setWind(P_STRIP);
  gl.uniform2f(P_STRIP.u.uRes, canvas.width, canvas.height);
  gl.uniform1f(P_STRIP.u.uAspect, aspect);
  gl.uniform1f(P_STRIP.u.uBacklight, backlight); gl.uniform1f(P_STRIP.u.uWarm, current.warmth); gl.uniform1f(P_STRIP.u.uNight, sk.night);
  gl.uniform3fv(P_STRIP.u.uLightDir, P.lightDir); gl.uniform1f(P_STRIP.u.uLightFloor, P.lightFloor);
  for (const [n, v] of [['uGroundLight', P.ground], ['uHaze', P.haze], ['uShadowTint', P.shadowTint], ['uSunCol', P.sunCol], ['uRimCol', P.rimCol], ['uFieldA', P.fieldA], ['uFieldB', P.fieldB], ['uFieldC', P.fieldC], ['uFieldD', P.fieldD]]) gl.uniform3fv(P_STRIP.u[n], v);

    const st = STRIPS[i];
    if (!st.tex || !st.mask || CONFIG.skip.includes('strips')) continue;
    gl.activeTexture(gl.TEXTURE0 + 7); gl.bindTexture(gl.TEXTURE_2D, st.tex);
    gl.activeTexture(gl.TEXTURE0 + 8); gl.bindTexture(gl.TEXTURE_2D, st.mask);
    gl.uniform1f(P_STRIP.u.uStripZ, st.z); gl.uniform1f(P_STRIP.u.uStripH, st.h); gl.uniform1f(P_STRIP.u.uStripPhase, st.phase); gl.uniform1f(P_STRIP.u.uStripSeed, st.seed);
    gl.uniform1f(P_STRIP.u.uStripTile, st.tile); gl.uniform1f(P_STRIP.u.uStripFar, st.far); gl.uniform1f(P_STRIP.u.uStripFlip, st.flip || 1); gl.uniform1f(P_STRIP.u.uStripDark, st.dark || 1);
    gl.uniform1i(P_STRIP.u.uStripTex, 7); gl.uniform1i(P_STRIP.u.uStripMask, 8);
    gl.bindBuffer(gl.ARRAY_BUFFER, stripGeo[i].vb); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, stripGeo[i].ib);
    gl.drawElements(gl.TRIANGLE_STRIP, stripGeo[i].n, gl.UNSIGNED_SHORT, 0);
  }
  // 3b) cards: leaf clusters + grass tufts, front to back, alpha-tested with fwidth-sharpened edges
  {
    gl.disable(gl.BLEND);
    gl.depthMask(true);
    gl.useProgram(P_CARD.p);
    setWind(P_CARD);
    gl.uniform2f(P_CARD.u.uRes, canvas.width, canvas.height);
    gl.uniform1f(P_CARD.u.uAspect, aspect);
    gl.uniform1f(P_CARD.u.uTreeWind, treeWind);
    gl.uniform1f(P_CARD.u.uTreeX, T.x); gl.uniform1f(P_CARD.u.uTreeZ, T.z);
    gl.uniform1i(P_CARD.u.uAtlasLeaf, ATLAS.leaf.unit); gl.uniform1i(P_CARD.u.uAtlasTuft, ATLAS.tuft.unit); gl.uniform1i(P_CARD.u.uAtlasTuft2, atlasTex.tuft2 ? ATLAS.tuft2.unit : ATLAS.tuft.unit);
    gl.uniform1f(P_CARD.u.uLeafOn, atlasTex.leaf ? 1 : 0); gl.uniform1f(P_CARD.u.uTuftOn, atlasTex.tuft ? 1 : 0);
    gl.uniform1i(P_CARD.u.uAtlasMid, ATLAS.mid.unit); gl.uniform1f(P_CARD.u.uMidOn, atlasTex.mid ? 1 : 0); gl.uniform4fv(P_CARD.u.uMidCells, midCellArr);
    gl.uniform4fv(P_CARD.u.uLeafCells, leafCellArr); gl.uniform4fv(P_CARD.u.uTuftCells, tuftCellArr);
    gl.uniform1f(P_CARD.u.uNight, sk.night); gl.uniform1f(P_CARD.u.uBacklight, backlight); gl.uniform1f(P_CARD.u.uWarm, current.warmth);
    gl.uniform3fv(P_CARD.u.uLightDir, P.lightDir); gl.uniform1f(P_CARD.u.uLightFloor, P.lightFloor);
    for (const [n, v] of [['uGroundLight', P.ground], ['uHaze', P.haze], ['uShadowTint', P.shadowTint], ['uSunCol', P.sunCol], ['uRimCol', P.rimCol], ['uTreeCore', P.treeCore], ['uTreeMid', P.treeMid], ['uTreeLit', P.treeLit],
      ['uFieldA', P.fieldA], ['uFieldB', P.fieldB], ['uFieldC', P.fieldC], ['uFieldD', P.fieldD]]) gl.uniform3fv(P_CARD.u[n], v);
    gl.enableVertexAttribArray(0); gl.enableVertexAttribArray(1); gl.enableVertexAttribArray(2); gl.enableVertexAttribArray(3);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufCard);
    gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 64, 0);
    gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 64, 16);
    gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 64, 32);
    gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 64, 48);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bufCardIdx);
    const nLeaf = cards.filter(c => c.kind === 0).length;   // sorted near → far: the tufts first, then the leaves
    if (!CONFIG.skip.includes('cards')) gl.drawElements(gl.TRIANGLES, (CONFIG.skip.includes('tufts') ? nLeaf : cards.length) * 6, gl.UNSIGNED_SHORT, CONFIG.skip.includes('tufts') ? (cards.length - nLeaf) * 12 : 0);
    gl.disableVertexAttribArray(3);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  }
  // 1 → last) the painting behind the grass: depth-tested against the strips / cards / heads (free where covered)
  gl.disable(gl.BLEND);
  gl.depthMask(false);
  gl.useProgram(P_SKY.p);
  setWind(P_SKY);
  gl.uniform2f(P_SKY.u.uRes, canvas.width, canvas.height);
  gl.uniform1f(P_SKY.u.uBright, current.skyBrightness);
  gl.uniform1f(P_SKY.u.uCloud, current.cloudCover);
  gl.uniform1f(P_SKY.u.uNight, sk.night);
  gl.uniform1f(P_SKY.u.uTwilight, sk.twilight);
  gl.uniform1f(P_SKY.u.uSunUp, sk.sunUp);
  gl.uniform1f(P_SKY.u.uWarm, current.warmth);
  gl.uniform1f(P_SKY.u.uBeacon, current.beacon);
  gl.uniform1f(P_SKY.u.uTreeSway, treeSway);
  gl.uniform2f(P_SKY.u.uSun, sk.sunX, sk.sunY);
  gl.uniform2f(P_SKY.u.uDrift, drift[0], drift[1]);
  for (const [n, v] of [['uZenith', P.zenith], ['uHorizonC', P.horizonC], ['uCloudLit', P.cloudLit], ['uCloudShade', P.cloudShade], ['uSunCol', P.sunCol], ['uGroundLight', P.ground], ['uShadowTint', P.shadowTint],
    ['uMtnFar', P.mtnFar], ['uMtnMid', P.mtnMid], ['uHill', P.hill], ['uMeadowA', P.meadowA], ['uMeadowB', P.meadowB], ['uTreeLit', P.treeLit], ['uTreeShade', P.treeShade],
    ['uFieldA', P.fieldA], ['uFieldB', P.fieldB], ['uFieldC', P.fieldC], ['uFieldD', P.fieldD]]) gl.uniform3fv(P_SKY.u[n], v);
  gl.uniform4fv(P_SKY.u.uMill, millA); gl.uniform4fv(P_SKY.u.uMillB, millB);
  gl.uniform1f(P_SKY.u.uLightFloor, P.lightFloor); gl.uniform3fv(P_SKY.u.uLightDir, P.lightDir);
  gl.uniform1i(P_SKY.u.uAtlasCloud, ATLAS.cloud.unit);
  gl.uniform1f(P_SKY.u.uCloudOn, atlasTex.cloud ? 1 : 0);
  gl.uniform1f(P_SKY.u.uSheet, smooth(Math.min(1, Math.max(0, (current.cloudCover - 0.55) / 0.4))) * 0.8);
  gl.uniform4fv(P_SKY.u.uCloudSpr, cloudA); gl.uniform4fv(P_SKY.u.uCloudSprB, cloudB); gl.uniform4fv(P_SKY.u.uCloudCells, cloudCellArr);
  {
    const { yb, H } = layerBox();
    gl.uniform1i(P_SKY.u.uTexFar, 0); gl.uniform1i(P_SKY.u.uTexMid, 1); gl.uniform1i(P_SKY.u.uTexNear, 2);
    gl.uniform4f(P_SKY.u.uLayerBox, yb, H, layerTex.far ? 1 : 0, layerTex.mid ? 1 : 0);
    gl.uniform1f(P_SKY.u.uLayerNearOn, layerTex.near ? 1 : 0);
    // neutral daylight paintings → the scene's light; farther layers take more of the sky's haze colour
    const tw = sk.twilight;
    const tintNear = mix3(mix3(P.ground, mix3(P.ground, [1.1, 0.75, 0.5], 0.5), tw * 0.5), [0.30, 0.34, 0.48], sk.night * 0.8);   // moonlit hills go blue
    gl.uniform3fv(P_SKY.u.uTintNear, tintNear);
    gl.uniform3fv(P_SKY.u.uTintMid, mix3(tintNear, P.horizonC, 0.25));
    gl.uniform3fv(P_SKY.u.uTintFar, mix3(tintNear, P.horizonC, 0.45));
  }
  gl.enableVertexAttribArray(0); gl.disableVertexAttribArray(1); gl.disableVertexAttribArray(2);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufTri); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  if (!CONFIG.skip.includes('sky')) gl.drawArrays(gl.TRIANGLES, 0, 3);
  // 3c) flower / seed heads: after the opaque grass, blended, depth-tested, no depth write
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.useProgram(P_HEAD.p);
  setWind(P_HEAD);
  gl.uniform2f(P_HEAD.u.uRes, canvas.width, canvas.height);
  gl.uniform1f(P_HEAD.u.uAspect, aspect);
  gl.uniform1f(P_HEAD.u.uPuff, puff);
  gl.uniform3fv(P_HEAD.u.uGroundLight, P.ground); gl.uniform3fv(P_HEAD.u.uHaze, P.haze); gl.uniform3fv(P_HEAD.u.uShadowTint, P.shadowTint);
  gl.uniform1f(P_HEAD.u.uNight, sk.night); gl.uniform1f(P_HEAD.u.uWarm, current.warmth); gl.uniform1f(P_HEAD.u.uLightFloor, P.lightFloor); gl.uniform3fv(P_HEAD.u.uLightDir, P.lightDir);
  gl.enableVertexAttribArray(0); gl.enableVertexAttribArray(1); gl.enableVertexAttribArray(2);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufHead);
  gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 48, 0);
  gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 48, 16);
  gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 48, 32);
  gl.drawArrays(gl.POINTS, 0, plants.length);
  gl.depthMask(true);
  // 4) particles (no depth write, blended)
  if (parts.length) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.useProgram(P_PART.p);
    gl.uniform2f(P_PART.u.uRes, canvas.width, canvas.height);
    gl.uniform1f(P_PART.u.uAspect, aspect);
    gl.uniform3fv(P_PART.u.uGroundLight, P.ground); gl.uniform3fv(P_PART.u.uHaze, P.haze); gl.uniform3fv(P_PART.u.uSunCol, P.sunCol);
    gl.uniform1f(P_PART.u.uNight, sk.night);
    gl.enableVertexAttribArray(0); gl.enableVertexAttribArray(1); gl.disableVertexAttribArray(2);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufPart);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, partBuf.subarray(0, parts.length * 8));
    gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 32, 0);
    gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 16);
    gl.drawArrays(gl.POINTS, 0, parts.length);
    gl.depthMask(true);
  }
  gl.disable(gl.BLEND);
}

function frame(ms) {
  raf = requestAnimationFrame(frame);
  if (ms < nextFrame) return;
  nextFrame += FRAME_MS;
  if (nextFrame < ms) nextFrame = ms + FRAME_MS;
  const t = now(), dt = Math.min(0.1, t - lastT);
  lastT = t;
  const sk = advance(t, dt);
  render(sk);
  fpsCount++;
  if (t - fpsT >= 1) { fps = fpsCount / (t - fpsT); fpsCount = 0; fpsT = t; }
  if (document.body.classList.contains('debug')) {
    document.getElementById('hud').textContent =
      `state ${stateName}${pending ? ' (→' + pending + ')' : ''}\n` +
      Object.keys(PARAMS).map(p => `${p.padEnd(14)} ${current[p].toFixed(2)}`).join('\n') +
      `\ngusts ${gusts.length}  next ${nextGustIn.toFixed(1)}s  seeds ${parts.filter(p => p.type === 0).length}  leaves ${parts.filter(p => p.type === 1).length}  puff ${puff.toFixed(2)}` +
      `\nfps ${fps.toFixed(1)}  res ${canvas.width}×${canvas.height}  sun ${sk.alt.toFixed(1)}°  night ${sk.night.toFixed(2)}  twilight ${sk.twilight.toFixed(2)}  layers ${['far', 'mid', 'near'].map(k => layerTex[k] ? k : '-').join(' ')} atlas ${['leaf', 'tuft', 'tuft2', 'cloud'].map(k => atlasTex[k] ? k : '-').join(' ')} strips ${STRIPS.filter(st => st.tex && st.mask).length}/4` +
      `\nmills ${effectiveSlots().map(s => s || '-').join(' ')}${sessionsOverride ? ' (override)' : sessionsFile ? '' : ' (ambient)'}  ` +
      mills.filter(m => m.alpha > 0).map(m => `#${m.slot} ${m.state} ${(m.alpha * 100) | 0}% ${m.cur.speed.toFixed(1)}r/s`).join(' ');
  }
}
function start() { if (!raf) { lastT = now(); raf = requestAnimationFrame(frame); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }
let hostPaused = false;
document.addEventListener('visibilitychange', () => (document.hidden || hostPaused ? stop() : start()));
// the host (tools/wallpaper.js) pauses us while a window covers the whole desktop
window.wpPause = on => { hostPaused = !!on; if (hostPaused) stop(); else if (!document.hidden) start(); };
if (!document.hidden) start();

// cost measurement: median / p90 GPU time of one frame's draws (readPixels sync before and after)
function bench(frames = 60) {
  const px = new Uint8Array(4), gpu = [];
  const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  for (let i = 0; i < frames; i++) {
    const sk = advance(now(), 1 / FPS);
    sync(); const t0 = performance.now(); render(sk); sync(); gpu.push(performance.now() - t0);
  }
  gpu.sort((a, b) => a - b);
  return { median: +gpu[frames >> 1].toFixed(2), p90: +gpu[Math.floor(frames * 0.9)].toFixed(2), res: canvas.width + 'x' + canvas.height, particles: parts.length };
}

// testing hooks (themes/demo.html looks for window.theme)
window.theme = window.meadow = {
  requestState, applyState, STATES, PARAMS, CONFIG, sky, bench,
  setOverride(o) { override = o; },
  gust(strength = 1, burst = true, front) { spawnGust(strength, burst, front); },
  setSessions(a) { sessionsOverride = a ? Array.from({ length: 5 }, (_, i) => a[i] || null) : null; },
  get sessions() { return effectiveSlots(); }, mills, MILL_HOMES, MILL_STATES, LAYERS, layerTex, loadLayer, ATLAS, atlasTex, loadAtlas, cards, STRIPS,
  get gusts() { return gusts.map(g => ({ ...g })); }, get particles() { return parts.length; },
  get current() { return { ...current }; }, get state() { return stateName; },
};
</script>
</body>
