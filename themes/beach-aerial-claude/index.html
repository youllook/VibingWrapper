<!doctype html>
<html><head><meta charset="utf-8"><title>鷗航灣・Claude</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0a2f44}canvas{display:block;width:100%;height:100%}</style>
</head><body><canvas id="c"></canvas>
<script>
/* 鷗航灣・Claude（beach-aerial-claude，2026-10-24）
   Straight-down drone view: land on the left third, the sea deepening to open ocean on the right.
   1. land.webp — forest, boulders and sand (generated by Codex, the sea drained out so the sand doubles as the seabed),
      slid left so the shoreline sits at a third of the screen
   2. sea — procedural: depth from a noisy shoreline, crests marching shoreward, swash run-up and wet sand,
      refraction, caustics, glints, swell lines, Kelvin wakes behind the boats
   3. foam — a ping-pong float buffer: whitewater at the breakers, the swash front, offshore whitecaps and the boats'
      wash, advected with the water, decaying into lace (Worley cell edges)
   No weather. Each AI session is a boat (boat1/boat2.png, Codex) sailing in from the bottom and out of the top;
   a session waiting for you gets seagulls (gull.png, Codex) circling its boat, which idles while they do;
   a running session is followed by a single gull. A few turtles graze the shallows as ambience. */
'use strict';
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
const Q = new URLSearchParams(location.search);
const STATES = { clear: { zh: '待命' }, overcast: { zh: '思考中' }, storm: { zh: '執行中' }, clearing: { zh: '收尾' }, waiting: { zh: '等你' } };
const CONFIG = { polling: true, clockHours: Q.has('day') ? 10.5 : Q.has('night') ? 22 : null, fps: 30 };
const PARAMS = { night: 0 };
let sky = 'clear', slots = [null, null, null, null, null], sources = [null, null, null, null, null];
const LAND_SHIFT = 0.225;     // plate uv slid left: the plate's shoreline (x 0.555) lands at a third of the screen

// ---------------------------------------------------------------- shaders
const COMMON = `#version 300 es
precision highp float;
uniform float uT, uWT, uPA;
uniform vec4 uBoat[5], uBoatB[5];   // uBoat: world x, y, cos, sin of the heading; uBoatB: present, kind, width, speed factor
uniform float uBoatLen[5];
const float OMEGA = 1.0 / 8.5;          // breaker period 8.5 s
const float K = 1.0 / 0.085;            // crest spacing in world units (screen height = 1)
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec2 h22(vec2 p){ vec3 a = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); a += dot(a, a.yzx + 33.33); return fract((a.xx + a.yz) * a.zy); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), u.x), mix(h21(i + vec2(0, 1)), h21(i + 1.), u.x), u.y); }
float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= .5; } return s; }
float fbm3(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 3; i++) { s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= .5; } return s; }
float cellEdge(vec2 p){ vec2 i = floor(p), f = fract(p); float d1 = 8., d2 = 8.;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) { vec2 g = vec2(x, y); vec2 r = g + h22(i + g) - f; float d = dot(r, r);
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d; }
  return sqrt(d2) - sqrt(d1); }
float lace(vec2 q){ return max(1. - smoothstep(0.015, 0.10, cellEdge(q * 46.)), 0.75 * (1. - smoothstep(0.02, 0.12, cellEdge(q * 115. + 3.1)))); }
vec2 toLocal(vec2 q, vec2 c, float r){ vec2 d = q - c; float cs = cos(r), sn = sin(r); return vec2(cs * d.x + sn * d.y, -sn * d.x + cs * d.y); }
vec2 toLocalCS(vec2 q, vec2 c, vec2 r){ vec2 d = q - c; return vec2(r.x * d.x + r.y * d.y, -r.y * d.x + r.x * d.y); }   // r = (cos, sin), precomputed
// signed world distance seaward of the shoreline (q = screen-plate uv with x scaled by the plate aspect)
float shoreX(float y){ return 0.33 + 0.05 * sin(y * 3.4 + 0.4) + 0.016 * sin(y * 8.3 + 2.0) + 0.008 * sin(y * 17.0 + 1.0); }
float shoreD(vec2 q){ return q.x - shoreX(q.y) * uPA; }
float warpW(float y, float d){ return 0.45 * vnoise(vec2(y * 2.2, d * 4. + 1.3)) + 0.2 * vnoise(vec2(y * 6.5, d * 9.)); }
float phase(vec2 q, float d){ return d * K + uWT * OMEGA + warpW(q.y, d); }
float surfW(){ return 0.21; }
// swash: cycle c (0 = bore reaches the shoreline), run-up amplitude A, front position e (negative = up the sand), de = de/dt
void swash(vec2 q, out float c, out float A, out float e, out float de){
  float s = uWT * OMEGA + warpW(q.y, 0.);
  c = fract(s);
  A = 0.026 + 0.02 * vnoise(vec2(q.y * 5., s * 0.4));   // continuous in s: a per-cycle floor() tore the wet band along the beach
  float cc = max(c, 0.02), pc = pow(cc, 0.6);
  e = -A * sin(3.14159 * pc);
  de = -A * 3.14159 * cos(3.14159 * pc) * 0.6 * pow(cc, -0.4) * OMEGA;
}
`;
const VS = `#version 300 es
in vec2 a; out vec2 vUV; void main(){ vUV = a * .5 + .5; gl_Position = vec4(a, 0, 1); }`;

// foam simulation, in screen-plate uv
const SIM = COMMON + `
uniform sampler2D uPrev; uniform float uDt; uniform vec2 uRes;
in vec2 vUV; out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes, q = vec2(uv.x * uPA, uv.y);
  float d = shoreD(q), ph = phase(q, d), f = fract(ph);
  float c, A, e, de; swash(q, c, A, e, de);
  float sw = surfW();
  float inSurf = smoothstep(sw + 0.04, sw, d) * smoothstep(-0.01, 0.005, d);
  float inSwash = smoothstep(0.03, 0.0, d);
  float cS = 0.085 * OMEGA;                                // crest speed: whitewater rides the bore, trails lag behind
  float vS = -(cS * 1.05 * exp(-f * 3.) + 0.0015);
  float back = smoothstep(0.35, 0.7, f) * inSurf * 0.006;  // between bores the surf zone drains back out
  float vd = mix(-0.002, vS + back, inSurf);
  vd = mix(vd, clamp(de, -0.06, 0.03), inSwash);
  // rip channels: narrow seaward currents fed by along-shore flow, carrying old foam out past the breakers
  float ripN = vnoise(vec2(q.y * 2.6 + 7., uWT * 0.004)), ripE = 0.01;
  float rip = smoothstep(0.55, 0.80, ripN);
  float ripG = (smoothstep(0.55, 0.80, vnoise(vec2((q.y + ripE) * 2.6 + 7., uWT * 0.004)))
              - smoothstep(0.55, 0.80, vnoise(vec2((q.y - ripE) * 2.6 + 7., uWT * 0.004)))) / (2. * ripE);
  float ripReach = smoothstep(-0.01, 0.03, d) * smoothstep(0.65, 0.25, d);
  vd += rip * ripReach * 0.03;
  float vy = 0.0025 + clamp(ripG, -4., 4.) * 0.0012 * smoothstep(sw + 0.05, sw * 0.5, d);
  vec2 vel = vec2(vd / uPA, vy), su = uv - vel * uDt, px = 1. / uRes;
  float D = texture(uPrev, su).r;
  // out at sea the wash slowly spreads sideways
  float D4 = 0.25 * (texture(uPrev, su + vec2(px.x, 0)).r + texture(uPrev, su - vec2(px.x, 0)).r
                   + texture(uPrev, su + vec2(0, px.y)).r + texture(uPrev, su - vec2(0, px.y)).r);
  D = mix(D, D4, 0.35 * smoothstep(0.25, 0.4, d));
  float water = smoothstep(e - 0.002, e + 0.002, d);
  float outer = mix(mix(0.035, 0.012, rip), 0.07, smoothstep(0.35, 0.5, d));                   // offshore foam lingers, longest inside the rips
  float rate = mix(2.2, mix(0.55, mix(0.09, outer, smoothstep(sw * 0.7, sw + 0.08, d)), smoothstep(0.0, 0.03, d)), water);
  D *= exp(-rate * uDt);
  // breakers: the break point wanders along the beach and each crest breaks in segments, always closing out near the sand
  float swy = sw * (0.55 + 0.8 * vnoise(vec2(q.y * 2.3, 5.)));
  float br = smoothstep(swy, swy * 0.6, d) * smoothstep(-0.004, 0.012, d);
  float seg = smoothstep(0.35, 0.7, vnoise(vec2(q.y * 4.5 + 3., floor(ph) * 2.3 + uWT * 0.03)) + 0.45 * smoothstep(swy * 0.5, 0.0, d));
  // whitewater wall: solid at the crest, then a thick turbulent band dragged seaward behind it, its back edge torn by noise
  float turb = fbm(q * vec2(16., 46.) + vec2(uWT * 0.05, uWT * 0.3));
  float wall = smoothstep(0.0, 0.015, f) * smoothstep(0.03, 0.0, f) + smoothstep(0.012, 0.0, f);
  float body = smoothstep(0.0, 0.02, f) * smoothstep(0.30, 0.0, f + (0.5 - turb) * 0.35);
  float srcS = br * seg * (1.3 * wall + 0.9 * body) * (0.55 + 0.6 * vnoise(q * vec2(3., 14.) + vec2(0, uWT * 0.2)));
  float srcE = smoothstep(0.006, 0.0, abs(d - e)) * (c < 0.32 ? 0.8 : 0.15) * step(d, 0.02)
             * (0.4 + 0.6 * vnoise(vec2(q.y * 22., uWT * 0.1)));
  float caps = smoothstep(0.62, 0.8, vnoise(vec2(q.y * 1.8, floor(ph) * 3.1) + vec2(floor(ph) * 0.7, 0.)));
  float srcO = smoothstep(0.035, 0.0, f) * caps * smoothstep(swy + 0.02, swy + 0.07, d) * smoothstep(0.75, 0.4, d)
             * vnoise(q * vec2(9., 2.5) + 7.) * 2.2;
  float gate = 0.25 + 0.75 * smoothstep(0.3, 0.7, vnoise(vec2(q.y * 1.4 + 0.5, uWT * 0.012 + 3.)));
  gate = max(gate, 0.9 * rip);                             // rips sit where the breakers are busiest
  float src = (srcS * 3.4 * gate + srcE * 1.4 + srcO) * (0.3 + 0.7 * lace(q + vec2(0, uT * 0.0015)));
  D += src * uDt * 2.6;
  // boat wash lives in G with its own life: narrow churn at the propeller that spreads sideways and dies in a few seconds,
  // so the trail is a tapering tongue, not a chalk stripe the length of the screen. Bow spray goes in there too.
  float B = texture(uPrev, su).g;
  float B4 = 0.25 * (texture(uPrev, su + vec2(2. * px.x, 0)).g + texture(uPrev, su - vec2(2. * px.x, 0)).g
                   + texture(uPrev, su + vec2(0, px.y)).g + texture(uPrev, su - vec2(0, px.y)).g);
  B = mix(B, B4, 0.55) * exp(-0.30 * uDt);
  float srcB = 0.;
  for (int i = 0; i < 5; i++) {
    if (uBoatB[i].x < 0.5) continue;
    vec2 lc = toLocalCS(q, uBoat[i].xy, uBoat[i].zw);
    float Lh = uBoatLen[i] * 0.5, Wh = uBoatB[i].z * 0.5, sp = uBoatB[i].w;
    if (abs(lc.x) > Wh * 3. || lc.y > Lh * 1.1 || lc.y < -Lh - 0.05) continue;
    float s = -(lc.y + Lh * 0.92);
    float wash = smoothstep(-0.003, 0.003, s) * smoothstep(0.025, 0.0, s) * smoothstep(Wh * (0.38 + s * 8.), Wh * 0.05, abs(lc.x));
    float hull = Wh * (1.0 - smoothstep(Lh * 0.2, Lh, lc.y) * 0.75);
    float bow = smoothstep(-Lh * 0.2, Lh * 0.6, lc.y) * step(lc.y, Lh * 0.95) * smoothstep(0.004, 0.0, abs(abs(lc.x) - hull - 0.002));
    srcB += (wash * 0.9 + bow * 0.5) * sp * (0.5 + 0.5 * lace(q * 1.4 + uT * 0.01));
  }
  B += srcB * uDt * 2.6;
  o = vec4(clamp(D, 0., 1.7), clamp(B, 0., 1.5), 0, 1);
}`;

const FS = COMMON + `
uniform sampler2D uLand, uFoamT, uTurtle, uBoat0, uBoat1, uGullT;
uniform vec2 uRes; uniform float uNight, uDbg, uGullAsp, uShift;
uniform vec4 uTur[3];                 // world x, y, rotation, depth fraction
uniform vec4 uGull[20], uGullB[20];   // uGull: world x, y, cos, sin of the heading; uGullB: visibility, altitude, wingspan (a flap squashes it), -
in vec2 vUV; out vec4 o;
float heightW(vec2 q){
  float d = shoreD(q), f = fract(phase(q, d));
  float sh = smoothstep(0.30, 0.04, d);          // shoaling: round swells offshore, steep bores in the surf
  float crest = mix(pow(0.5 + 0.5 * cos(6.2832 * f), 4.), mix(exp(-f * 5.), 1., smoothstep(0.88, 1., f)), sh);
  float amp = mix(0.0008, 0.0032, sh) * (0.45 + 0.9 * vnoise(vec2(q.y * 3.2, d * 2.5)));
  float h = crest * amp + 0.00055 * fbm3(q * 38. + vec2(uT * 0.25, -uT * 0.18)) + 0.0003 * vnoise(q * 140. + uT * 0.6);   // evaluated 3x per pixel: 3 octaves
  // Kelvin wakes: feathered diverging arms at ~19.5 degrees plus transverse ripples inside the V
  for (int i = 0; i < 5; i++) {
    if (uBoatB[i].x < 0.5) continue;
    vec2 lc = toLocalCS(q, uBoat[i].xy, uBoat[i].zw);
    float s = uBoatLen[i] * 0.38 - lc.y;
    if (s < 0. || s > 0.5 || abs(lc.x) > s * 0.4 + 0.03) continue;
    float al = abs(lc.x), arm = s * 0.36 + uBoatB[i].z * 0.45, w = 0.003 + s * 0.022, u = al - arm;
    float env = exp(-s * 7.) * uBoatB[i].w;
    h += 0.0034 * env * exp(-u * u / (w * w)) * (0.8 + 0.2 * sin(s * 320. - al * 200. - uT * 5.));
    h += 0.0012 * env * smoothstep(arm, arm * 0.5, al) * sin(s * 150. - uT * 3.5);
  }
  return h;
}
vec3 waterize(vec3 bed, float depth){
  float od = depth * 5.2;
  vec3 T = exp(-vec3(2.1, 0.55, 0.40) * od);
  vec3 S = mix(vec3(0.42, 0.84, 0.78), vec3(0.04, 0.40, 0.47), smoothstep(0.04, 0.6, depth));
  S = mix(S, vec3(0.012, 0.17, 0.30), smoothstep(0.45, 1.05, depth));     // open ocean
  return bed * T + S * (1. - T);
}
vec4 sprite(sampler2D t, vec2 uv){ if (any(lessThan(uv, vec2(0))) || any(greaterThan(uv, vec2(1)))) return vec4(0); return texture(t, vec2(uv.x, 1. - uv.y)); }
vec4 boatTex(float kind, vec2 uv){ return kind < 0.5 ? sprite(uBoat0, uv) : sprite(uBoat1, uv); }
void main(){
  float sa = uRes.x / uRes.y; vec2 s = vUV, p = s;
  if (sa > uPA) p.y = .5 + (s.y - .5) * uPA / sa; else p.x = .5 + (s.x - .5) * sa / uPA;
  vec2 q = vec2(p.x * uPA, p.y);
  float d = shoreD(q);
  float c, A, e, de; swash(q, c, A, e, de);
  float wm = smoothstep(e - 0.0015, e + 0.0015, d);
  vec3 land = texture(uLand, p + vec2(uShift, 0)).rgb;

  // wet sand behind the swash, darker and glossy near the retreating edge
  float wet = smoothstep(-A * 1.08, -A * 0.75, d) * (1. - wm);
  vec3 col = land * mix(1., 0.70, wet) + wet * 0.12 * exp(-max(e - d, 0.) / 0.005) * vec3(1., .9, .75);

  // water surface normal
  float eps = 0.0015, h0 = heightW(q);
  vec2 g = vec2(heightW(q + vec2(eps, 0)) - h0, heightW(q + vec2(0, eps)) - h0) / eps;
  vec3 n = normalize(vec3(-g, 1.));
  float depth = max(d - e, 0.) * mix(0.35, 1., smoothstep(0.0, 0.05, d));
  vec2 pr = p + n.xy * 0.035 * min(depth + 0.004, 0.06);
  vec2 qr = vec2(pr.x * uPA, pr.y);
  vec3 bed = texture(uLand, pr + vec2(uShift, 0)).rgb * 0.94;
  if (d > 0. && d < 0.2) bed *= 1. + 0.035 * sin(shoreD(qr) * 260. + fbm(qr * 9.) * 9.) * smoothstep(0.0, 0.04, d) * smoothstep(0.2, 0.08, d);   // sand ripples
  if (d > 0.12 && d < 0.75) bed *= mix(1., 0.62 + 0.5 * fbm(qr * 5. + 11.), smoothstep(0.12, 0.5, d));                                      // seabed patches (invisible under deep water anyway)
  if (depth > 0.004 && depth < 0.28) {                 // caustics only where they can show (saves the Worley pass over the deep)
    float caus = (1. - smoothstep(0.0, 0.09, cellEdge(qr * 44. + vec2(uT * 0.21, uT * 0.13) + n.xy * 6.)))
               * smoothstep(0.004, 0.02, depth) * smoothstep(0.28, 0.03, depth);
    bed += caus * 0.17 * vec3(1., .97, .88); }

  // turtles grazing the shallows, and their shadows on the bed
  vec3 turC = vec3(0); float turA = 0., turD = 1., shad = 0.;
  for (int i = 0; i < 3; i++) {
    vec4 t = uTur[i]; float sc = 0.05;
    if (dot(q - t.xy, q - t.xy) > 0.0025) continue;
    vec2 tuv = toLocal(q, t.xy, t.z) / vec2(sc, sc * 0.92) + .5;
    vec2 suv = toLocal(q, t.xy + vec2(0.010, -0.007) * (1.1 - t.w), t.z) / vec2(sc, sc * 0.92) + .5;
    shad = max(shad, sprite(uTurtle, suv).a * (1. - t.w) * 0.55);
    vec4 tx = sprite(uTurtle, tuv);
    if (tx.a > turA) { turA = tx.a; turC = tx.rgb; turD = t.w; }
  }
  bed *= 1. - shad * smoothstep(0.0, 0.02, depth);
  vec3 wcol = waterize(bed, depth);
  wcol = mix(wcol, waterize(turC * 0.9, depth * turD), turA * smoothstep(0.01, 0.05, d));
  // open ocean: wind patches on the deep water
  if (d > 0.45) wcol *= mix(1., 0.88 + 0.22 * fbm(q * 2.2 + vec2(uT * 0.004, 0)), smoothstep(0.45, 0.9, d));

  // glints: sun low in the upper left
  vec3 L = normalize(vec3(-0.55, 0.45, 1.05)), Hh = normalize(L + vec3(0, 0, 1));
  float nh = max(dot(n, Hh), 0.);
  float spec = pow(nh, 900.) * 2.2 + pow(nh, 90.) * 0.06;
  wcol += spec * vec3(1., .93, .78) * (1. - uNight);
  wcol += (1. - n.z) * 7. * vec3(0.05, 0.07, 0.08);
  // swell lines: the face of each crest a little darker, the back catches sky; they fade into the deep
  { float f = fract(phase(q, d)), sh = smoothstep(0.30, 0.04, d);
    float face = smoothstep(0.55, 0.92, f) * (1. - smoothstep(0.92, 1.0, f));
    float back = smoothstep(0.92, 1.0, f) + smoothstep(0.12, 0.0, f);
    float vis = (1. - sh) * smoothstep(0.03, 0.12, d) * mix(1., 0.35, smoothstep(0.4, 0.9, d));
    if (vis > 0.01) vis *= smoothstep(0.35, 0.8, fbm(vec2(q.y * 1.7, d * 2.2) + vec2(0, uWT * 0.01)));
    wcol *= 1. - 0.05 * face * vis;
    wcol += 0.035 * back * vis * vec3(0.75, 0.9, 0.95); }

  // Kelvin arms, lit from both sides: the arm crest catches sky as a faint pale ridge, independent of the sun glint
  { float kel = 0.;
    for (int i = 0; i < 5; i++) {
      if (uBoatB[i].x < 0.5) continue;
      vec2 lc = toLocalCS(q, uBoat[i].xy, uBoat[i].zw);
      float s2 = uBoatLen[i] * 0.38 - lc.y;
      if (s2 < 0. || s2 > 0.34 || abs(lc.x) > s2 * 0.4 + 0.03) continue;
      float al = abs(lc.x), arm = s2 * 0.36 + uBoatB[i].z * 0.45, w = 0.0025 + s2 * 0.014, u = al - arm;
      float env = exp(-s2 * 9.) * uBoatB[i].w * smoothstep(0.0, 0.02, s2) * smoothstep(0.34, 0.22, s2);
      kel += env * exp(-u * u / (w * w)) * (0.35 + 0.65 * pow(0.5 + 0.5 * sin(s2 * 320. - al * 200. - uT * 5.), 2.));   // a chain of little crests
    }
    wcol += kel * 0.26 * vec3(0.80, 0.92, 0.98) * (1. - 0.6 * uNight); }

  // foam (the Worley passes run only where the buffer holds something: most of the open sea skips them)
  vec2 FD = texture(uFoamT, p).rg;
  float D = FD.r, B = FD.g, fv = 0.;
  vec2 qf = q + vec2(0, uT * 0.0015) + n.xy * 0.3;
  if (D > 0.004) {
    qf += 0.006 * vec2(fbm(q * 14.), fbm(q * 14. + 5.));
    vec2 qs = vec2(qf.x * 0.45, qf.y);
    float ce1 = cellEdge(qs * 26.), ce2 = cellEdge(qs * 64. + 3.1), ce3 = cellEdge(qf * 150. + 7.7);
    float Dd = smoothstep(0.0, 0.9, D) + 0.08 * smoothstep(0.004, 0.08, D);
    fv = smoothstep(0.004, 0.06, D) * max(max(1. - smoothstep(Dd * 0.24 + 0.008, Dd * 0.24 + 0.05, ce1),
                                            0.85 * (1. - smoothstep(Dd * 0.20, Dd * 0.20 + 0.04, ce2))),
                                        0.55 * smoothstep(0.35, 0.9, D) * (1. - smoothstep(0.0, 0.25, ce3)));
    fv *= mix(0.6, 1., smoothstep(e - 0.004, e, d)) * mix(0.55, 1., smoothstep(0.0, 0.03, d)); }
  if (d > 0. && d < surfW() * 1.4) {                   // the bore: a thin bright crest line where each wave is breaking
    float f = fract(phase(q, d)), sw = surfW();
    float swy = sw * (0.55 + 0.8 * vnoise(vec2(q.y * 2.3, 5.)));
    float br = smoothstep(swy, swy * 0.6, d) * smoothstep(0.0, 0.015, d);
    if (br > 0.001) {
      float seg = smoothstep(0.4, 0.7, vnoise(vec2(q.y * 4.5 + 3., floor(phase(q, d)) * 2.3 + uWT * 0.03)) + 0.45 * smoothstep(swy * 0.5, 0.0, d));
      float line = smoothstep(0.045, 0.0, f) * smoothstep(0.0, 0.006, f) + 0.6 * smoothstep(1.0, 0.985, f) * smoothstep(0.97, 1.0, f);

  for (int i = 0; i < 5; i++) {

  // seagulls: shadow on the sea first (offset by their height), then the birds themselves
  for (int i = 0; i < 20; i++) {

    vec2 dq = q - vec2(1., -1.) * gb.y - gg.xy; if (dot(dq, dq) > 0.0012) continue;
    vec2 sl = toLocalCS(q - vec2(1., -1.) * gb.y, gg.xy, gg.zw);

  }
  for (int i = 0; i < 20; i++) {
    vec4 gg = uGull[i], gb = uGullB[i];
    if (gb.x < 0.01) continue;
    vec2 sz = vec2(gb.z, 0.04 * uGullAsp);

  }

  float glow = fv * (1. - hullA) * (1. - 0.6 * smoothstep(0.1, 0.4, B));
  vec3 nightC = col * vec3(0.15, 0.20, 0.31) + glow * vec3(0.10, 0.55, 0.75) * 0.26 + spec * 0.3 * vec3(0.6, 0.7, 0.9);

// ---------------------------------------------------------------- GL setup
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);

function prog(fs) { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); u[nm] = gl.getUniformLocation(p, nm); }
  return { p, u }; }
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear');
const P_SIM = prog(SIM), P_MAIN = prog(FS);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

}
const SIM_W = 1024, SIM_H = 576;
const foam = [0, 1].map(() => { const t = tex(SIM_W, SIM_H); const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, fb }; });
gl.bindFramebuffer(gl.FRAMEBUFFER, null);
let fi = 0, PA = 16 / 9;
const TX = {}, ASP = {};     // textures and their height/width
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });

// ---------------------------------------------------------------- ambience: three turtles in the shallows
function shoreXjs(y) { return 0.33 + 0.05 * Math.sin(y * 3.4 + 0.4) + 0.016 * Math.sin(y * 8.3 + 2.0) + 0.008 * Math.sin(y * 17.0 + 1.0); }

const turU = new Float32Array(12);
function stepTurtles(dt) {
  TUR.forEach((t, i) => {
    t.a += t.w * dt;
    const x = shoreXjs(t.y) * PA + t.d0 + t.rx * Math.cos(t.a), y = t.y + t.ry * Math.sin(t.a);
    const vx = -t.rx * Math.sin(t.a) * Math.sign(t.w), vy = t.ry * Math.cos(t.a) * Math.sign(t.w);
    turU.set([x, y, Math.atan2(vy, vx) - Math.PI / 2, 0.3], i * 4);

}

// ---------------------------------------------------------------- boats (one per session slot) and their gulls
// A live session keeps sending its boat up the screen: in at the bottom, out at the top, a short pause, again.
// waiting → the boat idles and four gulls spiral in to circle it; storm (running) → a little faster, one gull tags along.
// An emptied slot lets its boat finish the crossing and not come back.
const BOAT_LEN = [0.12, 0.14], BOAT_SPD = { storm: 0.03, waiting: 0.004 }, CRUISE = 0.018;

  gulls: [0, 1, 2, 3].map(j => ({ a: Math.random() * 6.28, w: (0.5 + 0.13 * j) * (j === 2 ? -1 : 1), R: 0.05 + 0.011 * j, alt: 0.02 + 0.006 * j, fp: Math.random() * 9 })) }));
const boatU = new Float32Array(20), boatB = new Float32Array(20), boatL = new Float32Array(5), gullU = new Float32Array(80), gullB = new Float32Array(80);
function laneX(i) { const xs = shoreXjs(0.5) * PA + 0.34, xe = PA - 0.08; return xs + (xe - xs) * (i + 0.5) / 5 + (Math.random() - 0.5) * 0.06; }
function stepBoats(dt) {
  const k = 1 - Math.exp(-dt * 0.6), kg = 1 - Math.exp(-dt * 0.35);
  BOATS.forEach((b, i) => {
    const st = slots[i];
    if (!b.on) {
      if (st) { b.delay -= dt; if (b.delay <= 0) { b.on = true; b.y = -0.08; b.x = laneX(i); b.kind = Math.random() < 0.5 ? 0 : 1; b.v = CRUISE; } }
    } else {

    }
    b.gather += ((b.on && st === 'waiting' ? 1 : 0) - b.gather) * kg;
    b.follow += ((b.on && st === 'storm' ? 1 : 0) - b.follow) * kg;

    const rot = 0.035 * Math.sin(T * 0.9 + i * 1.3) + 0.02 * Math.sin(T * 1.7 + i), x = b.x + 0.003 * Math.sin(T * 0.4 + i * 2.);
    boatU.set([x, b.y, Math.cos(rot), Math.sin(rot)], i * 4); boatL[i] = len * (1 + 0.01 * Math.sin(T * 1.1 + i));

    b.gulls.forEach((g, j) => {
      const amt = j === 0 ? Math.max(b.gather, b.follow) : b.gather, R = g.R * (j === 0 && b.follow > b.gather ? 1.5 : 1) + (1 - amt) * 0.9;
      g.a += g.w * dt * (0.6 + 0.4 * amt);
      const cx = x + Math.cos(g.a) * R, cy = b.y + Math.sin(g.a) * R * 0.85;
      const vx = -Math.sin(g.a) * Math.sign(g.w), vy = Math.cos(g.a) * 0.85 * Math.sign(g.w);
      const flapOn = Math.max(0, Math.sin(T * 0.5 + g.fp)) ** 4, span = 0.04 * (1 - 0.4 * flapOn * (0.5 + 0.5 * Math.sin(T * 13 + g.fp)));

// ---------------------------------------------------------------- the scene
let W = 0, H = 0, T = 0, WT = 0;
function setCommon(u, t) {
  gl.uniform1f(u.uT, t); gl.uniform1f(u.uWT, WT); gl.uniform1f(u.uPA, PA);
  gl.uniform4fv(u.uBoat, boatU); gl.uniform4fv(u.uBoatB, boatB); gl.uniform1fv(u.uBoatLen, boatL);
}

function drawScene(t, dt, simOnly) {

  gl.bindFramebuffer(gl.FRAMEBUFFER, foam[1 - fi].fb); gl.viewport(0, 0, SIM_W, SIM_H);

  bindTex(u, 'uBoat0', 3, TX.boat1); bindTex(u, 'uBoat1', 4, TX.boat2); bindTex(u, 'uGullT', 5, TX.gull);

// ---------------------------------------------------------------- plumbing (keep)
function applyState(s) {
  if (!s) return;

function resize() {

}
function nightness() { const d = new Date(), h = CONFIG.clockHours ?? d.getHours() + d.getMinutes() / 60;

document.addEventListener('visibilitychange', () => { if (!document.hidden && !paused && ready) requestAnimationFrame(loop); });
function loop(now) {

// ?perf=1: frame time of 120 frames, synced with a 1-pixel readPixels (gl.finish does not block under ANGLE), shown top-left

const PERF = Q.has('perf'); let perfN = 0, perfSum = 0, perfMax = 0, perfEl = null;

(async () => {

  const imgs = await Promise.all(names.map(n => load(n === 'land' ? 'land.webp' : n + '.png')));

  PA = 1 / ASP.land;
