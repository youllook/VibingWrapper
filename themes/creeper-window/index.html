<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>麥塊世界</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05080f;
               user-select: none; -webkit-user-select: none; -webkit-user-drag: none; cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; pointer-events: none; }
  #hud { position: fixed; left: 10px; bottom: 8px; font: 12px/1.5 Consolas, monospace; color: rgba(255,255,255,.9);
         background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 4px; white-space: pre; display: none; }
  body.debug #hud { display: block; }
  /* alignment overlay (?ref=<image url>&a=0.5): the target image over the render, for matching the camera */
  #ref { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<img id="ref" alt="">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
/* =====================================================================================
 * 麥塊世界 (creeper-window), 2026-10-29 — target docs/codex-brainstorm/minecraft/mc1.png
 *
 * Midnight, rain, a lantern on the table; outside the window a creeper stands on the porch. Claude's state is its
 * performance (docs/麥塊世界/04-燈光特效.md):
 *   none      no session: nobody at the window (it walks off to the left)
 *   clear     idle: stands still, a slow green breath
 *   overcast  thinking: tilts its head one way, then the other
 *   storm     running: leans in towards the glass; the rain thickens, far lightning now and then
 *   clearing  wrapping up: straightens up, the lantern flares once and settles
 *   waiting   needs you: turns to look at you, swells and flashes white — and never goes off
 * Frame: scene (half res, HDR) → mist → composite (DoF, glass, bloom, grade). Water has its own mirror pass and the
 * glass a mask pass. Infrastructure per themes/README.md: state polling, wpPause, 30 fps, window.theme.
 * ===================================================================================== */
import * as THREE from 'three';
import { buildScene, mirror, LAYOUT, WATER_Y, groundH } from './scene.js';
import { creeperCrowd, crowdRim, crowdFar } from './crowd.js';
import { blockMaterial, texture, lantern } from './assets.js';
import { sky, rain, water, glassMaterial, fullscreen, MIST_FRAG, COMP_FRAG } from './fx.js';

/* ------------------------------ config ------------------------------ */
const FPS = 30;
const QS = new URLSearchParams(location.search);
const MAX_PIXELS = 1920 * 1080 * 0.5;
const RES_OVERRIDE = +(QS.get('res') || 0);
const resScale = (w, h) => RES_OVERRIDE || Math.min(1, Math.sqrt(MAX_PIXELS / (w * h)));
const CAM = LAYOUT.cam;                       // fitted to mc1 (docs/麥塊世界/02-場景擺放.md)
const CONFIG = {
  polling: true,
  exposure: 1.35,
  contrast: 0.45, saturation: 1.15, black: 0.02,   // the final grade: S-curve amount, saturation, black point
  aperture: 15,                       // depth of field strength (px of blur per 1/m off focus)
  farLift: 1,                         // the far crowd's faces lit by the cabin at night (readable shapes)
  lantern: 5,                         // candela
  moon: 1.6,
  // the time of day (0–24). null = the computer's clock; ?day=1 pins 10.5, ?night=1 pins 22 (themes/README.md);
  // the recorder sets it too
  clockHours: QS.has('day') ? 10.5 : QS.has('night') ? 22 : null,
};
// per state: rain amount (0..1), mist density, how wet the glass is, lightning on/off
const STATES = {
  none:     { rain: 0,    mist: 0.008, wet: 0,    bolts: 0 },   // nobody at the window: dry
  clear:    { rain: 0.45, mist: 0.012, wet: 0.65, bolts: 0 },
  overcast: { rain: 0.55, mist: 0.015, wet: 0.7,  bolts: 0 },
  storm:    { rain: 1.0,  mist: 0.022, wet: 0.9,  bolts: 1 },
  clearing: { rain: 0.4,  mist: 0.012, wet: 0.65, bolts: 0 },
  waiting:  { rain: 0.5,  mist: 0.015, wet: 0.7,  bolts: 0 },
};
const PARAMS = { rain: [0, 1], mist: [0, 0.06], wet: [0, 1] };
const KEYS = { '0': 'none', '1': 'clear', '2': 'overcast', '3': 'storm', '4': 'clearing', '5': 'waiting' };

/* ------------------------------ tweens ------------------------------ */
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
let simT = 0;
class Tw {
  constructor(v) { this.a = this.b = this.v = v; this.t0 = 0; this.d = 0; }
  to(b, d, delay = 0) { this.a = this.v; this.b = b; this.t0 = simT + delay; this.d = Math.max(0.01, d); return this; }
  set(v) { this.a = this.b = this.v = v; this.d = 0; return this; }
  step() { if (this.d) this.v = this.a + (this.b - this.a) * ss(0, 1, (simT - this.t0) / this.d); return this.v; }
}

/* ------------------------------ scene ------------------------------ */
const SIMPLE = { cloud: 0x0c1019, water: 0x05080f, glass: 0x000000 };
const mats = {};
function matFor(kind) {
  if (mats[kind]) return mats[kind];
  if (kind === 'cloud') {
    // slate rounded blocks, shaded per block in scene.js, plus: a silver edge on the ones near the moon (the light comes
    // from behind them), light bounced up off the lake and the land on the undersides, a thin line along every bevel
    const m = new THREE.MeshLambertMaterial({ color: 0x1c2333 });   // darker than the sky behind
    m.onBeforeCompile = sh => {
      sh.uniforms.uMoonDir = { value: moonDirRef }; sh.uniforms.uNight = cloudNight;
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vCW; varying vec3 vCN;')
        .replace('#include <project_vertex>', `#include <project_vertex>
          vec4 cw = vec4(transformed, 1.);
          vec3 cn = objectNormal;
          #ifdef USE_INSTANCING
            cw = instanceMatrix * cw; cn = mat3(instanceMatrix) * cn;
          #endif
          vCW = (modelMatrix * cw).xyz; vCN = normalize(mat3(modelMatrix) * cn);`);
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vCW; varying vec3 vCN; uniform vec3 uMoonDir; uniform float uNight;')
        .replace('#include <dithering_fragment>', `#include <dithering_fragment>
          vec3 night0 = gl_FragColor.rgb;                                                       // the night touches below fade out by day
          float mm = max(dot(normalize(vCW - cameraPosition), uMoonDir), 0.);
          float bev = smoothstep(.1, .35, 1. - max(max(abs(vCN.x), abs(vCN.y)), abs(vCN.z)));   // 1 on the rounded edges
          // near the moon the bodies stay dark; the edges catch it (a silver line), a little more the closer to the moon
          float upEdge = bev * smoothstep(-.1, .6, vCN.y);                                     // upper edges only
          gl_FragColor.rgb += vec3(.55, .65, .85) * (upEdge * (pow(mm, 20.) * .16 + pow(mm, 6.) * .015) + pow(mm, 200.) * .02);   // wider silver edges round the moon
          // bounce off the lake and the land: the undersides (and the lower bevels) glow a cool blue, more under the
          // clouds near the moon, where the lake below throws its moonlight back up
          float under = smoothstep(-.15, .9, -vCN.y);
          gl_FragColor.rgb += vec3(.0065, .0095, .017) * under * (1. + pow(mm, 10.) * 1.5);   // seen from below: the undersides are most of what shows
          gl_FragColor.rgb += vec3(.002, .003, .005) * upEdge;                       // the bevels catch a little sky
          gl_FragColor.rgb = mix(night0, gl_FragColor.rgb, uNight);`);
    };
    return (mats[kind] = m);
  }
  if (kind in SIMPLE) return (mats[kind] = new THREE.MeshLambertMaterial({ color: SIMPLE[kind] }));
  return (mats[kind] = blockMaterial(kind));
}
const moonDirRef = new THREE.Vector3(0, 1, 0);   // towards whichever of the moon / sun lights the scene (clouds read it)
const cloudNight = { value: 1 };                  // 1 at night: the clouds' moon-edge and bounce touches
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.autoClear = false;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b1222, 0.010);
const world = buildScene(matFor);
scene.add(world.root);
const W2 = p => new THREE.Vector3(...mirror(p));             // layout point → world

// emissive things are HDR so the bloom finds them
for (const m of [mats.lit_window].filter(Boolean)) { m.emissiveIntensity = 2.2; }
world.lantern.userData.glow.emissiveIntensity = 3.0;
for (const t of world.torches) t.traverse(o => { if (o.isMesh) o.material.emissiveIntensity = 3.5; });

// sky, moon, sun, clouds
// moonDir: towards the light that is up (moon at night, sun by day), recomputed with the time of day (see sky time below)
const moonDir = W2(LAYOUT.moon).sub(W2(CAM.pos)).normalize();
moonDirRef.copy(moonDir);
const dome = sky(moonDir); scene.add(dome);
// the moon's cells must read through exposure + tone curve: kept under 1, the rim and the sky's halo do the glowing.
// Both bodies sit 380 out (behind every cloud layer, so the clouds drift across them), scaled to keep their size
const BODY_DIST = 380;
const body = (tex, col) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: texture(tex), color: col, fog: false }));
  m.scale.setScalar(0.8 * BODY_DIST / 100); scene.add(m); return m;   // ×1.6 (Fable #4)
};
const moon = body('moon', new THREE.Color(0.8, 0.84, 0.92));
const sun = body('sun', new THREE.Color(1.5, 1.4, 1.2));                 // over 1: the sun blooms

// lights: moonlight (shadowed: it falls into the cabin only through the panes), a dim navy sky fill, the lantern,
// a warm spill from the room onto the creeper's face, two lamps on the far shore
const hemi = new THREE.HemisphereLight(0x2a3d60, 0x0b0907, 0.7); scene.add(hemi);
const room = new THREE.PointLight(0xff9a50, 6, 0, 2);                    // the lantern's light bounced around the room
// by day, the grey daylight coming in through the big window and bouncing round the room
const dayFill = new THREE.PointLight(0xc8d6ea, 0, 0, 1.4); dayFill.position.copy(W2([0.5, 3.2, 1.6])); scene.add(dayFill);
room.position.copy(W2([-3.2, 2.6, 0.8])); scene.add(room);
const moonL = new THREE.DirectionalLight(0x9db4e8, CONFIG.moon);
moonL.position.copy(W2([-0.5, 1, 6])).addScaledVector(moonDir, 60); moonL.target.position.copy(W2([-0.5, 1, 6]));
moonL.castShadow = true; moonL.shadow.mapSize.set(2048, 2048);
Object.assign(moonL.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 20, far: 110 });
moonL.shadow.bias = -0.0006; moonL.shadow.normalBias = 0.02;
scene.add(moonL, moonL.target);
// shadows: only what is near the window casts (the cabin, the porch, the creeper) — the terrain casting cost ~17 ms on
// an iGPU; and the map is redrawn at ~10 Hz, enough for a creeper that barely moves
world.exterior.traverse(o => { if (o.isInstancedMesh && !/stone_bricks|cobblestone/.test(o.name)) o.castShadow = false; });
renderer.shadowMap.autoUpdate = false; renderer.shadowMap.needsUpdate = true;
let shadowT = 0;
const lampL = new THREE.PointLight(0xffa04a, CONFIG.lantern, 0, 2);
lampL.position.copy(W2([LAYOUT.lantern[0], LAYOUT.lantern[1] + 0.3, LAYOUT.lantern[2]])); scene.add(lampL);
// the lantern's light falling out through the glass onto the main creeper: warm, from its lantern side — the brightest
// creeper in the frame; the rest get less (Fable #1)
const spill = new THREE.SpotLight(0xffc896, 11, 0, 0.42, 1, 2);
spill.position.copy(W2([0.6, 2.3, 1.4])); spill.target.position.copy(W2([-0.85, 3.0, 4.6])); scene.add(spill, spill.target);
const deckSpill = new THREE.SpotLight(0xffb070, 2.2, 0, 0.6, 1, 2);   // the room's light, weaker, on the crowd outside the right pane
deckSpill.position.copy(W2([2.5, 2.6, 1.2])); deckSpill.target.position.copy(W2([4.6, 2.2, 5.2])); scene.add(deckSpill, deckSpill.target);
const shore = [[3.5, 1.6, 40.2], [35.5, 1.6, 25.2]].map(p => { const l = new THREE.PointLight(0xffa850, 6, 0, 2); l.position.copy(W2(p)); scene.add(l); return l; });

// rain, outside only (from just beyond the glass to the far shore)
const rainBox = new THREE.Box3(new THREE.Vector3(-30, -1, 3.6), new THREE.Vector3(8, 16, 40));    // world x = -layout x
const rainMesh = rain(rainBox, 4500); scene.add(rainMesh);   // half as many as before: the glass carries the rain (Fable #3)

// water + glass
const waterFx = water(world.water, [256, 256]);
waterFx.mat.uniforms.uMoonDir.value = moonDir;                            // shared: follows the moon / sun
const glassMat = glassMaterial();
world.glass.traverse(o => { if (o.isMesh) o.material = glassMat; });
const glassScene = new THREE.Scene(); glassScene.add(world.glass);
const black = new THREE.MeshBasicMaterial({ color: 0x000000 });

// the creeper: one green it can glow with, shared by all its faces
const cr = world.creeper, CU = cr.userData;
// it lives under the mirrored root, so its position / turns are in layout space (+x = screen right)
const CREEP_HOME = new THREE.Vector3(...LAYOUT.creeper), CREEP_AWAY = new THREE.Vector3(-9.5, 1, 4.6);
cr.traverse(o => { if (o.isMesh) for (const m of [].concat(o.material)) m.emissive = new THREE.Color(0); });
const crMats = []; cr.traverse(o => { if (o.isMesh) crMats.push(...[].concat(o.material)); });

/* ------------------------------ render targets + passes ------------------------------ */
const sceneRT = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, depthBuffer: true });
sceneRT.depthTexture = new THREE.DepthTexture(4, 4, THREE.UnsignedIntType);
const maskRT = new THREE.WebGLRenderTarget(4, 4, { depthBuffer: true });
const mistRT = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, depthBuffer: false, generateMipmaps: true,
  minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter });
const mist = fullscreen(MIST_FRAG, {
  tColor: { value: sceneRT.texture }, tDepth: { value: sceneRT.depthTexture }, uInvProj: { value: new THREE.Matrix4() },
  uCamWorld: { value: new THREE.Matrix4() }, uCamPos: { value: new THREE.Vector3() }, uMoonDir: { value: moonDir },
  uT: { value: 0 }, uDens: { value: 0.02 }, uWinZ: { value: LAYOUT.wallZ + LAYOUT.wallDepth + 0.05 }, uWaterY: { value: WATER_Y },
  uFlash: { value: 0 }, uScat0: { value: new THREE.Color(.018, .028, .050) }, uScat1: { value: new THREE.Color(.07, .09, .14) } });
const comp = fullscreen(COMP_FRAG, {
  tColor: { value: mistRT.texture }, tDepth: { value: sceneRT.depthTexture }, tMask: { value: maskRT.texture },
  uRes: { value: new THREE.Vector2() }, uNear: { value: 0.05 }, uFar: { value: 600 }, uFocus: { value: 6 },
  uAperture: { value: CONFIG.aperture }, uT: { value: 0 }, uExposure: { value: CONFIG.exposure },
  uLamp: { value: new THREE.Vector2() }, uLampGlow: { value: 1 }, uCreeper: { value: new THREE.Vector2() },
  uCreeperGlow: { value: 0 }, uCreeperCol: { value: new THREE.Color(0.3, 1, 0.35) },
  uMoon: { value: new THREE.Vector2() }, uMoonGlow: { value: 1 }, uGlowCol: { value: new THREE.Color(.22, .32, .55) },
  uContrast: { value: CONFIG.contrast }, uSat: { value: CONFIG.saturation }, uBlack: { value: CONFIG.black } });

const cam = new THREE.PerspectiveCamera(CAM.fov, 16 / 9, 0.05, 600);
function aim() { cam.position.set(...mirror(CAM.pos)); cam.fov = CAM.fov; cam.lookAt(...mirror(CAM.look)); cam.updateProjectionMatrix(); }
aim();

/* ------------------------------ the crowd ------------------------------ */
// near the window (with the main creeper, six): one on the porch behind it, one peeking in at the left edge, three on
// the deck outside the right pane; they run in along the deck from the sides. Further out: fifteen on the land across
// the water, picked where the window shows them, spread apart; they run out of the forest.
const NEAR = [
  // (from: where they start on the porch / deck — its ends, x −6 and 10.5, so nobody runs over the water)
  { pos: [-3.7, 1, 6.6], scale: 1.6, from: -6, delay: 0.5 }, { pos: [-2.9, 1, 4.7], scale: 1.75, from: -6, delay: 1.1 },
  { pos: [3.9, 1, 5.0], scale: 1.45, from: 10.5, delay: 0.2 }, { pos: [4.7, 1, 5.7], scale: 1.35, from: 10.5, delay: 0.8 },
  { pos: [5.4, 1, 4.7], scale: 1.45, from: 10.5, delay: 1.4 },   // on the two-deep deck   // a knot on the right of the right pane (screen x ≈ 79–96 %)
];
const onDeck = (x, z) => x > -7 && x < 11 && z < (x <= 2 ? 7 : 6);
const groundAt = (x, z) => onDeck(x, z) ? 1 : Math.max(groundH(Math.floor(x), Math.floor(z)), WATER_Y);
const crowdSpots = (() => {
  const spots = NEAR.map(s => ({ pos: s.pos, scale: s.scale, start: [s.from, 1, s.pos[2]], delay: s.delay, near: true }));
  cam.updateMatrixWorld();
  const rnd = (() => { let a = 20261029; return () => ((a = (a * 1664525 + 1013904223) >>> 0) / 4294967296); })();
  const cand = [], P = new THREE.Vector3();
  for (let i = 0; i < 900; i++) {
    const x = -24 + rnd() * 70, z = 10 + rnd() * 45, h = groundH(Math.floor(x), Math.floor(z));   // this shore and the far one
    if (h < 1) continue;                                                   // water
    // smallish, and the whole creeper below the far shore's line (~47 % down): the far bank, its lamps and the lake
    // behind them stay in view (Fable #2)
    const sc = 1.0 + rnd() * 0.35;
    P.set(...mirror([x, h + 1.625 * sc, z])).project(cam);
    const sx = (P.x + 1) / 2, headY = (1 - P.y) / 2;
    P.set(...mirror([x, h, z])).project(cam);
    const feetY = (1 - P.y) / 2;
    if (headY < 0.47 || feetY > 0.72 || sx < 0.53 || sx > 0.76) continue;  // the open part of the right pane (the near ones take the rest)
    cand.push([x, h, z, sx, headY, Math.log(Math.hypot(x - CAM.pos[0], z - CAM.pos[2])), sc]);
  }
  // nothing in the way (trees, huts, the far bank): a ray from the camera to the head and one to the middle
  const occluders = []; world.root.updateMatrixWorld(true);
  world.root.traverse(o => { if (o.isInstancedMesh && !/clouds|ridge/.test(o.name)) occluders.push(o); });
  const rc = new THREE.Raycaster(), O = cam.position.clone(), Dv = new THREE.Vector3();
  const clear = (x, y, z) => { P.set(...mirror([x, y, z])); Dv.subVectors(P, O); const d = Dv.length(); rc.set(O, Dv.normalize()); rc.far = d - 0.6;
    rc.near = 4; return rc.intersectObjects(occluders, false).length === 0; };
  for (let k = cand.length - 1; k >= 0; k--) { const [x, h, z] = cand[k]; if (!clear(x, h + 2.2, z) || !clear(x, h + 1.0, z)) cand.splice(k, 1); }
  const far = [];
  while (far.length < 10 && cand.length) {                                 // (10: fewer, so the view across the water stays open)                                 // farthest-point picks on screen: spread out
    let best = 0, bd = -1;
    // spread across the pane and in depth (log distance): a few close on this shore, more out on the far one
    cand.forEach((c, k) => { const d = far.length ? Math.min(...far.map(f => Math.hypot(f[3] - c[3], (f[5] - c[5]) * 0.18))) : rnd(); if (d > bd) { bd = d; best = k; } });
    far.push(cand.splice(best, 1)[0]);
  }
  far.sort((a, b) => Math.hypot(a[0] - CAM.pos[0], a[2] - CAM.pos[2]) - Math.hypot(b[0] - CAM.pos[0], b[2] - CAM.pos[2]));   // nearer ones come out first
  far.forEach(([x, h, z, , , , sc], k) => {
    const ax = x - CAM.pos[0], az = z - CAM.pos[2], al = Math.hypot(ax, az);
    // the way in follows the land: from the left, the right or from behind (out of the trees), whichever runs on dry
    // ground the whole way and keeps off the porch; the side the creeper ends up on (on screen) is tried first
    const land = (px, pz) => groundH(Math.floor(px), Math.floor(pz)) >= 1 && !(pz < 8 && px > -7 && px < 11);
    const dryPath = (sx, sz) => { for (let i = 0; i <= 16; i++) if (!land(sx + (x - sx) * i / 16, sz + (z - sz) * i / 16)) return false; return true; };
    const left = [x - 11 - rnd() * 4, z + (rnd() - 0.5) * 6], right = [x + 11 + rnd() * 4, z + (rnd() - 0.5) * 6];
    const back = [x + ax / al * 10, z + az / al * 10];
    const order = x < 6 ? [left, back, right] : [right, back, left];
    const from = order.find(([sx, sz]) => dryPath(sx, sz)) || [x + ax / al * 3, z + az / al * 3];   // nowhere dry: step out from just behind
    spots.push({ pos: [x, h, z], scale: sc, near: false, delay: 0.8 + k * 0.22 + rnd() * 0.3,
      start: [from[0], groundAt(from[0], from[1]), from[1]], via: from === left ? 'left' : from === right ? 'right' : 'back' });
  });
  return spots;
})();
const crowd = creeperCrowd(world.exterior, crowdSpots);

// lamps on the far shore (Fable #2: the warm lights across the water that say people live there, each with a long
// reflection on the lake): lantern posts on the water's edge, where the right pane shows them, spread out
const shoreLamps = (() => {
  const rnd = (() => { let a = 7101; return () => ((a = (a * 1664525 + 1013904223) >>> 0) / 4294967296); })();
  const cand = [], P = new THREE.Vector3();
  for (let i = 0; i < 1500; i++) {
    const x = -10 + rnd() * 60, z = 22 + rnd() * 40, xi = Math.floor(x), zi = Math.floor(z), h = groundH(xi, zi);
    if (h < 1 || ![[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => groundH(xi + a, zi + b) < 1)) continue;   // on land, next to water
    P.set(...mirror([xi + 0.5, h + 2.2, zi + 0.5])).project(cam);
    const sx = (P.x + 1) / 2, sy = (1 - P.y) / 2;
    if (sx < 0.55 || sx > 0.97 || sy < 0.36 || sy > 0.62) continue;
    cand.push([xi + 0.5, h, zi + 0.5, sx]);
  }
  const pick = [];
  while (pick.length < 6 && cand.length) {
    let best = 0, bd = -1;
    cand.forEach((c, k) => { const d = pick.length ? Math.min(...pick.map(p => Math.abs(p[3] - c[3]))) : rnd(); if (d > bd) { bd = d; best = k; } });
    pick.push(cand.splice(best, 1)[0]);
  }
  return pick.map(([x, h, z]) => {
    const g = new THREE.Group(); g.position.set(x, h, z);
    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.25, 2.0, 0.25), matFor('oak_log')); pole.position.y = 1; g.add(pole);
    const l = lantern(); l.scale.setScalar(3.2); l.position.y = 2.0; g.add(l);

    document.getElementById('hud').textContent =
      `state ${stateName}${pending ? ' (→' + pending + ')' : ''}  here ${act.here.v.toFixed(2)}  fuse ${act.fuse.v.toFixed(2)}\n` +
      `rain ${knob.rain.v.toFixed(2)}  mist ${knob.mist.v.toFixed(3)}  wet ${knob.wet.v.toFixed(2)}\nfps ${fps.toFixed(1)}  res ${W}×${H}`;
}
function start() { if (!raf) { lastT = now(); raf = requestAnimationFrame(frame); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }
let hostPaused = false;
document.addEventListener('visibilitychange', () => (document.hidden || hostPaused ? stop() : start()));
window.wpPause = on => { hostPaused = !!on; if (hostPaused) stop(); else if (!document.hidden) start(); };
if (!document.hidden) start();

if (QS.get('ref')) {
  const ref = document.getElementById('ref');
  ref.src = QS.get('ref'); ref.style.display = 'block'; ref.style.opacity = QS.get('a') ?? 0.5;
  if (QS.get('blend')) ref.style.mixBlendMode = QS.get('blend');
}
// testing hooks (themes/demo.html and docs/錄製 look for window.theme)
window.theme = {
  requestState, applyState, STATES, PARAMS, CONFIG, THREE, scene, cam, CAM, aim, world, moon, sun, tod, renderer, knob, act, crowd, crowdSpots,
  get crowdT() { return crowdT; }, set crowdT(v) { crowdT = v; },
  setSessions(a) { sessionsOverride = a ? Array.from({ length: 5 }, (_, i) => a[i] || null) : null; poll(); },
  strike() { bolt = 1; },                                       // far lightning now (recordings)
  advance(sec, dt = 1 / FPS) { for (let t = 0; t < sec; t += dt) update(dt); render(); },
  frame(dt = 1 / FPS) { update(dt); render(); },
  bench(n = 90) {
    const gl = renderer.getContext(), px = new Uint8Array(4), t = [];
    const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    for (let i = 0; i < 30; i++) { update(1 / FPS); render(); sync(); }
    for (let i = 0; i < n; i++) { const a = performance.now(); update(1 / FPS); render(); sync(); t.push(performance.now() - a); }
    t.sort((x, y) => x - y);
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    return { avg: t.reduce((x, y) => x + y) / n, p95: t[Math.floor(n * 0.95)], size: [W, H], gpu: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '?' };
  },
  get state() { return stateName; }, get simT() { return simT; },
};
