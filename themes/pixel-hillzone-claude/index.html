<!doctype html>
<html><head><meta charset="utf-8"><title>十六位像素熱帶丘陵・Claude</title>
<style>html,body{margin:0;height:100%;background:#1975fc;overflow:hidden}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}</style>
</head><body><canvas id="c"></canvas>
<script>
/* 十六位像素熱帶丘陵・Claude（2026-10-21）
   Real low-res pixel art: everything is drawn into a 480×270 buffer of palette indices and blown up with
   nearest-neighbour. Organic pieces (cliffs with falls, palms, far range, islands, bushes, clouds) are
   Codex-generated sprites snapped to the logical grid and to palette.json by studio/blender/pixel_key.py;
   sky, lagoon, checkered hills and the sunflowers are drawn here.
   Animation is palette work, as on 16-bit hardware: water glints and waterfalls are palette cycling;
   the states (overcast / storm / evening / night / lightning) are palette transforms, not grey overlays.
   Lighting (2026-10-23): each sprite has a normal map from Sprite Fusion's Sprite Normals (normals/<name>_n.png).
   A pixel turned to the sun swaps to a lit copy of its colour, one turned away to a shaded copy; the sun walks
   across the sky with the clock. At night every session's sunflower is a warm lamp lighting its neighbours. */
'use strict';
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const Q = new URLSearchParams(location.search);
const LW = 480, LH = 270, T_ = 255;                 // T_ = transparent index

const STATES = {   // desat · dark · warm (evening) · clouds (extra) · rain · rainbow · wind
  clear:    { desat: 0.00, dark: 0.00, warm: 0.00, clouds: 0.0, rain: 0, rainbow: 0, wind: 0.3 },
  overcast: { desat: 0.55, dark: 0.12, warm: 0.00, clouds: 1.0, rain: 0, rainbow: 0, wind: 0.5 },
  storm:    { desat: 0.70, dark: 0.35, warm: 0.00, clouds: 1.0, rain: 1, rainbow: 0, wind: 1.0 },
  clearing: { desat: 0.00, dark: -0.04, warm: 0.00, clouds: 0.3, rain: 0, rainbow: 1, wind: 0.2 },
  waiting:  { desat: 0.10, dark: 0.05, warm: 1.00, clouds: 0.3, rain: 0, rainbow: 0, wind: 0.2 },
};
const SESSION = { clear: 'sway', overcast: 'bow', storm: 'spin', clearing: 'sparkle', waiting: 'face' };
const CONFIG = { polling: true, clockHours: Q.has('hour') ? +Q.get('hour') : Q.has('day') ? 10.5 : Q.has('night') ? 22 : null, fps: 30 };
const PARAMS = { ...STATES.clear, flash: 0, night: 0 };
let target = { ...STATES.clear }, sessions = [null, null, null, null, null];
const FLOWERS = [{ x: 300 }, { x: 328 }, { x: 356 }, { x: 384 }, { x: 412 }];   // stem x; they stand on the hill top
const FLOWER_Y = 183;
const flowerLv = FLOWERS.map(() => ({ on: 0, s: null, rot: 0 }));

// ---------------------------------------------------------------- palette
let BASE = [];                       // [r,g,b] for the 48 fitted colours
const PAL = new Uint8Array(512 * 3); // current frame palette
const LIT0 = 256, SH0 = 304, DSH0 = 352, LAMP0 = 400, LAMPS0 = 448;   // lit / shaded / lamp-lit copies of the 48 fitted colours
let IDX = new Map();                 // '#rrggbb' → index
const near = hex => { const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); let b = 0, bd = 1e9;
  BASE.forEach((p, i) => { const d = (p[0] - c[0]) ** 2 * 0.3 + (p[1] - c[1]) ** 2 * 0.59 + (p[2] - c[2]) ** 2 * 0.11; if (d < bd) { bd = d; b = i; } }); return b; };
// cycling ranges (indices above the fitted palette)
const WATER0 = 64, FALL0 = 128, FOAM0 = 176;        // water: band*8+phase · fall: level*8+phase · foam: phase
const GLOW_FLY = 200, GLOW_STAR = 201;              // fireflies and stars: untouched by the night palette
let WATER_BANDS = [], WATER_HI = [], FALL_LEVELS = [];

function tf(c, out, o) {             // the state palette transform
  let [r, g, b] = c;
  const l = 0.299 * r + 0.587 * g + 0.114 * b;
  const ds = PARAMS.desat; r = l + (r - l) * (1 - ds); g = l + (g - l) * (1 - ds); b = l + (b - l) * (1 - ds);
  const w = PARAMS.warm;             // evening: warm light, pink-orange sky, deeper shadows
  r = r * (1 + 0.18 * w) + 18 * w; g = g * (1 - 0.06 * w) + 4 * w; b = b * (1 - 0.30 * w);
  const dk = PARAMS.dark; r *= 1 - dk; g *= 1 - dk; b *= 1 - dk * 0.8;
  const n = PARAMS.night;            // moonlit: towards deep indigo, keeps a little of the hue
  r = r * (1 - 0.8 * n) + (l * 0.22 + 10) * 0.8 * n; g = g * (1 - 0.8 * n) + (l * 0.32 + 18) * 0.8 * n; b = b * (1 - 0.8 * n) + (l * 0.55 + 56) * 0.8 * n;
  const f = PARAMS.flash; r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f;
  out[o] = r < 0 ? 0 : r > 255 ? 255 : r; out[o + 1] = g < 0 ? 0 : g > 255 ? 255 : g; out[o + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
}
function buildPalette(t) {
  for (let i = 0; i < BASE.length; i++) tf(BASE[i], PAL, i * 3);
  const ph = Math.floor(t * 7) & 7;                       // water glints: a dash lights up on its phase
  WATER_BANDS.forEach((bi, b) => { for (let p = 0; p < 8; p++) {
    const k = (p - ph) & 7; const c = k === 0 ? WATER_HI[b] : k === 1 ? WATER_BANDS[Math.max(0, b - 1)] : bi;
    tf(BASE[c], PAL, (WATER0 + b * 8 + p) * 3); } });
  const fp = Math.floor(t * 14) & 7, WAVE = [0, 1, 1, 0, 0, -1, -1, 0];   // falls: light bands sliding down
  FALL_LEVELS.forEach((_, lv) => { for (let p = 0; p < 8; p++) {
    const k = Math.max(0, Math.min(FALL_LEVELS.length - 1, lv + WAVE[(p - fp) & 7])); tf(BASE[FALL_LEVELS[k]], PAL, (FALL0 + lv * 8 + p) * 3); } });
  const sp = Math.floor(t * 10);
  for (let p = 0; p < 8; p++) tf(BASE[((p + sp) % 3) ? FALL_LEVELS[FALL_LEVELS.length - 1] : FALL_LEVELS[FALL_LEVELS.length - 2]], PAL, (FOAM0 + p) * 3);
  const n = PARAMS.night;
  for (let i = 0; i < BASE.length; i++) { const [r, g, b] = BASE[i];
    tf([r * 1.10 + 12, g * 1.06 + 8, b * 0.96], PAL, (LIT0 + i) * 3);       // facing the sun: warmer, brighter
    tf([r * 0.74, g * 0.76, b * 0.88], PAL, (SH0 + i) * 3);                 // turned away: cooler
    tf([r * 0.54, g * 0.56, b * 0.74], PAL, (DSH0 + i) * 3);
    PARAMS.night = n * 0.15; tf([r * 1.25 + 30, g + 12, b * 0.6], PAL, (LAMP0 + i) * 3);   // flower lamps: the night palette barely touches them
    PARAMS.night = n * 0.55; tf([r * 1.1 + 14, g * 0.92 + 4, b * 0.7], PAL, (LAMPS0 + i) * 3);
    PARAMS.night = n; }
  tf([0, 0, 0], PAL, T_ * 3);
  const fl = PARAMS.flash; PAL.set([200 + 55 * fl, 255, 90 + 165 * fl], GLOW_FLY * 3); PAL.set([235, 240, 255], GLOW_STAR * 3);
}

// ---------------------------------------------------------------- helpers
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
function blit(dst, spr, x0, y0, flip = false, fn = null) {   // spr: {w,h,px: Uint8Array of indices}
  for (let y = 0; y < spr.h; y++) { const Y = y0 + y; if (Y < 0 || Y >= LH) continue;
    for (let x = 0; x < spr.w; x++) { const X = x0 + x; if (X < 0 || X >= LW) continue;
      const v = spr.px[y * spr.w + (flip ? spr.w - 1 - x : x)]; if (v === T_) continue;
      if (fn && !fn(X, Y)) continue; dst[Y * LW + X] = v; } } }
const loadImg = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
function toSprite(im) {
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0); const d = g.getImageData(0, 0, im.width, im.height).data;
  const px = new Uint8Array(im.width * im.height);
  for (let i = 0; i < px.length; i++) { if (d[i * 4 + 3] < 128) { px[i] = T_; continue; }
    const hex = '#' + [0, 1, 2].map(k => d[i * 4 + k].toString(16).padStart(2, '0')).join('');
    px[i] = IDX.has(hex) ? IDX.get(hex) : near(hex); }
  let sx = 0, n = 0;                                         // foot: centre of the bottom rows
  for (let y = im.height - 3; y < im.height; y++) for (let x = 0; x < im.width; x++) if (px[y * im.width + x] !== T_) { sx += x; n++; }
  return { w: im.width, h: im.height, px, foot: n ? sx / n : im.width / 2 };
}

function toNormals(im) {     // Sprite Normals output (OpenGL, +G up) -> [nx, ny] per pixel, x100
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0); const d = g.getImageData(0, 0, im.width, im.height).data;
  const n = new Int8Array(im.width * im.height * 2);
  for (let i = 0; i < im.width * im.height; i++) { n[i * 2] = Math.round((d[i * 4] / 127.5 - 1) * 100); n[i * 2 + 1] = Math.round((d[i * 4 + 1] / 127.5 - 1) * 100); }
  return n;
}
const SUN = { x: -0.4, y: 0.8, z: 0.45, k: 1, px: 42, py: 26 };
function shade(v, nx, ny, dx, dy) {   // colour index -> its lit / shaded copy by how far the normal turns towards the sun
  if (v >= BASE.length || SUN.k < 0.02) return v;
  const nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
  const d = (nx * SUN.x + ny * SUN.y + nz * SUN.z - SUN.z) * SUN.k + (bayer(dx, dy) - 0.5) * 0.1;
  return d > 0.2 ? LIT0 + v : d < -0.42 ? DSH0 + v : d < -0.18 ? SH0 + v : v;
}

// ---------------------------------------------------------------- scene
// layout, measured off the target at 480×270: [sprite, x of its foot (bottom-row centre), bottom y, flip, haze]
const BACK_SPRITES = [       // in front of the sky and clouds, behind the hills
  ['far_range', 196, 151, false, 0.22],
  ['arch_isle', 40, 152, false, 0.12],
  ['islet_b', 118, 153, false, 0.10], ['islet_a', 228, 161, false, 0], ['islet_a_s', 268, 151, true, 0.15],
  ['cliffs_falls', 386, 142],
  ['rock_near', 168, 241, false, 0], ['rock_near_s', 222, 240, true, 0],
];
const MID_SPRITES = [        // on the hills, behind the flowers
  ['bush_a_s', 64, 211], ['palm_small', 44, 212],
  ['bush_a', 276, 176], ['palm_tall', 277, 177],
  ['palm_short', 484, 189, true], ['palm_tall_xl', 452, 187],
  ['bush_b', 120, 234],
];
const FRONT_SPRITES = [      // in front of the flowers
  ['bush_a', 446, 188], ['bush_a', 222, 247, true], ['bush_a_s', 14, 271], ['bush_b', 330, 271, true],
];
const CLOUDS = [             // [sprite, x, top y, px per second, needs extra clouds (overcast)]
  ['cloud_mid', 40, 84, 0.8, 0], ['cloud_mid', 110, 88, 0.8, 0], ['cloud_mid', 180, 86, 0.8, 0], ['cloud_mid', 250, 90, 0.8, 0],   // bank on the horizon
  ['cloud_xl', 150, 30, 1.2, 0], ['cloud_big', -10, 58, 1.5, 0], ['cloud_mid', 62, 70, 1.4, 0],
  ['cloud_small', 100, 36, 2.2, 0], ['cloud_small', 330, 16, 1.9, 0], ['cloud_small', 230, 22, 2.0, 0], ['cloud_small', 20, 40, 2.1, 0],
  ['cloud_big', 330, 10, 1.0, 0.4], ['cloud_mid', 250, 48, 1.3, 0.2], ['cloud_big', 40, 20, 1.1, 0.7], ['cloud_mid', 410, 60, 1.5, 0.5],
];
const SPR = {};
let SKY_ROWS = [], BACK = null, HORIZON = 149, LAGOON = 139;
const HILLS = [              // drawn into BACK after the back sprites, in order (measured off the target at 480×270)
  { x0: -6, x1: 28, top: 160, face: false, cell: 12 },                       // left column
  { x0: -6, x1: 95, top: 210, round: 4 },                                    // left ledge
  { x0: 70, x1: 186, top: 232, round: 5, face: true },                       // middle ledge
  { x0: 243, x1: 284, top: 174, round: 3, face: true },                      // big hill: front lip
  { x0: 272, x1: 486, top: 182, openRight: true },                           // big hill: flower terrace
  { x0: 140, x1: 330, top: 243, round: 8, curve: x => ((x - 236) / 92) ** 2 * 20, grass: 12 },   // front mound
];

function drawHill(buf, h) {  // {x0, x1, top, grass: 9, round: 5, face: bool}
  const C = (hex) => near(hex);
  const SOIL_A = C('#c65315'), SOIL_B = C('#79271b'), SOIL_HI = C('#cc7b40'), SOIL_SH = C('#4a1a19'), OUT = C('#290c17');
  const SOIL_M = C('#a23d15'), SOIL_D = C('#641e17');
  const G0 = C('#a1ec14'), G1 = C('#5cc923'), G2 = C('#279f23'), G3 = C('#13691f'), G4 = C('#094320');
  for (let x = h.x0; x <= h.x1; x++) {
    if (x < 0 || x >= LW) continue;
    const dl = x - h.x0, dr = h.x1 - x;
    let top = h.top + (h.curve ? Math.round(h.curve(x)) : 0);
    const rnd = h.round || 0; const cut = Math.min(dl, dr) < rnd ? Math.round(rnd - Math.sqrt(Math.max(0, rnd * rnd - (rnd - Math.min(dl, dr)) ** 2))) : 0;
    top += cut;
    const blade = (x % 3 === 0 ? 2 : x % 3 === 1 ? 1 : 0) - (hash(x, h.top) < 0.25 ? 1 : 0);
    const gEnd = top + (h.grass ?? 9) + Math.floor(hash(x, 7) * 4) + (x % 4 === 1 ? 2 : 0);   // ragged lower fringe
    for (let y = Math.max(0, top - blade); y < LH; y++) {
      let v;
      const gy = y - top;
      if (y < gEnd) {
        v = gy < 0 ? G1 : gy === 0 ? G0 : gy < 3 ? (hash(x, y) < 0.3 ? G0 : G1) : gy < 6 ? G1 : y >= gEnd - 2 ? G3 : G2;
        if (y === gEnd - 1) v = G4;
        if (h.face && dl < 2 && gy > 1) v = G3;
      } else {
        const sy = y - gEnd;
        if (sy < 2) v = SOIL_SH;
        else { const cs = h.cell || 12; const ck = ((Math.floor((x - h.x0) / cs) + Math.floor((y - h.top) / cs)) & 1);
          const cy = (y - h.top) % cs, cxl = (x - h.x0) % cs, deep = Math.floor((y - h.top) / cs) >= 4;   // whole tile rows darken deeper down
          v = ck ? (deep ? SOIL_D : SOIL_B) : (deep ? SOIL_M : SOIL_A);
          if (!ck && cy === 0 && cxl < cs - 1 && !deep) v = SOIL_HI;                  // lit top edge of the light tiles
          if (!ck && cxl === cs - 1) v = deep ? SOIL_D : SOIL_B;                       // shaded right edge
          if (ck === 0 && (y - h.top) % cs === cs - 1) v = SOIL_B;
          if (h.face && dl < 3) v = dl === 0 ? OUT : SOIL_HI;
          if (h.face && dl >= 3 && dl < 10 && !ck && bayer(x, y) < 0.35) v = SOIL_HI;
          if (dr === 0 && !h.openRight) v = OUT; }
      }
      buf[y * LW + x] = v; if (buf === BACK) BACK_N[(y * LW + x) * 2] = BACK_N[(y * LW + x) * 2 + 1] = 0;
    }
    const fh = hash(x, h.top * 3 + 1);                       // a few little flowers poking out of the grass
    if (fh < 0.07 && dl > 2 && dr > 2 && top > 3) { const fc = near(fh < 0.03 ? '#dae5e8' : fh < 0.05 ? '#e0d763' : '#a95448');
      buf[(top - 2) * LW + x] = fc; buf[(top - 1) * LW + x] = G2; if (fh < 0.02 && x + 1 < LW) buf[(top - 2) * LW + x + 1] = fc; }
  }
}

const waterTop = x => x >= 300 ? LAGOON : x >= 286 ? Math.round(HORIZON + (LAGOON - HORIZON) * (x - 286) / 14) : HORIZON;
function drawWater(buf) {
  for (let y = LAGOON; y < LH; y++) {
    const b = Math.min(WATER_BANDS.length - 1, Math.floor(Math.pow(Math.max(0, y - HORIZON) / (LH - 40 - HORIZON), 0.8) * WATER_BANDS.length));
    for (let x = 0; x < LW; x++) {
      const wt = waterTop(x); if (y < wt) continue;
      let v = WATER_BANDS[Math.max(0, b)];
      if (y < wt + 2) v = near('#96cbf8');                              // bright far shore line
      // glint dashes: short horizontal runs, longer and sparser near the camera
      const len = 2 + Math.max(0, y - HORIZON) / 18, row = Math.floor(x / (len * 3));
      if ((y & 1) && hash(row, y) < 0.5 && (x % Math.ceil(len * 3)) < len) v = WATER0 + Math.max(0, b) * 8 + (Math.floor(hash(row, y + 99) * 8));
      buf[y * LW + x] = v; if (buf === BACK) BACK_N[(y * LW + x) * 2] = BACK_N[(y * LW + x) * 2 + 1] = 0;
    }
  }
}

function markFalls(spr) {    // the light blues / whites inside a cliff sprite become cycling waterfall pixels
  for (let y = 0; y < spr.h; y++) for (let x = 0; x < spr.w; x++) {
    const v = spr.px[y * spr.w + x]; const lv = FALL_LEVELS.indexOf(v); if (lv < 0) continue;
    spr.px[y * spr.w + x] = y > spr.h - 8 && lv >= FALL_LEVELS.length - 2 ? FOAM0 + Math.floor(hash(x, y) * 8) : FALL0 + lv * 8 + (y & 7);
  }
}

function hazed(n, amt) {     // aerial perspective by palette: every colour → the palette colour nearest to it mixed with haze
  const s = SPR[n]; if (!s) return null; const H = [150, 190, 240], map = new Map();
  const px = s.px.map(v => { if (v >= BASE.length) return v; if (!map.has(v)) { const c = BASE[v].map((k, i) => Math.round(k + (H[i] - k) * amt));
    map.set(v, near('#' + c.map(k => k.toString(16).padStart(2, '0')).join(''))); } return map.get(v); });
  return { ...s, px };
}
let WATER_SET = null;
const isWater = v => (WATER_SET ||= new Set([...WATER_BANDS, near('#96cbf8')])).has(v) || (v >= WATER0 && v < FALL0);
function reflectMap() {      // what a colour looks like mirrored in the lagoon: mixed into the water blue, then snapped to the palette
  const m = new Map(), W = [18, 84, 200];
  return v => { if (v >= BASE.length) return v; if (!m.has(v)) { const c = BASE[v].map((k, i) => Math.round(k * 0.38 + W[i] * 0.62));
    m.set(v, near('#' + c.map(k => k.toString(16).padStart(2, '0')).join(''))); } return m.get(v); };
}
let MIST_PTS = [];
let BACK_N = null, BACK_SH = null;   // normals of the baked layer, and the layer shaded for the current sun
function blitN(s, x0, y0, flip, k) {
  for (let y = 0; y < s.h; y++) { const Y = y0 + y; if (Y < 0 || Y >= LH) continue;
    for (let x = 0; x < s.w; x++) { const X = x0 + x; if (X < 0 || X >= LW) continue;
      const j = y * s.w + (flip ? s.w - 1 - x : x); if (s.px[j] === T_) continue;
      BACK_N[(Y * LW + X) * 2] = (flip ? -1 : 1) * s.nrm[j * 2] * k; BACK_N[(Y * LW + X) * 2 + 1] = s.nrm[j * 2 + 1] * k; } } }
function shadeBack() {
  for (let i = 0; i < BACK.length; i++) { const v = BACK[i];
    BACK_SH[i] = v === T_ ? T_ : shade(v, BACK_N[i * 2] / 100, BACK_N[i * 2 + 1] / 100, i % LW, (i / LW) | 0); } }
function bakeLayers() {
  BACK = new Uint8Array(LW * LH).fill(T_); BACK_N = new Int8Array(LW * LH * 2); BACK_SH = new Uint16Array(LW * LH);
  drawWater(BACK);
  const spans = [];
  const place = (buf, list) => { for (const [n, x, y, f, hz] of list) { const s = hz ? hazed(n, hz) : SPR[n]; if (!s) continue;
    const x0 = Math.round(x - (f ? s.w - 1 - s.foot : s.foot)); blit(buf, s, x0, y - s.h, f);
    if (s.nrm) blitN(s, x0, y - s.h, f, 1 - (hz || 0) * 2);       // hazed distance flattens the relief
    spans.push([n, x0, x0 + s.w - 1, y, s]); } };
  place(BACK, BACK_SPRITES);
  for (const h of HILLS) drawHill(BACK, h);
  for (let y = HORIZON + 1; y < LH; y++) for (let x = 1; x < LW - 1; x++) {   // waves lapping at the hill sides
    const i = y * LW + x; if (!isWater(BACK[i])) continue;
    const l = BACK[i - 1], r = BACK[i + 1];
    if ((!isWater(l) && l !== T_ && l < FALL0) || (!isWater(r) && r !== T_ && r < FALL0)) BACK[i] = FOAM0 + Math.floor(hash(x, y) * 8);
  }
  const rm = reflectMap();
  for (const [n, x0, x1, line, s] of spans) {             // broken mirror rows under every island and the cliffs
    const depth = Math.min(Math.round(s.h * (n === 'far_range' ? 0.12 : 0.45)), 34);
    for (let x = Math.max(0, x0); x <= Math.min(LW - 1, x1); x++) for (let k = 1; k <= depth; k++) {
      const dy = line - 1 + k, sy = line - k; if (dy >= LH || sy < 0) continue;
      const di = dy * LW + x, sv = BACK[sy * LW + x];
      if (!isWater(BACK[di]) || sv === T_ || isWater(sv)) continue;
      if (k % 2 === 0 || bayer(x, dy) < (k / depth - 0.35) * 1.6) continue;   // every other row, thinning out
      BACK[di] = sv >= FALL0 ? sv : rm(sv);
    }
    if (n !== 'far_range') for (let x = Math.max(0, x0); x <= Math.min(LW - 1, x1); x++) {   // foam where the rock meets the water
      if (BACK[(line - 1) * LW + x] !== T_ && !isWater(BACK[(line - 1) * LW + x]) && line < LH) BACK[line * LW + x] = FOAM0 + Math.floor(hash(x, line) * 8); }
  }
  MIST_PTS = [];
