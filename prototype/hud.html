<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>VibingWrapper</title>
<!-- 2026-10-01: the pet is just this small strip — AI state + settings, top-right of the screen. -->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none;
    font-family: "Microsoft JhengHei UI", "Segoe UI", sans-serif; }
  #bar { position: fixed; top: 8px; right: 8px; display: flex; align-items: flex-start; gap: 6px; }

  /* ---- AI state: line icon + caption (icons by Codex, design/ai-icons/) ---- */
  /* the AI icon is the centrepiece now: big icon, caption under it */
  #ai { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 6px;
    color: #e6eeff; font-size: 13px; letter-spacing: .1em; }
  #ai svg { width: 64px; height: 64px; overflow: visible; }
  #aiCap { paint-order: stroke; text-shadow: 0 0 4px rgba(8,14,40,.9), 0 0 2px rgba(8,14,40,.9); }
  .icon { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .icon .halo { stroke: rgba(8,14,40,.55); stroke-width: 3.2px; }
  .icon .ink  { stroke: #e6eeff; stroke-width: 1.3px; }
  .icon g { transform-box: fill-box; transform-origin: center; }
  .icon path, .icon circle { stroke-dasharray: 1; }
  .icon.enter path, .icon.enter circle { animation: ic-draw .8s ease-out both; }
  @keyframes ic-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

  .s-overcast .ai-overcast-orbit { animation: ai-orbit 6s linear infinite; }
  .s-overcast .ai-overcast-core  { animation: ai-think 2.4s ease-in-out infinite; }
  .s-storm .ai-storm-bolt        { animation: ai-charge 1.15s ease-in-out infinite; }
  .s-storm .ai-storm-trace path  { stroke-dasharray: .16 .84; animation: ai-trace .9s linear infinite; }
  .s-storm .ai-storm-node-a      { animation: ai-node 1.15s ease-in-out infinite; }
  .s-storm .ai-storm-node-b      { animation: ai-node 1.15s ease-in-out -.58s infinite; }
  .s-clearing .ai-clearing-streams { opacity: .45; }
  .s-clearing .ai-clearing-flow-a path, .s-clearing .ai-clearing-flow-b path, .s-clearing .ai-clearing-flow-c path
                                 { stroke-dasharray: .16 .84; animation: ai-resolve 2.7s ease-in-out infinite; }
  .s-clearing .ai-clearing-flow-b path { animation-delay: -.9s; }
  .s-clearing .ai-clearing-flow-c path { animation-delay: -1.8s; }
  .s-clearing .ai-clearing-core  { animation: ai-arrive 2.7s ease-in-out infinite; }
  .s-waiting .ai-waiting-star    { transform-origin: 12px 12px; animation: ai-wait-star 2.9s ease-in-out infinite; }
  .s-waiting .ai-waiting-ring    { transform-origin: 12px 12px; animation: ai-wait-ring 2.9s ease-out infinite; }
  @keyframes ai-orbit   { to { transform: rotate(360deg); } }
  @keyframes ai-think   { 50% { transform: scale(.82) rotate(12deg); opacity: .68; } }
  @keyframes ai-charge  { 50% { transform: scale(1.035); opacity: .72; } }
  @keyframes ai-trace   { to { stroke-dashoffset: -1; } }
  @keyframes ai-node    { 50% { transform: scale(.66); opacity: .55; } }
  @keyframes ai-resolve { 0% { stroke-dashoffset: 1; opacity: 0; } 35% { opacity: .95; } 75%, 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes ai-arrive  { 0%, 100% { transform: scale(.88); opacity: .62; } 45%, 70% { transform: scale(1); opacity: 1; } }
  @keyframes ai-wait-star { 0%, 100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.06); } }
  @keyframes ai-wait-ring { 0% { opacity: 0; transform: scale(.45); } 35% { opacity: .7; } 100% { opacity: 0; transform: scale(1.05); } }

  /* ---- Settings: gear + data-driven menu (PAGES below) ---- */
  #settings { position: relative; font-size: 13px; color: #17324d; }
  #gear { width: 26px; height: 26px; padding: 4px; border: 0; border-radius: 7px; cursor: pointer;
    background: rgba(8,14,40,.28); color: #e6eeff; opacity: .55; transition: opacity .2s, background .2s; }
  #gear:hover, #settings.open #gear { opacity: 1; background: rgba(255,255,255,.75); color: #17324d; }
  #gear svg { width: 18px; height: 18px; display: block; }
  /* recording: the gear turns red and pulses so you know the screen is being recorded */
  body.recording #gear { opacity: 1; color: #fff; background: #e5484d; animation: rec-pulse 1.4s ease-in-out infinite; }
  @keyframes rec-pulse { 50% { background: #9f2a2e; } }
  #menu { display: none; position: absolute; top: 32px; right: 0; min-width: 176px; max-width: 248px; padding: 6px;
    background: rgba(240,247,255,.95); border: 1px solid rgba(255,255,255,.9); border-radius: 10px;
    box-shadow: 0 6px 20px rgba(10,30,60,.25); }
  #settings.open #menu { display: block; max-height: calc(100vh - 44px); overflow-y: auto; }
  #menu .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
    padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; color: inherit;
    font: inherit; text-align: left; cursor: pointer; white-space: nowrap; }
  #menu .item:hover { background: rgba(120,170,220,.2); }
  #menu .item .val { color: #4a6a88; font-size: 12px; }
  #menu .sep { height: 1px; margin: 4px 6px; background: rgba(23,50,77,.12); }
  #menu .item .nm { overflow: hidden; text-overflow: ellipsis; }
  #menu .item.back { color: #4a6a88; }
  #menu button:focus-visible, #menu input:focus-visible { outline: 2px solid #2f6fae; outline-offset: -2px; }
  #menu .head { padding: 6px 10px 2px; color: #6a86a0; font-size: 11.5px; letter-spacing: .05em; }
  /* a red dot: something new behind this row (設定 → 更新), or on the gear itself */
  #menu .item.dot .nm::after, #gear.dot::after { content: ''; display: inline-block; width: 6px; height: 6px; margin-left: 5px;
    border-radius: 50%; background: #e0533c; vertical-align: top; }
  #gear { position: relative; }
  #gear.dot::after { position: absolute; top: 2px; right: 2px; margin: 0; }
  /* 桌布 page (2026-10-24): wider; search, 最近用過 chips, then every installed theme in two columns */
  #menu.wide { width: 248px; }
  #menu .search { box-sizing: border-box; width: calc(100% - 8px); margin: 4px; padding: 5px 9px; border: 1px solid rgba(23,50,77,.18);
    border-radius: 6px; background: #fff; color: inherit; font: inherit; font-size: 12.5px; }
  #menu .chips { display: flex; gap: 4px; padding: 2px 4px; }
  #menu .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 4px; padding: 2px 4px; max-height: 290px; overflow-y: auto; }
  #menu .tile, #menu .chip { display: flex; align-items: center; gap: 4px; min-width: 0; padding: 5px 6px; border: 0; border-radius: 6px;
    background: transparent; color: inherit; font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; white-space: nowrap; }
  #menu .chip { flex: 1; background: rgba(120,170,220,.12); justify-content: center; }
  #menu .tile:hover, #menu .chip:hover { background: rgba(120,170,220,.25); }
  #menu .tile .tick, #menu .chip .tick { flex: none; width: 10px; color: #2f6fae; }
  #menu .tile .nm, #menu .chip .nm { overflow: hidden; text-overflow: ellipsis; }
  #menu .chip .tick:empty { display: none; }
  /* tour: a box on top of the menu says what the pulsing row is for */
  #menu .coach-box { margin: 2px 2px 6px; padding: 8px 10px; border-radius: 8px; background: #2f6fae; color: #fff; font-size: 12.5px; line-height: 1.5; white-space: normal; }
  #menu .coach-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11.5px; opacity: .9; }
  #menu .coach-row span { flex: 1; }
  #menu .coach-row button { border: 1px solid #fff; border-radius: 5px; padding: 2px 9px; background: #fff; color: #2f6fae; font: inherit; cursor: pointer; }
  #menu .coach-row button.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
  #menu .item.coach { animation: coach-pulse 1.4s ease-in-out infinite; }
  @keyframes coach-pulse { 50% { background: rgba(47,111,174,.22); box-shadow: inset 0 0 0 1px rgba(47,111,174,.5); } }
  /* first launch (2026-10-23, user feedback: 右上角沒注意到): the strip glows a few times + one hint line */
  body.intro #ai, body.intro #gear { animation: intro-glow 1.6s ease-in-out 4; }
  body.intro #gear { opacity: 1; }
  @keyframes intro-glow { 50% { filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px #7fb8ff); } }
  #intro { position: fixed; top: 100px; right: 8px; max-width: 200px; padding: 8px 12px; border-radius: 10px;
    background: rgba(240,247,255,.95); color: #17324d; font-size: 13px; line-height: 1.5;
    box-shadow: 0 6px 20px rgba(10,30,60,.25); cursor: pointer; transition: opacity .6s; }
  #intro::before { content: ''; position: absolute; top: -6px; right: 14px; border: 6px solid transparent;
    border-top: 0; border-bottom-color: rgba(240,247,255,.95); }
  #intro.gone { opacity: 0; }
  /* 還原桌面 (boss key): only a faint gear is left (the way back) */
  body.stealth #ai { display: none; }
  body.stealth #gear { opacity: .35; }
</style>
</head>
<body>
<div id="bar" class="ui-hit">
  <div id="ai" title="Claude 狀態">
    <svg viewBox="0 0 24 24"><g id="aiIcon" class="icon"><g class="halo"></g><g class="ink"></g></g></svg>
    <span id="aiCap">AI</span>
  </div>
  <div id="settings">
    <button id="gear" title="設定" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.3 4.3c.4-1.8 3-1.8 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.4 1.8 3 0 3.4a1.7 1.7 0 0 0-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 0 0-2.5-1c-1.6.9-3.3-.9-2.4-2.4a1.7 1.7 0 0 0-1.1-2.6c-1.8-.4-1.8-3 0-3.4a1.7 1.7 0 0 0 1.1-2.5c-.9-1.6.8-3.3 2.4-2.4a1.7 1.7 0 0 0 2.5-1.1z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <div id="menu" role="menu"></div>
  </div>
</div>

<script>
const IS_APP = !!window.petAPI;

/* ---- AI state (Claude hooks → weather state). 'clear' = idle ---- */
const AI_ICONS = {
  clear: '<g class="ai-clear-core"><path pathLength="1" d="M12 4.5c.7 4.3 3.2 6.8 7.5 7.5-4.3.7-6.8 3.2-7.5 7.5-.7-4.3-3.2-6.8-7.5-7.5 4.3-.7 6.8-3.2 7.5-7.5z"/></g><g class="ai-clear-stars"><path pathLength="1" d="M19 2.5v4M17 4.5h4M5 17.5v3M3.5 19h3"/></g>',
  overcast: '<g class="ai-overcast-orbit"><path pathLength="1" d="M3.5 12c0-3.2 3.8-5.7 8.5-5.7s8.5 2.5 8.5 5.7-3.8 5.7-8.5 5.7S3.5 15.2 3.5 12z"/><circle pathLength="1" cx="3.5" cy="12" r="1.15"/><circle pathLength="1" cx="20.5" cy="12" r="1.15"/></g><g class="ai-overcast-core"><path pathLength="1" d="M12 8c.4 2.3 1.7 3.6 4 4-2.3.4-3.6 1.7-4 4-.4-2.3-1.7-3.6-4-4 2.3-.4 3.6-1.7 4-4z"/></g>',
  storm: '<g class="ai-storm-links"><path pathLength="1" d="M5.8 7.6 9 10M15.4 14l2.8 2.3"/></g><g class="ai-storm-node-a"><circle pathLength="1" cx="5" cy="7" r="1.1"/></g><g class="ai-storm-node-b"><circle pathLength="1" cx="19" cy="17" r="1.1"/></g><g class="ai-storm-bolt"><path pathLength="1" d="M13.5 2.5 7 12h4.6l-1.1 9.5 6.8-11H13z"/><g class="ai-storm-trace"><path pathLength="1" d="M13.5 2.5 7 12h4.6l-1.1 9.5 6.8-11H13z"/></g></g>',
  clearing: '<g class="ai-clearing-streams"><path pathLength="1" d="M2.5 8.5c4.6 0 7.8 1 11.4 2.5M2.5 12H14M2.5 15.5c4.6 0 7.8-1 11.4-2.5"/></g><g class="ai-clearing-flow-a"><path pathLength="1" d="M2.5 8.5c4.6 0 7.8 1 11.4 2.5"/></g><g class="ai-clearing-flow-b"><path pathLength="1" d="M2.5 12H14"/></g><g class="ai-clearing-flow-c"><path pathLength="1" d="M2.5 15.5c4.6 0 7.8-1 11.4-2.5"/></g><g class="ai-clearing-core"><path pathLength="1" d="M18 7.5c.4 2.5 2 4.1 4.5 4.5-2.5.4-4.1 2-4.5 4.5-.4-2.5-2-4.1-4.5-4.5 2.5-.4 4.1-2 4.5-4.5z"/></g>',
  waiting: '<g class="ai-waiting-ring"><circle pathLength="1" cx="12" cy="12" r="8.5"/></g><g class="ai-waiting-star"><path pathLength="1" d="M12 5.5c.5 3.4 2.6 5.5 6 6-3.4.5-5.5 2.6-6 6-.5-3.4-2.6-5.5-6-6 3.4-.5 5.5-2.6 6-6z"/></g>',
};
const AI_NAMES = { clear: '待命', overcast: '思考中', storm: '執行中', clearing: '收尾', waiting: '等你' };
const aiIcon = document.getElementById('aiIcon'), aiCap = document.getElementById('aiCap');
let aiState = null;
function setAi(s) {
  s = AI_ICONS[s] ? s : 'clear';
  if (s === aiState) return;
  aiState = s;
  aiIcon.querySelector('.halo').innerHTML = AI_ICONS[s];
  aiIcon.querySelector('.ink').innerHTML = AI_ICONS[s];
  aiIcon.setAttribute('class', 'icon s-' + s);
  aiIcon.getBoundingClientRect();                         // restart the draw-in
  aiIcon.classList.add('enter');
  clearTimeout(aiIcon._t); aiIcon._t = setTimeout(() => aiIcon.classList.remove('enter'), 950);
  aiCap.textContent = 'AI · ' + AI_NAMES[s];
}
setAi('clear');
if (IS_APP) { window.petAPI.getAiState().then(setAi); window.petAPI.onAiState(setAi); }

/* ---- Settings ---- */
// 桌布 opens a list of the theme folders (themes/*/theme.json, in their order) to pick from; refreshed whenever the menu opens
let WP_STYLES = [{ id: 'weather', name: '天氣' }];
const wpName = id => (WP_STYLES.find(t => t.id === id) || { name: id }).name;
const loadStyles = () => IS_APP && window.petAPI.getWallpaperStyles().then(l => { if (l && l.length) { WP_STYLES = l; if (settingsEl.classList.contains('open')) renderMenu(); } });
let wpStyle = 'weather', iconsKey = 'Ctrl+Alt+D', timeMode = 'auto';
// per agent: status from main ('none' = that agent is not installed → its row is hidden) + the last click's message
const hooks = { claude: 'on', codex: 'none' }, hooksMsg = { claude: '', codex: '' };
const HOOKS_LABEL = { on: '已安裝', partial: '點此補齊', off: '點此安裝', error: '設定檔有誤' };
const refreshHooks = () => IS_APP && Promise.all(Object.keys(hooks).map(a => window.petAPI.hooksStatus(a).then(s => { hooks[a] = s; })))
  .then(() => { if (settingsEl.classList.contains('open')) renderMenu(); });
const hooksRow = (label, a) => ({ label, show: () => hooks[a] !== 'none', value: () => hooksMsg[a] || HOOKS_LABEL[hooks[a]] || '',
  run: () => window.petAPI.installHooks(a).then(r => { hooksMsg[a] = r.msg; refreshHooks(); }) });
const TIME_MODES = [['auto', '預設'], ['day', '日間'], ['night', '夜間']];
let rec = { state: 'idle', startedAt: 0 };
function recLabel() {
  if (rec.state === 'starting') return '啟動中…';
  if (rec.state === 'stopping') return '存檔中…';
  if (rec.state !== 'recording') return rec.hotkey ? 'Ctrl+Alt+R' : '開始';   // idle: the hotkey, as a reminder
  const s = Math.max(0, Math.floor((Date.now() - rec.startedAt) / 1000));
  return '停止 ' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
/* ---- Gear menu (2026-10-24 redesign, user: 選單太長、不夠簡潔): five rows on top, the rest one level down ----
   main: 桌布 › / 模式 / 還原桌面 / 工具 › / 設定 ›. Pages are lists of rows; a row is { label, value, run } or
   { sep } / { head } / { search } / { chips } / { grid }. Rows with an id can be pointed at by the tour. */
let view = 'main', wpQuery = '', RECENT = [], newThemes = 0;
let upd = { phase: 'idle', current: '' };
const go = v => { view = v; wpQuery = ''; focusKey = null; };
const back = label => ({ label: '‹ ' + label, cls: 'back', key: 'back', run: () => go('main') });
function updLabel() {
  const pct = upd.total ? Math.floor(upd.got / upd.total * 100) : 0;
  return { checking: '檢查中…', latest: '已是最新 ' + upd.current, downloading: '下載中 ' + pct + '%', installing: '安裝中，馬上重開…',
    available: upd.canInstall ? '更新到 ' + upd.version : '有新版 ' + upd.version, error: upd.msg || '檢查失敗' }[upd.phase] || (upd.current + ' · 檢查');
}
const PAGES = {
  main: () => [
    { id: 'wallpaper', label: '桌布', value: () => wpName(wpStyle) + ' ›', run: () => go('wallpaper') },
    // 模式: 預設 follows the clock; 日間 / 夜間 hold the wallpaper at late morning / 22:00. Click cycles.
    { label: '模式', value: () => (TIME_MODES.find(m => m[0] === timeMode) || TIME_MODES[0])[1],
      run: () => { const i = TIME_MODES.findIndex(m => m[0] === timeMode); window.petAPI.setTimeMode(TIME_MODES[(i + 1) % TIME_MODES.length][0]).then(m => { timeMode = m; renderMenu(); }); } },
    // 還原桌面 (boss key; 2026-10-23 renamed from 老闆鍵, users didn't get it): hides every VibingWrapper window;
    // same key brings them back. Right side = the hotkey; it is changed under 設定.
    { label: '還原桌面', value: () => bossLabel(), run: () => { setMenu(false); window.petAPI.bossToggle(); } },
    { id: 'tools', label: '工具', value: () => (rec.state === 'recording' ? '● ' : '') + '›', run: () => go('tools') },
    { sep: true },
    { id: 'settings', label: '設定', value: () => (upd.phase === 'available' ? '有新版 ' : '') + '›', dot: upd.phase === 'available', run: () => go('settings') },
  ],
  tools: () => [back('工具'), { sep: true },
    // 範圍截圖 / 桌面圖示: right side = the hotkey, as a reminder
    { label: '範圍截圖', value: () => capLabel(), run: () => { setMenu(false); setTimeout(() => window.petAPI.capture(), 150); } },
    { label: '螢幕錄影', value: () => recLabel(), run: () => window.petAPI.toggleRecord() },
    // Game Bar records the app window you were in; press again (or Win+Alt+R) to stop
    { label: '錄目前視窗', value: () => 'Win+Alt+R', run: () => { setMenu(false); window.petAPI.gameBar(); } },
    { label: '桌面圖示', value: () => iconsKey, run: () => { setMenu(false); window.petAPI.toggleIcons(); } },
  ],
  settings: () => [back('設定'), { sep: true },
    // Claude / Codex 連動: whether our hooks are in ~/.claude/settings.json / ~/.codex/hooks.json; click adds the missing ones
    hooksRow('Claude 連動', 'claude'),
    hooksRow('Codex 連動', 'codex'),
    { head: '快捷鍵（點一下可改）' },
    { label: '還原桌面', key: 'k-boss', value: () => keyMsg.boss || bossLabel(), run: () => startKeyCapture('boss') },
    { label: '範圍截圖', key: 'k-cap', value: () => keyMsg.capture || capLabel(), run: () => startKeyCapture('capture') },
    { sep: true },
    // 更新: checks GitHub Releases; when a newer build is there, one click downloads it and restarts into it
    { label: '更新', key: 'upd', value: () => updLabel(), dot: upd.phase === 'available',
      run: () => upd.phase === 'available' && upd.canInstall ? window.petAPI.updateInstall() : window.petAPI.updateCheck() },
    // 自動: installs by itself while Claude is idle; 手動: only the red dot, install from the row above
    { label: '　更新方式', key: 'upd-mode', value: () => upd.mode === 'manual' ? '手動' : '自動',
      run: () => window.petAPI.setUpdateMode(upd.mode === 'manual' ? 'auto' : 'manual').then(m => { upd = { ...upd, mode: m }; renderMenu(); }) },
    { label: '說明', value: () => '›', run: () => { setMenu(false); window.petAPI.openHelp(); } },
    { label: '重新啟動', run: () => window.petAPI.restart() },
    { label: '解除安裝', run: () => { setMenu(false); window.petAPI.uninstall(); } },   // main shows the confirmation
  ],
  wallpaper: wallpaperPage,
};
// 桌布: only what is installed. 最近用過 on top (once there are enough to need it), a search box once the list is
// long, the rest as two columns; browsing, downloading and removing live in 主題庫 (its own window)
function wallpaperPage() {
  const q = wpQuery.trim().toLowerCase();
  const hits = WP_STYLES.filter(t => !q || t.name.toLowerCase().includes(q) || t.id.includes(q));
  const pick = t => ({ label: t.name, tick: t.id === wpStyle, key: 't-' + t.id,
    run: () => window.petAPI.setWallpaperStyle(t.id).then(s => { wpStyle = s; RECENT = [s, ...RECENT.filter(x => x !== s)]; renderMenu(); }) });
  const recent = RECENT.map(id => WP_STYLES.find(t => t.id === id)).filter(Boolean).slice(0, 3);
  return [back('桌布'),
    ...(WP_STYLES.length > 12 ? [{ search: true }] : []),
    ...(!q && WP_STYLES.length > 6 && recent.length ? [{ head: '最近用過' }, { chips: recent.map(pick) }, { head: '全部' }] : [{ sep: true }]),
    hits.length ? { grid: hits.map(pick) } : { head: '沒有符合的桌布' },
    { sep: true },
    { id: 'library', label: '主題庫…', value: () => newThemes ? '新 ' + newThemes : '›', run: () => { setMenu(false); window.petAPI.openStore(); } },
  ];
}

const settingsEl = document.getElementById('settings'), menuEl = document.getElementById('menu'), gearEl = document.getElementById('gear');
// while hidden the menu offers just the way back
const STEALTH_MENU = [{ label: '取消隱藏', value: () => bossLabel(), run: () => { setMenu(false); window.petAPI.bossToggle(); } }];
let focusKey = null;                                      // the control to focus again after a re-render (keyboard use)
function button(cls, s, inner) {
  const b = document.createElement('button');
  b.className = cls + (s.cls ? ' ' + s.cls : '') + (s.dot ? ' dot' : '') + (tourAt() && tourAt() === s.id ? ' coach' : '');
  b.setAttribute('role', 'menuitem'); b.dataset.k = s.key || s.id || s.label;
  if (s.title) b.title = s.title;
  b.append(...inner);
  b.addEventListener('click', ev => { ev.stopPropagation(); focusKey = b.dataset.k; s.run(); renderMenu(); });
  return b;
}
const tick = on => { const t = document.createElement('span'); t.className = 'tick'; t.textContent = on ? '✓' : ''; return t; };
const nameSpan = text => { const n = document.createElement('span'); n.className = 'nm'; n.textContent = text; return n; };
function renderMenu() {
  const page = boss.hidden ? STEALTH_MENU : (IS_APP ? PAGES[view] || PAGES.main : () => [{ label: '重新整理', run: () => location.reload() }])();
  const rows = (typeof page === 'function' ? page() : page).filter(s => !s.show || s.show());
  const coach = coachBox();
  menuEl.classList.toggle('wide', (view === 'wallpaper' || !!coach) && !boss.hidden);
  menuEl.replaceChildren(...(coach ? [coach] : []), ...rows.map(s => {
    if (s.sep) { const d = document.createElement('div'); d.className = 'sep'; return d; }
    if (s.head) { const d = document.createElement('div'); d.className = 'head'; d.textContent = s.head; return d; }
    if (s.search) {
      const i = document.createElement('input'); i.className = 'search'; i.placeholder = '搜尋桌布…'; i.value = wpQuery; i.dataset.k = 'search';
      i.addEventListener('input', () => { wpQuery = i.value; focusKey = 'search'; renderMenu(); });
      i.addEventListener('keydown', ev => { if (ev.key === 'Enter') { const t = menuEl.querySelector('.grid .tile'); if (t) t.click(); } });
      return i;
    }
    if (s.chips || s.grid) {
      const d = document.createElement('div'); d.className = s.chips ? 'chips' : 'grid';
      d.append(...(s.chips || s.grid).map(t => button(s.chips ? 'chip' : 'tile', { ...t, title: t.label }, [tick(t.tick), nameSpan(t.label)])));
      return d;
    }
    const inner = [nameSpan(s.label)];
    if (s.value) { const v = document.createElement('span'); v.className = 'val'; v.textContent = s.value(); inner.push(v); }
    return button('item', s, inner);
  }));
  const f = focusKey && menuEl.querySelector(`[data-k="${CSS.escape(focusKey)}"]`);
  if (f) { f.focus(); if (f.tagName === 'INPUT') f.setSelectionRange(f.value.length, f.value.length); }
  gearEl.classList.toggle('dot', upd.phase === 'available' && !boss.hidden);
}
function setMenu(open) {
  if (open) {
    keyMsg.boss = keyMsg.capture = ''; hooksMsg.claude = hooksMsg.codex = ''; loadStyles(); refreshHooks();
    if (IS_APP) {
      window.petAPI.getWallpaperStyle().then(s => { if (s && s !== wpStyle) { wpStyle = s; renderMenu(); } });   // the tray may have changed it
      window.petAPI.recentThemes().then(r => { RECENT = r || []; if (view === 'wallpaper') renderMenu(); });
      // 主題庫's "新 N": packs not installed yet or with an update (the catalog is cached for 5 minutes in main)
      window.petAPI.themeCatalog().then(r => { newThemes = Array.isArray(r) ? r.filter(t => t.status === 'available' || t.status === 'update').length : 0; });
    }
  } else { go('main'); if (capturing) endKeyCapture(''); }
  settingsEl.classList.toggle('open', open); if (open) { renderMenu(); tourMenuOpened(); }
  if (IS_APP && window.petAPI.menuOpen) window.petAPI.menuOpen(open);
}

/* keyboard: ↑↓ move, Enter picks, ← or Esc goes back a page (Esc on the main page closes), → opens a sub-page,
   typing on the 桌布 page goes into its search box */
window.addEventListener('keydown', ev => {
  if (capturing || !settingsEl.classList.contains('open')) return;
  const items = [...menuEl.querySelectorAll('button, input')], i = items.indexOf(document.activeElement);
  const inInput = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    const n = items.length; if (!n) return;
    items[i < 0 ? (ev.key === 'ArrowDown' ? 0 : n - 1) : (i + (ev.key === 'ArrowDown' ? 1 : n - 1)) % n].focus();
  } else if (ev.key === 'Escape' || (ev.key === 'ArrowLeft' && !inInput)) {
    ev.preventDefault(); ev.stopImmediatePropagation();
    if (view !== 'main') { const from = view; go('main'); focusKey = from; renderMenu(); } else if (ev.key === 'Escape') setMenu(false);
  } else if (ev.key === 'ArrowRight' && !inInput && i >= 0 && /›$/.test(items[i].textContent)) {
    ev.preventDefault(); items[i].click();
  } else if (view === 'wallpaper' && !inInput && ev.key.length === 1 && !ev.ctrlKey && !ev.altKey && !ev.metaKey) {
    const s = menuEl.querySelector('input.search'); if (s) s.focus();      // the key itself then lands in the box
  }
}, true);

/* 老闆鍵／範圍截圖: 變更快捷鍵 records the next key combination pressed (the old key is paused meanwhile) */
let boss = { key: 'Control+Alt+B', registered: true }, cap = { key: 'Control+Alt+S', registered: true }, capturing = null;
const keyMsg = { boss: '', capture: '' };
const KEY_API = { boss: { pause: on => window.petAPI.bossCapture(on), set: acc => window.petAPI.setBossKey(acc), got: r => { boss = r; } },
  capture: { pause: on => window.petAPI.captureCapture(on), set: acc => window.petAPI.setCaptureKey(acc), got: r => { cap = r; } } };
const prettyKey = acc => acc.replace('Control', 'Ctrl').replace('Super', 'Win');
const bossLabel = () => prettyKey(boss.key) + (boss.registered ? '' : ' 被占用');
const capLabel = () => prettyKey(cap.key) + (cap.registered ? '' : ' 被占用');
function startKeyCapture(which) { if (capturing) endKeyCapture(''); capturing = which; keyMsg[which] = '請按新組合…'; if (IS_APP) KEY_API[which].pause(true); }
function endKeyCapture(msg) { const w = capturing; if (!w) return; capturing = null; keyMsg[w] = msg; if (IS_APP) KEY_API[w].pause(false); renderMenu(); }
const PUNCT = { Space: 'Space', Backquote: '`', Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', Backslash: '\\' };
const keyName = code => /^Key[A-Z]$/.test(code) ? code.slice(3) : /^Digit\d$/.test(code) ? code.slice(5) : /^F\d{1,2}$/.test(code) ? code : PUNCT[code] || null;
window.addEventListener('keydown', ev => {
  if (!capturing) return;
  ev.preventDefault(); ev.stopImmediatePropagation();
  if (ev.key === 'Escape') return endKeyCapture('');
  const k = keyName(ev.code);
  if (!k) return;                                       // a modifier on its own: keep waiting
  const mods = [ev.ctrlKey && 'Control', ev.altKey && 'Alt', ev.shiftKey && 'Shift', ev.metaKey && 'Super'].filter(Boolean);
  if (!mods.length && !/^F\d/.test(k)) { keyMsg[capturing] = '要加 Ctrl／Alt／Shift'; renderMenu(); return; }
  const w = capturing;
  KEY_API[w].set([...mods, k].join('+')).then(r => { KEY_API[w].got(r); endKeyCapture(r.ok ? '已更新' : '被占用，沒換'); });
}, true);
window.addEventListener('blur', () => { if (capturing) endKeyCapture(''); });

/* ---- Tour (2026-10-24, user: localStorage 得核對版號，若有更新導覽可以重新引導) ----
   Each step says which version brought it. localStorage keeps the version whose tour was last finished
   (tourSeen); a fresh install sees every step, an update sees only the steps newer than that. The first step
   is a bubble under the gear; the rest point at menu rows from a box at the top of the menu. */
const TOUR = [
  { since: '0.1.5', at: 'gear', text: '我在這裡：左邊是 Claude 的狀態，點齒輪看設定' },
  { since: '0.2.0', at: 'wallpaper', text: '換桌布在這裡：最近用過的排最上面，其他主題到「主題庫」逛' },
  { since: '0.2.0', at: 'tools', text: '截圖、錄影、收桌面圖示，都收進「工具」' },
  { since: '0.2.0', at: 'settings', text: 'Claude 連動、改快捷鍵、更新和說明，在「設定」' },
];
const vnum = s => String(s).split('.').map(Number);
const vgt = (a, b) => { const x = vnum(a), y = vnum(b); for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); return false; };
const store = { get: k => { try { return localStorage.getItem(k); } catch (_) { return '-'; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };
let tour = [], tourVersion = '0.0.0', bubbleEl = null;
const tourAt = () => tour.length && tour[0].at !== 'gear' && settingsEl.classList.contains('open') && view === 'main' ? tour[0].at : null;
function startTour(version) {
  tourVersion = version;
  // storage that cannot be read ('-') means no tour at all, rather than one on every start
  const seen = store.get('tourSeen') || (store.get('introSeen') ? '0.1.5' : '0.0.0');   // introSeen: the 0.1.5 bubble's flag
  if (seen === '-') return;
  tour = TOUR.filter(s => vgt(s.since, seen) && !vgt(s.since, version));
  if (!tour.length) return;
  // an update with only menu steps still needs the user to open the menu: the bubble says what changed
  const text = tour[0].at === 'gear' ? tour[0].text : `更新到 ${version}：選單改版了，點齒輪看看`;
  if (tour[0].at === 'gear') tour.shift();
  showBubble(text);
}
function showBubble(text) {
  bubbleEl = document.createElement('div');
  bubbleEl.id = 'intro'; bubbleEl.className = 'ui-hit';
  bubbleEl.textContent = text;
  bubbleEl.addEventListener('click', ev => { ev.stopPropagation(); endBubble(); });
  document.body.append(bubbleEl); document.body.classList.add('intro');
  setTimeout(endBubble, 15000);
}
function endBubble() {
  if (!bubbleEl) return;
  document.body.classList.remove('intro'); bubbleEl.classList.add('gone');
  const el = bubbleEl; bubbleEl = null; setTimeout(() => el.remove(), 700);
  if (!tour.length) finishTour();
}
function finishTour() { tour = []; store.set('tourSeen', tourVersion); }
function tourMenuOpened() { endBubble(); }
// the box at the top of the menu: the current step, its place in the tour, and 下一步 / 知道了
function coachBox() {
  if (!tourAt()) return null;
  const d = document.createElement('div'); d.className = 'coach-box';
  const t = document.createElement('div'); t.textContent = tour[0].text;
  const row = document.createElement('div'); row.className = 'coach-row';
  const n = document.createElement('span'); n.textContent = tour.length > 1 ? `還有 ${tour.length - 1} 個` : '';
  const skip = document.createElement('button'); skip.textContent = '略過'; skip.className = 'ghost';
  const next = document.createElement('button'); next.textContent = tour.length > 1 ? '下一個' : '知道了';
  skip.addEventListener('click', ev => { ev.stopPropagation(); finishTour(); renderMenu(); });
  next.addEventListener('click', ev => { ev.stopPropagation(); tour.shift(); if (!tour.length) finishTour(); focusKey = null; renderMenu(); });
  row.append(n, skip, next); d.append(t, row);
  return d;
}
if (IS_APP) window.petAPI.version().then(startTour); else startTour('9.9.9');   // a plain browser preview shows every step

gearEl.addEventListener('click', ev => { ev.stopPropagation(); setMenu(!settingsEl.classList.contains('open')); });
settingsEl.addEventListener('click', ev => ev.stopPropagation());
document.addEventListener('click', () => setMenu(false));
window.addEventListener('keydown', ev => { if (ev.key === 'Escape') setMenu(false); });

if (IS_APP) {
  window.petAPI.getWallpaperStyle().then(s => { wpStyle = s || 'weather'; }); loadStyles();
  window.petAPI.getTimeMode().then(m => { timeMode = m || 'auto'; });
  window.petAPI.iconsHotkey().then(ok => { iconsKey = ok ? 'Ctrl+Alt+D' : '熱鍵被占用'; });
  const setBoss = s => { if (!s) return; boss = s; document.body.classList.toggle('stealth', !!s.hidden); if (settingsEl.classList.contains('open')) renderMenu(); };
  window.petAPI.bossKey().then(setBoss); window.petAPI.onBossState(setBoss);
  window.petAPI.captureKey().then(s => { if (s) cap = s; });
  const setUpd = s => { if (!s) return; upd = s; renderMenu(); };   // renderMenu also sets the gear's dot
  window.petAPI.updateState().then(setUpd); window.petAPI.onUpdateState(setUpd);
  const setRec = s => {
    rec = s || rec;
    document.body.classList.toggle('recording', rec.state === 'recording');
    if (settingsEl.classList.contains('open')) renderMenu();
  };
  window.petAPI.getRecState().then(setRec); window.petAPI.onRecState(setRec);
  setInterval(() => { if (rec.state === 'recording' && settingsEl.classList.contains('open')) renderMenu(); }, 1000);

  /* click-through everywhere except the strip and its open menu (main.js starts with
     setIgnoreMouseEvents(true, { forward: true }), so mouse moves still reach us) */
  let interactive = false;
  const hit = on => { if (on !== interactive) { interactive = on; window.petAPI.setInteractive(on); } };
  document.addEventListener('mousemove', ev => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    hit(!!(el && el.closest('.ui-hit')));
  });
  document.addEventListener('mouseleave', () => { hit(false); });
}
</script>
</body>
